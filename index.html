<html lang="zh-CN">

  <title>信息差名单 · 每日监控</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #4a9aef;
      --tag-bg: #1f2937;
      --time-bg: #1c2128;
      --success: #3fb950;
      --error: #f85149;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    
    header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    
    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    .stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    
    .stat span {
      color: var(--accent);
      font-weight: 600;
    }
    
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    
    .toolbar-left {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      flex: 1;
    }
    
    .toolbar-right {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .add-form {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      background: var(--bg-card);
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    
    .add-form input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.3rem;
      width: 150px;
      outline: none;
    }
    
    .add-form input::placeholder {
      color: var(--text-muted);
    }
    
    .add-form button {
      padding: 0.4rem 0.8rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }
    
    .add-form button:hover {
      background: var(--accent-hover);
    }
    
    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: opacity 0.2s;
    }
    
    .refresh-btn:hover {
      opacity: 0.85;
    }
    
    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .sort-btn {
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    
    .sort-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    
    .sort-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    
    .filter-btn {
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    
    .filter-btn.custom {
      background: var(--bg-hover);
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .filter-btn .remove {
      margin-left: 0.3rem;
      opacity: 0.6;
      font-size: 0.7rem;
    }
    
    .filter-btn .remove:hover {
      opacity: 1;
    }
    
    .tweet-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .tweet {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      transition: border-color 0.2s;
    }
    
    .tweet:hover {
      border-color: var(--text-muted);
    }
    
    .tweet-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1rem;
      color: #fff;
      flex-shrink: 0;
    }
    
    .user-info {
      flex: 1;
      min-width: 0;
    }
    
    .user-name {
      font-weight: 600;
      font-size: 0.95rem;
    }
    
    .user-handle {
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    
    .tag {
      background: var(--tag-bg);
      color: var(--text-muted);
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    
    .tweet-content {
      margin-left: 48px;
    }
    
    .tweet-text {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 0.5rem;
      word-break: break-word;
    }
    
    .tweet-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    
    .tweet-time {
      background: var(--time-bg);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    
    .tweet-link {
      color: var(--accent);
      text-decoration: none;
    }
    
    .tweet-link:hover {
      text-decoration: underline;
    }
    
    .empty {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 2rem;
      color: var(--text-muted);
    }
    
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    
    .note {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    
    .note strong {
      color: var(--accent);
    }
    
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.75rem 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .toast.show {
      opacity: 1;
    }
    
    .toast.success {
      border-color: var(--success);
      color: var(--success);
    }
    
    .toast.error {
      border-color: var(--error);
      color: var(--error);
    }
    
    @media (max-width: 600px) {
      .stats { flex-direction: column; gap: 0.5rem; }
      .tweet-content { margin-left: 0; }
      .toolbar { flex-direction: column; }
      .toolbar-left, .toolbar-right { width: 100%; justify-content: center; }
      .add-form { width: 100%; }
      .add-form input { width: 100%; }
    }
  </style>

looks very different because humans now move upwards and program at a higher level - the basic unit of interest is not one file but one agent. It’s still programming.", "link": "https://nitter.net/karpathy/status/2031767720933634100", "date": "Wed, 11 Mar 2026 16:22:27 GMT", "desc": "Expectation: the age of the IDE is over Reality: we’re going to need a bigger IDE (imo). It just looks very different because humans now move upwards and program at a higher level - the basic unit of interest is not one file but one agent. It’s still programming. Andrej Karpathy (@karpathy) tmux grids are awesome, but i feel a need to have a proper \"agent command center\" IDE for teams of them, which I could maximize per monitor. E.g. I want to see/hide toggle them, see if any are idle, pop open ", "username": "karpathy", "name": "Andrej Karpathy", "tag": "深度学习"}, {"title": "Excited to share @Standard_Kernel's seed round and some reflections on what we’ve learned about kernel generation and what we believe is next. Grateful to our amazing team, supporters, and the broader community pushing this space forward.", "link": "https://nitter.net/anneouyang/status/2031757990806823313", "date": "Wed, 11 Mar 2026 15:43:47 GMT", "desc": "Excited to share @Standard_Kernel's seed round and some reflections on what we’ve learned about kernel generation and what we believe is next. Grateful to our amazing team, supporters, and the broader community pushing this space forward.", "username": "JeffDean", "name": "Jeff Dean", "tag": "Google AI"}, {"title": "Welcome to the team @Wiz_io!", "link": "https://nitter.net/sundarpichai/status/2031738734350361069", "date": "Wed, 11 Mar 2026 14:27:16 GMT", "desc": "Welcome to the team @Wiz_io! Thomas Kurian (@ThomasOrTK) Today, we announced that Google has completed its acquisition of @wiz_io. Together, we’ll provide customers with a comprehensive platform to secure their cloud and hybrid environments. Coupled with our Google Unified Security platform, we will help accelerate the adoption of multicloud cybersecurity, the use of multicloud environments, and drive innovation and growth in cloud computing. — https://nitter.net/ThomasOrTK/status/20317172854347", "username": "sundarpichai", "name": "Sundar Pichai", "tag": "Google CEO"}, {"title": "R to ✨WaytoAGI知识库整理了超多OpenClaw相关教程：\nhttps://waytoagi.feishu.cn/wiki/CCR4wl3upi6dF9kVE5YcAcGcnlU", "link": "https://nitter.net/WaytoAGI/status/2031649558393139357", "date": "Wed, 11 Mar 2026 08:32:55 GMT", "desc": "✨WaytoAGI知识库整理了超多OpenClaw相关教程： waytoagi.feishu.cn/wiki/CCR4…", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "🦞OpenClaw技术架构拆解，带你手搓一个最小的龙虾\n\n我们邀请到了Share AI 的来新璐拆解了OpenClaw 技术架构，结论极其简单：\n\n小龙虾 = Claude Code + 定时器 + 自己没事给自己找事干\n\n就这两个机制，让它从被动工具变成了主动运转的个人 AI 助手。\n\n1/ 三个核心机制\n\n🕐 定时任务 \n支持一次性、周期性、标准 Cron 三种模式。用户可以设，agent 自己也可以主动给自己加任务。\n\n💓 心跳 \n每30秒系统自动发一条消息，让 agent 看看有没有事可以做。有事就干，没事不打扰你。这是它和 Claude Code 的本质区别：Claude Code 踹一下动一下，小龙虾每30秒自己醒一次。\n\n🧠 Soul \n把人格设定单独抽成 soul.md，agent 启动时自动读取。社区里可以互相分享 soul.md，\"传播灵魂\"说的就是这个。\n\n2/ 现场发生了什么\n\n分享进行20分钟，他开播前交给 agent 的翻译任务已经悄悄完成，英语和日语版本静静出现在 GitHub 仓库里，他自己都没注意。\n\nOpenClaw 一周新增约5000个 commit，相当于一个工程师连续干一年的量。\"这个项目99%是非人类在更新。\"\n\n最炸的环节：让小龙虾给网友打 FaceTime，电话真的拨通了，对方直接被拉进来即兴连线。\n\n分享快结束时让龙虾\"退出飞书\"，现场就这么被它亲手搞掉了。\n\n3/ 几个判断\n\n本地部署远比云端有价值。云端能干的事和 Manus 没区别，本地能读你所有文件、清理磁盘、帮你找东西。\n\n权限越大，风险越大，有人让它\"继续干所有能干的事\"，差点把给甲方的数据也删了。\n\n复杂任务尽量用 Claude，差距非常明显。有 Claude Code 订阅的可以把 agent core 替换成 Claude Code CLI，复用订阅不走 API，成本更低。\n\n整理自 WaytoAGI 分享，嘉宾：来新璐\n#通往AGI之路 #WaytoAGI #Openclaw #小龙虾 #开发者 #AI开源社区 #shareAI", "link": "https://nitter.net/WaytoAGI/status/2031649232814485733", "date": "Wed, 11 Mar 2026 08:31:37 GMT", "desc": "🦞OpenClaw技术架构拆解，带你手搓一个最小的龙虾 我们邀请到了Share AI 的来新璐拆解了OpenClaw 技术架构，结论极其简单： 小龙虾 = Claude Code + 定时器 + 自己没事给自己找事干 就这两个机制，让它从被动工具变成了主动运转的个人 AI 助手。 1/ 三个核心机制 🕐 定时任务 支持一次性、周期性、标准 Cron 三种模式。用户可以设，agent 自己也可以主动给自己加任务。 💓 心跳 每30秒系统自动发一条消息，让 agent 看看有没有事可以做。有事就干，没事不打扰你。这是它和 Claude Code 的本质区别：Claude Code 踹一下动一下，小龙虾每30秒自己醒一次。 🧠 Soul 把人格设定单独抽成 soul.md，agent 启动时自动读取。社区里可以互相分享 soul.md，\"传播灵魂\"说的就是这个。 2/ 现场发生了什么 分享进行20分钟，他开播前交给 agent 的翻译任务已经悄悄完成，英语和日语版本静静出现在 GitHub 仓库里，他自己都没注意。 OpenClaw 一周新增约5000个 commit，相当于一个工程师连续干", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "APP 设计里的游戏感和游戏化\n\n#迷你设计课\n\n好久没黑多邻国和 Anki 了，今天继续\n\nCapWords 学外语、背单词的方式，特别像玩“宝可梦”游戏搜集宝贝，它利用了每个人都有的好奇心，以及搜集好东西的本能\n\n每天都能拍到意想不到的照片、学到意想不到的单词，别说是小朋友喜欢玩这个“学单词”的游戏，成年人也能很愉快地积累单词量\n\n这种采集和收获过程，最终能激发你的内啡肽，让你产生发自内心的成就感和愉悦感，让你还想一直玩下去\n\n现在越来越多的产品设计也像 CapWords 这样，引入了游戏的手感和游戏的体验，这种设计方法一般叫做 游戏感 / Game-like design，最典型的例子还有 not boring 出的有趣天气预报 app\n\n---\n\n相反，多邻国背单词的方式，性质和小时候父母说“英语考95分以上，就奖励你100块！”很相似，当时很刺激，但现在你既不记得当时考试里的单词、也不记得 100 块拿来买什么好东西了\n\n多邻国刺激的是多巴胺，当时的确也很爽，但多邻国带来的这一点点刺激，很快就不足以抵消重复背单词的无聊和痛苦\n\n多邻国这种设计方法，就是 游戏化 / Gamification，它创造一个奖励系统来骗你干苦力活\n\n---\n\n现在的用户越来越聪明，普通的“游戏化”越来越难打动用户。这时候就体现出了“游戏感”的好处，谁不喜欢玩啊？！\n\n至于 Anki，它只适合特定的人", "link": "https://nitter.net/nishuang/status/1909820720076501261", "date": "Wed, 09 Apr 2025 04:08:37 GMT", "desc": "APP 设计里的游戏感和游戏化 #迷你设计课 好久没黑多邻国和 Anki 了，今天继续 CapWords 学外语、背单词的方式，特别像玩“宝可梦”游戏搜集宝贝，它利用了每个人都有的好奇心，以及搜集好东西的本能 每天都能拍到意想不到的照片、学到意想不到的单词，别说是小朋友喜欢玩这个“学单词”的游戏，成年人也能很愉快地积累单词量 这种采集和收获过程，最终能激发你的内啡肽，让你产生发自内心的成就感和愉悦感，让你还想一直玩下去 现在越来越多的产品设计也像 CapWords 这样，引入了游戏的手感和游戏的体验，这种设计方法一般叫做 游戏感 / Game-like design，最典型的例子还有 not boring 出的有趣天气预报 app --- 相反，多邻国背单词的方式，性质和小时候父母说“英语考95分以上，就奖励你100块！”很相似，当时很刺激，但现在你既不记得当时考试里的单词、也不记得 100 块拿来买什么好东西了 多邻国刺激的是多巴胺，当时的确也很爽，但多邻国带来的这一点点刺激，很快就不足以抵消重复背单词的无聊和痛苦 多邻国这种设计方法，就是 游戏化 / Gamification，它创", "username": "nishuang", "name": "倪爽", "tag": "产品工作流+趋势判断"}, {"title": "Amie 大变身\n\n他们原来定位是日历、to-do、email 三合一，Amie 2.0 发布之后，产品彻底转型，变成了提高会议效率的 AI 效率工具\n\n官网也从曾经最漂亮的效率工具官网，变成了图一这样子。视频展示的是以前的官网", "link": "https://nitter.net/nishuang/status/1909812590764577226", "date": "Wed, 09 Apr 2025 03:36:18 GMT", "desc": "Amie 大变身 他们原来定位是日历、to-do、email 三合一，Amie 2.0 发布之后，产品彻底转型，变成了提高会议效率的 AI 效率工具 官网也从曾经最漂亮的效率工具官网，变成了图一这样子。视频展示的是以前的官网 Video", "username": "nishuang", "name": "倪爽", "tag": "产品工作流+  04 Mar 2026 18:55:46 GMT", "desc": "Apple just named its latest laptop Neo -- same name as my son! Should I buy one? If I run Amazon Nova on an Apple Neo I hope to blow both of my kids' minds.", "username": "AndrewYNg", "name": "Andrew Ng", "tag": "AI教育"}, {"title": "New course: Build and Train an LLM with JAX, built in partnership with @Google and taught by @chrisachard.\n\nJAX is the open-source library behind Google's Gemini, Veo, and other advanced models. This short course teaches you to build and train a 20-million parameter language model from scratch using JAX and its ecosystem of tools.\n\nYou'll implement a complete MiniGPT-style architecture from scratch, train it, and chat with your finished model through a graphical interface.\n\nSkills you'll gain:\n- Learn JAX's core primitives: automatic differentiation, JIT compilation, and vectorized execution\n- Build a MiniGPT-style LLM using Flax/NNX, implementing embedding and transformer blocks\n- Load a pretrained MiniGPT model and run inference through a chat interface\n\nCome learn this important software layer for building LLMs!\n\nhttps://www.deeplearning.ai/short-courses/build-and-train-an-llm-with-jax/", "link": "https://nitter.net/AndrewYNg/status/2029266102178693378", "date": "Wed, 04 Mar 2026 18:41:55 GMT", "desc": "New course: Build and Train an LLM with JAX, built in partnership with @Google and taught by @chrisachard. JAX is the open-source library behind Google's Gemini, Veo, and other advanced models. This short course teaches you to build and train a 20-million parameter language model from scratch using JAX and its ecosystem of tools. You'll implement a complete MiniGPT-style architecture from scratch, train it, and chat with your finished model through a graphical interface. Skills you'll gain: - Le", "username": "AndrewYNg", "name": "Andrew Ng", "tag": "AI教育"}, {"title": "R to Shared deck URL correcton: https://www.popai.pro/ppt-share?shareKey=8c2210db49257e3602097540604da4f3c901987310cafa70d618029afb77a456&utm_source=presentationsharepage", "link": "https://nitter.net/kaifulee/status/1973515122154021036", "date": "Wed, 01 Oct 2025 22:27:25 GMT", "desc": "Shared deck URL correcton: popai.pro/ppt-share?shareKey…", "username": "kaifulee", "name": "李开复", "tag": "大模型+AI产业趋势"}, {"title": "R to And @yukez 's announcement: \n\nhttps://x.com/yukez/status/2024639427788857707?s=20", "link": "https://nitter.net/DrJimFan/status/2026350146066493831", "date": "Tue, 24 Feb 2026 17:34:57 GMT", "desc": "And @yukez 's announcement: nitter.net/yukez/status/202463942… Yuke Zhu (@yukez) We have seen rapid progress in humanoid control — specialist robots can reliably generate agile, acrobatic, but preset motions. Our singular focus this year: putting generalist humanoids to do real work. To progress toward this goal, we developed SONIC (nvlabs.github.io/GEAR-SONIC/), a Behavior Foundation Model for real-time, whole-body motion generation that supports teleoperation and VLA inference for loco-manipul", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "R to Website: https://nvlabs.github.io/GEAR-SONIC/\nCodebase and weights: https://github.com/NVlabs/GR00T-WholeBodyControl\nWhitepaper: https://arxiv.org/abs/2511.07820\n\nCheck out @zhengyiluo's post:\nhttps://x.com/zhengyiluo/status/2024647574440071287?s=20", "link": "https://nitter.net/DrJimFan/status/2026350144300658891", "date": "Tue, 24 Feb 2026 17:34:56 GMT", "desc": "Website: nvlabs.github.io/GEAR-SONIC/ Codebase and weights: github.com/NVlabs/GR00T-Whol… Whitepaper: arxiv.org/abs/2511.07820 Check out @zhengyiluo's post: nitter.net/zhengyiluo/status/2024… Zhengyi “Zen” Luo (@zhengyiluo) SONIC is now open-source! Generalist whole-body teleoperation for EVERYONE! Our team has long been building comprehensive pipelines for whole-body control, kinematic planner, and teleoperation, and they will all be shared. This will be a continuous update; inference code + mo", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "What can half of GPT-1 do? We trained a 42M transformer called SONIC to control the body of a humanoid robot. It takes a remarkable amount of subconscious processing for us humans to squat, turn, crawl, sprint. SONIC captures this \"System 1\" - the fast, reactive whole-body intelligence - in a single model that translates any motion command into stable, natural motor signals. And it's all open-source!! \n\nThe key insight: motion tracking is the one, true scalable task for whole body control. Instead of hand-engineering rewards for every new skill, we use dense, frame-by-frame supervision from human mocap data. The data itself encodes the reward function: \"configure your limbs in any human-like position while maintaining balance\".\n\nWe scaled humanoid motion RL to an unprecedented scale: 100M+ mocap frames and 500,000+ parallel robots across 128 GPUs. NVIDIA Isaac Lab allows us to accelerate physics at 10,000x faster tick, giving robots many years of virtual experience in only hours of wall clock time. After 3 days of training, the neural net transfers zero-shot to the real G1 robot with no finetuning. 100% success rate across 50 diverse real-world motion sequences. \n\nOne SONIC policy supports all of the following:\n\n- VR whole-body teleoperation\n- Human video. Just point a webcam to live stream motions.\n- Text prompts. \"Walk sideways\", \"dance like a monkey\", \"kick your left foot\", etc.\n- Music audio. The robot dances to the beat, adapting to tempo and rhythm.\n- VLA foundation models. We plugged in GR00T N1.5 and achieved 95% success on mobile tasks.\n\nWe open-source the code and model checkpoints!! Deep dive in thread:", "link": "https://nitter.net/DrJimFan/status/2026350142652383587", "date": "Tue, 24 Feb 2026 17:34:56 GMT", "desc": "What can half of GPT-1 do? We trained a 42M transformer called SONIC to control the body of a humanoid robot. It takes a remarkable amount of subconscious processing for us humans to squat, turn, crawl, sprint. SONIC captures this \"System 1\" - the fast, reactive whole-body intelligence - in a single model that translates any motion command into stable, natural motor signals. And it's all open-source!! The key insight: motion tracking is the one, true scalable task for whole body control. Instead", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "R to Early bird tickets available until March 25: https://luma.com/3iwspjhl", "link": "https://nitter.net/WaytoAGI/status/2033950924738335109", "date": "Tue, 17 Mar 2026 16:57:44 GMT", "desc": "Early bird tickets available until March 25: luma.com/3iwspjhl", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "I have so much gratitude to people who wrote extremely complex software character-by-character. It already feels difficult to remember how much effort it really took.\n\nThank you for getting us to this point.", "link": "https://nitter.net/sama/status/2033935276079510011", "date": "Tue, 17 Mar 2026 15:55:33 GMT", "desc": "I have so much gratitude to people who wrote extremely complex software character-by-character. It already feels difficult to remember how much effort it really took. Thank you for getting us to this point.", "username": "sama", "name": "Sam Altman", "tag": "OpenAI CEO"}, {"title": "April 8 — AGI HORIZON: Tokyo 2026 | Global AI Builders Summit will take place at Happo-en in Tokyo, Japan.\n\nHosted by WaytoAGI, this highly curated summit converges the world's top AI leaders, tech practitioners, visionary founders, creators, and tier-1 investors. \n\nExperience a high-octane day featuring immersive Keynotes, thought-provoking Panel Discussions, lightning-fast Demo Shows, breathtaking AI Art Exhibitions, and exclusive VVIP Tea Ceremony Networking in a 400-year-old Zen garden.\n\nThe future is unfolding.\n\nTokyo, April 8.\n#waytoagi #ai #tokyo #AGIhorizon", "link": "https://nitter.net/WaytoAGI/status/2033834562007273784", "date": "Tue, 17 Mar 2026 09:15:21 GMT", "desc": "April 8 — AGI HORIZON: Tokyo 2026 | Global AI Builders Summit will take place at Happo-en in Tokyo, Japan. Hosted by WaytoAGI, this highly curated summit converges the world's top AI leaders, tech practitioners, visionary founders, creators, and tier-1 investors. Experience a high-octane day featuring immersive Keynotes, thought-provoking Panel Discussions, lightning-fast Demo Shows, breathtaking AI Art Exhibitions, and exclusive VVIP Tea Ceremony Networking in a 400-year-old Zen garden. The fut", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "比龙虾更可控，首个为一人公司打造的 AI 工作空间 Floatboat 来了\n\n我们邀请到了 http://floatboat.ai 创始人少卿，分享他花了大半年打磨的 all-in-one AI 工作台 Floatboat。\n\n从产品逻辑到真实用法，每个案例都是可以直接抄的工作流，信息量拉满👇\n\nFloatboat 解决了什么问题？\n\n做复杂项目时，你可能同时开着文件管理器、浏览器、AI工具、文档……每切换一次都是打断，上下文来回传。\n\n少卿的核心判断：上下文管理 = 文件夹管理 + 标签页管理\n解法：把 chat / file manager / browser 三个视图放进同一界面，自由组合，随时拖拽，切换时间直接省掉。\n\n几个关键功能\n\n📁 多视图自由拼合 \nchat、file manager、browser 三个视图可以任意组合并排显示。演示里少卿同时开了5个文件夹，每个文件夹是一个独立上下文，你告诉 agent \"把这个转成 PDF\"，它自己知道你指的是哪一个，不需要再解释一遍。\n\n🖱️ 全局拖拽，文件即上下文\n文件管理器是完整可用的，不是摆设。你可以直接把文档拖进对话，告诉 agent \"把这几个版本合并一下\"或者\"选中这份转成 PDF\"，全程不需要手动上传、也不需要切换窗口，选中即处理。\n\n📸 截图存 Memo，一键建日程\n演示里少卿截了一张直播预告图，存入 Memo 后点一下 combo skill，agant 自动解析出标题、时间、内容，直接写入系统日历。专门做了截图入口，是因为很多时候图片根本拖不出来，这个路径更顺。\n\n🔁 任务沉淀为可复用 Skill \n跑完一个任务，觉得这个流程值得留下来，点一下\"沉淀为技能\"，agent 会把有效路径提炼出来保存到技能库。这些 Skill 可以在其他会话里直接加载，也可以上架官方市场供其他用户安装，后续经济系统上线后还支持二创分成。\n\n💬 龙虾模式：把 agent 拉进 IM 里干活 \n开启后可以把创建好的 agent 拉进飞书群或 Telegram。你在手机上发消息，agent 在电脑上执行任务。出门吃饭前布置好任务，回来打开手机问\"做完了没\"，agent 直接回复结果，不需要再坐回电脑前重新操作一遍。\n\n社区用户真实案例\n\nAI短剧创作者陈星：输入主题自动生成项目文件夹结构（梗概 / 角色 / 分镜 / 音频），分屏把即梦、素材、提示词全放一起，省掉大量工具切换\n\n入境游创业者刘宇龙：喂 logo 和品牌文档 → 自动生成官网页面，对话修改文案，中英文报价单一并输出，整套流程保存为 Skill 直接复用\n\n实用信息\n🤖 内置 Gemini & Claude，多模态推荐首选 Gemini \n🔌 支持接入 n8n / Dify / Coze，填入自己的 key 积分消耗更低 \n🔄 文件夹整理支持一键回滚，放心试\n\n如果你是一人公司、自由职业者，或者每天在多个工具之间反复横跳，这套思路值得认真看一看。\n#WaytoAGI #AITools #AgentWorkflow #Productivity #FloatboatAI", "link": "ht 2026 15:31:04 GMT", "desc": "We’re also launching Immersive Navigation - our biggest navigation upgrade in over a decade! A new vivid 3D view better reflects your surroundings, with helpful road details like lanes, crosswalks, traffic lights etc. Gemini models analyze real world imagery from Street View and aerial photos to give you an accurate view of landmarks along your route. Starts rolling out in the US today. Video", "username": "sundarpichai", "name": "Sundar Pichai", "tag": "Google CEO"}, {"title": "We’re bringing new capabilities powered by Gemini models to @googlemaps.\n\nWith Ask Maps, get answers to complex questions about any place you want. For example it can help with complex requests like \"Find me the best 3-hour family hikes in the Grand Tetons and a spot for a packed lunch”. Will try this next time I'm there:)\n\nRolling out now in the US and India.", "link": "https://nitter.net/sundarpichai/status/2032117173750284637", "date": "Thu, 12 Mar 2026 15:31:03 GMT", "desc": "We’re bringing new capabilities powered by Gemini models to @googlemaps. With Ask Maps, get answers to complex questions about any place you want. For example it can help with complex requests like \"Find me the best 3-hour family hikes in the Grand Tetons and a spot for a packed lunch”. Will try this next time I'm there:) Rolling out now in the US and India. Video", "username": "sundarpichai", "name": "Sundar Pichai", "tag": "Google CEO"}, {"title": "Introducing our biggest upgrade to @googlemaps since the original launch, featuring Ask Gemini (with personalization), Immersive Navigation, and much more!! 🗺️", "link": "https://nitter.net/OfficialLoganK/status/2032101245763149908", "date": "Thu, 12 Mar 2026 14:27:46 GMT", "desc": "Introducing our biggest upgrade to @googlemaps since the original launch, featuring Ask Gemini (with personalization), Immersive Navigation, and much more!! 🗺️ Video", "username": "JeffDean", "name": "Jeff Dean", "tag": "Google AI"}, {"title": "We've raised $6.5M to kill vector databases.\n\nEvery system today retrieves context the same way: vector search that stores everything as flat embeddings and returns whatever \"feels\" closest.\n\nSimilar, sure. Relevant? Almost never.\n\nEmbeddings can’t tell a Q3 renewal clause from a Q1 termination notice if the language is close enough.\n\nA friend of mine asked his AI about a contract last week, and it returned a detailed, perfectly crafted answer pulled from a completely different client’s file.\n\nOnce you’re dealing with 10M+ documents, these mix-ups happen all the time.\n\nVectorDB accuracy goes to shit.\n\nWe built @hydra_db for exactly this.\n\nHydraDB builds an ontology-first context graph over your data, maps relationships between entities, understands the 'why' behind documents, and tracks how information evolves over time.\n\nSo when you ask about 'Apple,' it knows you mean the company you're serving as a customer. Not the fruit. \n\nEven when a vector DB's similarity score says 0.94.\n\nMore below ⬇️", "link": "https://nitter.net/contextkingceo/status/2032098309029220456", "date": "Thu, 12 Mar 2026 14:16:06 GMT", "desc": "We've raised $6.5M to kill vector databases. Every system today retrieves context the same way: vector search that stores everything as flat embeddings and returns whatever \"feels\" closest. Similar, sure. Relevant? Almost never. Embeddings can’t tell a Q3 renewal clause from a Q1 termination notice if the language is close enough. A friend of mine asked his AI about a contract last week, and it returned a detailed, perfectly crafted answer pulled from a completely different client’s file. Once y", "username": "JeffDean", "name": "Jeff Dean", "tag": "Google AI"}, {"title": "We're approaching the dawn of medical superintelligence - the moment when affordable, world-class medical knowledge and support is at your fingertips whenever you need it.\n\nI think people are still underestimating how profound this transformation is going to be. Today we're announcing Copilot Health, enabling users to connect all their EHR records and wearable data in a secure, private health space that Copilot can analyze and reason about to provide personalized insights and proactive nudges.\n\nYou choose what information to connect - from hospital lab results to your fitness tracker - and Copilot Health applies medical intelligence to surface easy to understand, personalized insights that you can actually act on.\n\nIt's a dedicated space to bring your personal health data together in a single profile, including:\n- Activity, sleep, and vital trends from 50+ wearable devices, including Apple Health, Oura, Fitbit and many more\n- Health records from 50,000+ U.S. hospital and health systems, including visit summaries, medications, and test results\n- Comprehensive lab test results from Function\n\nCopilot Health enables people to arrive at their appointment with the right questions and the right context to make the time they have with doctors really count.\n\nYour data is always your data, and you are always in full control. Your data won't be used to train our AI models, and you can disconnect sources at any time. Our Copilot Health responses are also grounded in information from credible health organizations like Harvard Health, as well as real-time US provider directories to find the right real-world care.\n\nCopilot Health is launching first in the US to adults over 18, but we ultimately want to make this service available to the billions of people around the world who struggle to access reliable medical advice. Please give it a go and sign up to join the early Copilot Health community and help shape what comes next.\n\nMore on the MAI blog: https://microsoft.ai/news/introducing-copilot-health/", "link": "https://nitter.net/mustafasuleyman/status/2032092644483141928", "date": "Thu, 12 Mar 2026 13:53:35 GMT", "desc": "We're approaching the dawn of medical superintelligence - the moment when affordable, world-class medical knowl  model personality for awhile, so it feels extra good to be moving in the right direction.", "link": "https://nitter.net/sama/status/2030319489993298349", "date": "Sat, 07 Mar 2026 16:27:42 GMT", "desc": "GPT-5.4 is great at coding, knowledge work, computer use, etc, and it's nice to see how much people are enjoying it. But it's also my favorite model to talk to! We have missed the mark on model personality for awhile, so it feels extra good to be moving in the right direction.", "username": "sama", "name": "Sam Altman", "tag": "OpenAI CEO"}, {"title": "Very grateful to Jensen for working to expand Nvidia capacity at AWS so much for us!", "link": "https://nitter.net/sama/status/2030318958512164966", "date": "Sat, 07 Mar 2026 16:25:35 GMT", "desc": "Very grateful to Jensen for working to expand Nvidia capacity at AWS so much for us! tae kim (@firstadopter) Jensen said TWO days ago Nvidia is expanding OpenAI capacity at AWS \"like mad\" We also know OpenAI Codex token use is exploding. Any narrative that says aggregate OpenAI compute needs are weakening seems suspect. — https://nitter.net/firstadopter/status/2030030642109444100#m", "username": "sama", "name": "Sam Altman", "tag": "OpenAI CEO"}, {"title": "Will AI create new job opportunities? My daughter Nova loves cats, and her favorite color is yellow. For her 7th birthday, we got a cat-themed cake in yellow by first using Gemini’s Nano Banana to design it, and then asking a baker to create it using delicious sponge cake and icing. My daughter was delighted by this unique creation, and the process created additional work for the baker (which I feel privileged to have been able to afford).\n\nMany people are worried about AI taking peoples’ jobs. As a society we have a moral responsibility to take care of people whose livelihoods are harmed. At the same time, I see many opportunities for people to take on new jobs and grow their areas of responsibility.\n\nWe are still early on the path of AI generating a lot of new jobs. I don't know if baking AI-designed cakes will grow into a large business. (AI Fund is not pursuing this opportunity, because if we do, I will gain a lot of weight.) But throughout history, when people have invented tools that unleashed human creativity, large amounts of new and meaningful work have resulted. For instance, according to one study, over the past 150 years, falling employment in agriculture and manufacturing has been “more than offset by rapid growth in the caring, creative, technology, and business services sectors.”\n\nAI is also growing the demand for many digital services, which can translate into more work for people creating, maintaining, selling, and expanding upon these services. For example, I used to carry out a limited number of web searches every day. Today, my agents carry out dramatically more web searches. For example, the Agentic Reviewer, which I started as a weekend project and Yixing Jiang then helped make much better, automatically reviews research articles. It uses a web search API to search for related work, and this generates a vastly larger number of web search queries a day than I have ever entered by hand.\n\nThe evolution of AI and software continues to accelerate, and the set of opportunities for things we can build still grows every day. I’ve stopped writing code by hand. More controversially, I’ve long stopped reading generated code. I realize I’m in the minority here, but I feel like I can get built most of what I want without having to look directly at coding syntax, and I operate at a higher level of abstraction using coding agents to manipulate code for me. Will conventional programming languages like Python and TypeScript go the way of assembly — where it gets generated and used, but without direct examination by a human developer — or will models compile directly from English prompts to byte code?\n\nEither way, if every developer becomes 10x more productive, I don't think we’ll end up with 1/10th as many developers, because the demand for custom software has no practical ceiling. Instead, the number of people who develop software will grow massively. In fact, I’m seeing early signs of “X Engineer” jobs, such as Recruiting Engineer or Marketing Engineer, which are people who sit in a certain business function X to create software for that function.\n\nOne thing I’m convinced of based on my experience with Nova’s birthday cake: AI will allow us to have a batter life!\n\n[Original text: https://www.deeplearning.ai/the-batch/issue-341 ]", "link": "https://nitter.net/AndrewYNg/status/2025973459843715185", "date": "Mon, 23 Feb 2026 16:38:08 GMT", "desc": "Will AI create new job opportunities? My daughter Nova loves cats, and her favorite color is yellow. For her 7th birthday, we got a cat-themed cake in yellow by first using Gemini’s Nano Banana to design it, and then asking a baker to create it using delicious sponge cake and icing. My daughter was delighted by this unique creation, and the process created additional work for the baker (which I feel privileged to have been able to afford). Many people are worried about AI taking peoples’ jobs. A", "username": "AndrewYNg", "name": "Andrew Ng", "tag": "AI教育"}, {"title": "It is also very smart, but...I generally agree with this, and really feel it myself on the 5.3 -> 5.4 upgrade.", "link": "https://nitter.net/sama/status/2033660522961502288", "date": "Mon, 16 Mar 2026 21:43:46 GMT", "desc": "It is also very smart, but...I generally agree with this, and really feel it myself on the 5.3 -&gt; 5.4 upgrade. rohit (@krishnanrohit) GPT 5.4 is very good, but its most distinguishing characteristic is its humanity. 5.3 Codex was already incredible at coding so it's interesting to see what made it so much more successful. People claim they want a 10x autist savant coder, but what they want is personality. — https://nitter.net/krishnanrohit/status/2033616786978181185#m", "username": "sama", "name": "Sam Altman", "tag": "OpenAI CEO"}, {"tit at gives coding agents up-to-date API documentation. Since then, our GitHub repo has gained over 6K stars, and we've scaled from under 100 to over 1000 API documents, thanks to community contributions and a new agentic document writer. Thank you to everyone supporting Context Hub! OpenClaw and Moltbook showed that agents can use social media built", "username": "AndrewYNg", "name": "Andrew Ng", "tag": "AI教育"}, {"title": "32× efficiency improvement in just the last 3 months, that’s the crazy jump from GPT-5.2 to GPT-5.4! 37 cents/task is essentially almost at human-level efficiency (target was 24 cents/task). This was inconceivable a year ago when o3 cost $4500/task on ARC-AGI-1, 12,000x improved!", "link": "https://nitter.net/DeryaTR_/status/2033380049706008849", "date": "Mon, 16 Mar 2026 03:09:16 GMT", "desc": "32× efficiency improvement in just the last 3 months, that’s the crazy jump from GPT-5.2 to GPT-5.4! 37 cents/task is essentially almost at human-level efficiency (target was 24 cents/task). This was inconceivable a year ago when o3 cost $4500/task on ARC-AGI-1, 12,000x improved! Jesse🔸⏹️ (@PoliticalKiwi) GPT-5.4 (High) has now cleared 90% on this benchmark at a cost of just $0.37/task So that's a 32x efficiency improvement in the last three months, or 12000x since December 2024 — https://nitter", "username": "sama", "name": "Sam Altman", "tag": "OpenAI CEO"}, {"title": "Polymarket 上低于 10% 概率的事情，可以视为基本不可能。高于 90% 概率的事情，可以视为板上钉钉，没有悬念。除此之外，还要检查一下交易量，交易金额低于一万美元的，预测力也有限。\n\n阅读任何新闻分析，可以同时查一下 polymarket 概率, 交叉验证。拿小概率事件来混淆视听者，可以直接屏蔽。", "link": "https://nitter.net/Svwang1/status/2033342421627719935", "date": "Mon, 16 Mar 2026 00:39:45 GMT", "desc": "Polymarket 上低于 10% 概率的事情，可以视为基本不可能。高于 90% 概率的事情，可以视为板上钉钉，没有悬念。除此之外，还要检查一下交易量，交易金额低于一万美元的，预测力也有限。 阅读任何新闻分析，可以同时查一下 polymarket 概率, 交叉验证。拿小概率事件来混淆视听者，可以直接屏蔽。", "username": "Svwang1", "name": "王川", "tag": "深度长推+认知商业"}, {"title": "My latest piece on @FT about the Chinese LLM open-source advantage. Contrasted with the secretive development of LLMs in the US competing in a winner-takes-all battle to reach AGI, Chinese models offer a distinct pathway for progress in AI when they are forced to play catch-up. Through open technologies, the strategy might lead to a broader global reach.", "link": "https://nitter.net/kaifulee/status/2000639446577041498", "date": "Mon, 15 Dec 2025 18:49:48 GMT", "desc": "My latest piece on @FT about the Chinese LLM open-source advantage. Contrasted with the secretive development of LLMs in the US competing in a winner-takes-all battle to reach AGI, Chinese models offer a distinct pathway for progress in AI when they are forced to play catch-up. Through open technologies, the strategy might lead to a broader global reach. Financial Times (@FT) China’s open-source AI is a national advantage on.ft.com/48ZOaiY | opinion — https://nitter.net/FT/status/199820416149877", "username": "kaifulee", "name": "李开复", "tag": "大模型+AI产业趋势"}, {"title": "提高生活质量就关注三个要素：\n\n早上精神振奋，白天精神压力可控，晚上睡眠深沉。\n\n其它东西都是浮云。", "link": "https://nitter.net/Svwang1/status/2031055450591105324", "date": "Mon, 09 Mar 2026 17:12:09 GMT", "desc": "提高生活质量就关注三个要素： 早上精神振奋，白天精神压力可控，晚上睡眠深沉。 其它东西都是浮云。", "username": "Svwang1", "name": "王川", "tag": "深度长推+认知商业"}, {"title": "I'm excited to announce Context Hub, an open tool that gives your coding agent the up-to-date API documentation it needs. Install it and prompt your agent to use it to fetch curated docs via a simple CLI. (See image.)\n\nWhy this matters: Coding agents often use outdated APIs and hallucinate parameters. For example, when I ask Claude Code to call OpenAI's GPT-5.2, it uses the older chat completions API instead of the newer responses API, even though the newer one has been out for a year. Context Hub solves this.\n\nContext Hub is also designed to get smarter over time. Agents can annotate docs with notes — if your agent discovers a workaround, it can save it and doesn't have to rediscover it next session. Longer term, we're building toward agents sharing what they learn with each other, so the whole community benefits.\n\nThanks Rohit Prsad and Xin Ye for working with me on this!\n\nnpm install -g @aisuite/chub\n\nGitHub: https://github.com/andrewyng/context-hub", "link": "https://nitter.net/AndrewYNg/status/2031051809499054099", "date": "Mon, 09 Mar 2026 16:57:41 GMT", "desc": "I'm excited to announce Context Hub, an open tool that gives your coding agent the up-to-date API documentation it needs. Install it and prompt your agent to use it to fetch curated docs via a simple CLI. (See image.) Why this matters: Coding agents often use outdated APIs and hallucinate parameters. For example, when I ask Claude Code to call OpenAI's GPT-5.2, it uses the older chat completions API instead of the newer responses API, even though the newer one has been out for a year. Context Hu", "username": "AndrewYNg", "name": "Andrew Ng", "tag": "AI教育"}, {"title": "服务100+AI产品后，他把SEO营销经验做成了144个AI技能包\n\n3月7日我们有幸邀请了AI出海增长专家Kostja（k神），85分钟把三年、100+产品的SEO实战经验讲了个透。\n\n他做了一件很值得关注的事：把这些经验打包成144个开源Marketing Skills，放在GitHub上免费用。\n\n1. Skills是什么\n\n人读文章，普通AI读Markdown，Agent读Skills。\n\nSkills不只是文档，它有触发逻辑、模块间互相引用，提示词里出现对应关键词就会自动调用，不需要手动指定。装在Cursor里能用，换到Replit里照样能用，一个字不用改。\n\n2. 144个Skills覆盖了什么\n\n核心三块：SEO技术层（robots.txt、sitemap、IndexNow、可爬取性）、页面模板（首页、功能页、定价页、FAQ、API介绍页、客户案例页……ToB ToC都有）、可复用组件。\n\n另外有两个跨渠道都用得上的：关键词调研和竞品调研。程序化SEO和寄生SEO也有专门的Skills写得很细。\n\n3. 核心用法：上下文+Skills\n\n装了Skills还不够。要先让AI生成一份产品上下文文档，产品定位、目标用户、已有页面关键词、竞品信息、品牌调性都放进去。文档让AI写，不要人写，AI比人全面。\n\n有了上下文再叠加Skills，生成出来才是真正可用的内容。他现场演示生成了一个use case页面，面包屑、H1、内链、schema代码都有，从SEO角度直接能用。\n\n4. 迭代方法\n\n生成结果不满意，不是去改提示词，而是把结果丢给AI让它改Skills本身，再用新Skills重新生成。每一次不满意都变成下一次更准的输出。\n\n他还用飞书妙记把每周和客户的会议记录转录出来，让AI分析哪些内容需要更新进Skills，几轮下来那份上下文文档会越来越贴合实际项目。\n\n5. 工具选型\n\nLovable：适合前期可视化搭建，他自己的网站就是先用Lovable做出来。 给客户交付：用Lovable搭好，让客户一比一复刻到自己网站，用他们自己的技术栈发布。 \n\n另外他说,9.9分的模型和9.8分的模型对大多数人来说没什么区别，更值得提升的是自己调用AI的能力。\n\n6. 一个风险要注意\n\n有安全研究表明部分Skills存在投毒情况，agent权限很大，被恶意利用风险不低。建议优先装官方发布的Skills，非官方的先审查内容再装，或者把agent权限调低。\n\n7. 最后\n\n144个Skills全部开源，GitHub上直接搜Kostja的marketing-skills。他说把GitHub链接直接丢给AI让它自己安装就行，README是给AI看的，它能搞定。", "link": "https://nitter.net/WaytoAGI/status/2031018664670134641", "date": "Mon, 09 Mar 2026 14:45:58 GMT", "desc": "服务100+AI产品后，他把SEO营销经验做成了144个AI技能包 3月7日我们有幸邀请了AI出海增长专家Kostja（k神），85分钟把三年、100+产品的SEO实战经验讲了个透。 他做了一件很值得关注的事：把这些经验打包成144个开源Marketing Skills，放在GitHub上免费用。 1. Skills是什么 人读文章，普通AI读Markdown，Agent读Skills。 Skills不只是文档，它有触发逻辑、模块间互相引用，提示词里出现对应关键词就会自动调用，不需要手动指定。装在Cursor里能用，换到Replit里照样能用，一个字不用改。 2. 144个Skills覆盖了什么 核心三块：SEO技术层（robots.txt、sitemap、IndexNow、可爬取性）、页面模板（首页、功能页、定价页、FAQ、API介绍页、客户案例页……ToB ToC都有）、可复用组件。 另外有两个跨渠道都用得上的：关键词调研和竞品调研。程序化SEO和寄生SEO也有专门的Skills写得很细。 3. 核心用法：上下文+Skills 装了Skills还不够。要先让AI生成一份产品上下文文", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "AI2041 ebook promotion runs from Nov 3 to 9 for only $1.99 (make sure you choose the e-book format with preferred U.S. retailers from the publisher's site).  I started writing the predictions in the book 5 years ago. The speed of various technological revolutions is definitely at its peak.  @ChenQiufan @penguinrandom \nhttps://www.penguinrandomhouse.com/books/653310/ai-2041-by-kai-fu-lee-and-chen-qiufan/", "link": "https://nitter.net/kaifulee/status/1985467819757310216", "date": "Mon, 03 Nov 2025 22:03:11 GMT", "desc": "AI2041 ebook promotion runs from Nov 3 to 9 for only $1.99 (make sure you choose the e-book format with preferred U.S. retailers from the publisher's site). I started writing the predictions in the book 5 years ago. The speed of various technological revolutions is definitely at its peak. @ChenQiufan @penguinrandom penguinrandomhouse.com/books…", "username": "kaifulee", "name": "李开复", "tag": "大模型+AI产业趋势"}, {"title": "Kai-Fu Lee (founder of Sinovation Ventures) explains how the future is all about multi-agent systems. \n\n1 agent today is like a pre-internet PC, useful but isolated. Connect agents, and they share context, split tasks, and coordinate instantly.", "link": of flexible demand into long-term utility contracts. Our ability to shift or reduce our energy demand when it’s needed can help utility companies balance supply/ demand and plan for future capacity needs. This is a big milestone for responsible data center growth and helps keep costs lower for local communities. blog.google/innovation-and-a…", "username": "sundarpichai", "name": "Sundar Pichai", "tag": "Google CEO"}, {"title": "Google is now the first cloud provider to integrate 1 GW of flexible demand into long-term utility contracts. Our ability to shift or reduce our energy demand when it’s needed can help utility companies balance supply/ demand and plan for future capacity needs.\n\nThis is a big milestone for responsible data center growth and helps keep costs lower for local communities.\n\nhttps://blog.google/innovation-and-ai/infrastructure-and-cloud/global-network/demand-response-data-center-milestone/", "link": "https://nitter.net/sundarpichai/status/2035023972648321107", "date": "Fri, 20 Mar 2026 16:01:38 GMT", "desc": "Google is now the first cloud provider to integrate 1 GW of flexible demand into long-term utility contracts. Our ability to shift or reduce our energy demand when it’s needed can help utility companies balance supply/ demand and plan for future capacity needs. This is a big milestone for responsible data center growth and helps keep costs lower for local communities. blog.google/innovation-and-a…", "username": "JeffDean", "name": "Jeff Dean", "tag": "Google AI"}, {"title": "这个技术让模型上下文从 16K 扩到 1 亿 token，精度衰减不到 9%，这篇论文牛逼呀在🫡", "link": "https://nitter.net/lxfater/status/2035023776505897049", "date": "Fri, 20 Mar 2026 16:00:51 GMT", "desc": "这个技术让模型上下文从 16K 扩到 1 亿 token，精度衰减不到 9%，这篇论文牛逼呀在🫡 艾略特 (@elliotchen100) 论文来了。名字叫 MSA，Memory Sparse Attention。 一句话说清楚它是什么： 让大模型原生拥有超长记忆。不是外挂检索，不是暴力扩窗口，而是把「记忆」直接长进了注意力机制里，端到端训练。 过去的方案为什么不行？ RAG 的本质是「开卷考试」。模型自己不记东西，全靠现场翻笔记。翻得准不准要看检索质量，翻得快不快要看数据量。一旦信息分散在几十份文档里、需要跨文档推理，就抓瞎了。 线性注意力和 KV 缓存的本质是「压缩记忆」。记是记了，但越压越糊，长了就丢。 MSA 的思路完全不同： → 不压缩，不外挂，而是让模型学会「挑重点看」 核心是一种可扩展的稀疏注意力架构，复杂度是线性的。记忆量翻 10 倍，计算成本不会指数爆炸。 → 模型知道「这段记忆来自哪、什么时候的」 用了一种叫 document-wise RoPE 的位置编码，让模型天然理解文档边界和时间顺序。 → 碎片化的信息也能串起来推理 Memory Interleaving ", "username": "lxfater", "name": "铁锤人", "tag": "AI创业+Agent"}, {"title": "R to 加密圈也在大量裁员-裁员潮势不可挡了", "link": "https://nitter.net/Huanusa/status/2035020773723648167", "date": "Fri, 20 Mar 2026 15:48:55 GMT", "desc": "加密圈也在大量裁员-裁员潮势不可挡了", "username": "Huanusa", "name": "Huan", "tag": "加密+趋势机遇"}, {"title": "Cursor 上线 Composer 2 不到 24 小时，就被开发者扒出了底裤。\n（以下内容 Claude 辅助生成）\n\n一个叫 Fynn 的开发者在调试 Cursor 的 API 时，发现返回的模型 ID 赫然写着：kimi-k2p5-rl-0317-s515-fast。翻译成人话：这就是月之暗面（Moonshot AI）的 Kimi K2.5，加了一层强化学习（RL）微调。\n\nMoonshot AI 预训练负责人 Yulun Du 随即在 X 上发帖确认，经测试 Composer 2 的 tokenizer 和 Kimi 的完全一致，并直接 @ 了 Cursor 联合创始人 Michael Truell，质问为什么不遵守许可证、也没有支付任何费用。另外两名 Moonshot 员工也发帖证实，不过三条帖子后来都被删除了。\n\n而 Cursor 在 3 月 19 日发布 Composer 2 时，只提到性能提升来自\"对基座模型的持续预训练加强化学习\"，全程没有提到 Kimi K2.5。这两件事并不矛盾，持续预训练和 RL 本来就是在某个基座模型上做的，Cursor 只是没说基座是谁的。\n\n这不是第一次了\n\n去年 10 月 Cursor 发布 Composer 1 时，多国开发者发现生成的代码中频繁出现中文。Alley Corp 合伙人 Kenneth Auchenberg 当时贴出截图，直言这是\"铁证\"，认为 Composer 1 就是基于中国开源模型微调的。KR-Asia 和 36Kr 后来证实，Cursor 和 Windsurf 都在使用中国开源模型，其中 Windsurf 承认用的是智谱的 GLM。Cursor 从来没有公开披露 Composer 1 的底层模型，后来悄悄发了 Composer 1.5 就翻篇了。\n\n许可证才是核心问题\n\nKimi K2.5 使用的是修改版 MIT 许可证，里面有一条专门为这种场景设计的条款：如果使用该模型（包括衍生作品）的商业产品月活超过 1 亿或月收入超过 2000 万美元，必须在产品界面上醒目展示\"Kimi K2.5\"字样。\n\nCursor 今年 2 月的年化收入已经突破 20 亿美元，换算成月收入大约 1.67 亿美元，是许可证门槛的 8 倍多。但 Cursor 的界面上只写着\"Composer 2\"，没有任何 Kimi 的标识。\n\n与此同时，Cursor 正在跟投资人谈一轮新融资，估值目标约 500 亿美元，相比去年 11 月的 293 亿美元估值几乎翻倍。而 Moonshot AI 上一轮估值据报道约 43 亿美元。一个估值是对方 12 倍的公司，拿了对方的模型包装成自研技术，用来支撑\"前沿实验室\"的叙事去融资。\n\n截至目前，Cursor 没有做出任何公开回应。\n\n这件事的后续走向，对整个开源 AI 生态有标杆意义。如果 Moonshot 不对一家年收入 20 亿美元的公司执行许可证，那以后所有开源模型的署名条款就成了摆设。每家 AI 实验室都会算同一笔账：为什么要开源自己的模型，让分发能力更强的公司去掉署名、包装成自研、然后以 12 倍于你的估值去融资？", "link": "https://nitter.net/dotey/status/2035017845801689440", "date": "Fri, 20 Mar 2026 15:37:17 GMT", "desc": "Cursor 上线 Composer 2 不到 24 ，传递过程就可能被拦截。\n她们在龙虾出来的两个月前，就开始做自己的开源安全体系 DAuth 了。\n\n3/ 硅谷 YC 创业者都在搭什么 agent？\n• 垂直行业最多：销售、保险、贷款、医疗 \n• Coding agent 很火：Claude Code、Codex \n• 国内少见但美国已规模化的方向：agent 测评（帮企业测试和优化外包的 agent）\n通用 agent 好用，但做不了垂直行业的专家。真正能变现的机会在具体行业里。\n\n4/ agent 和工作流的区别：\n工作流是线性的，每一步你提前设好。\nagent 是非线性的，你给它一个开放性目标，它自己决定怎么完成，每次跑的路径可能都不一样。\n正因为 agent 是自主的，给它太多权限就很危险。她的建议是多 Agent 架构，核心是上下文与权限隔离：主 agent 负责调度但权限最少，执行交给权限隔离的子 agent。\n\n5/ 她们的产品 Dedalus Labs：5行代码搭出一个可商业化的 agent。\n背后是几万行的封装——tool call 解析、多模型切换、streaming，全在 runner 里。支持任意模型，DeepSeek、Kimi、Claude 都可以，支持支付宝充值。\n\n6/ 4月要办一个 agent 大赛，叫 ATM（Agent Tournament for Money）。\n评判标准只有一个：谁的 agent 赚的钱多。\n能稳定赚钱的 agent，一定是从真实痛点出发、基础设施足够可靠的 agent。\n\n7/ 最后一句话值得单独说：\n\"世界上 99% 有价值的 agent，现在都还没被搭出来。不是因为技术不够，而是因为大多数人还没想到。\"\n她管这个叫 imagination ceiling，想象力壁垒。你搭不出你想象不到的东西，你想象不到你定义不清楚的东西。\n\n龙虾打开了很多人对 Agent 的感知，但感知是起点，不是终点。\n从感知到真正做出一个能用、能赚钱、安全稳定的 Agent，中间还有很长一段路。\n#通往AGI之路 #WaytoAGI #YC创业者 #Agent #工作流", "link": "https://nitter.net/WaytoAGI/status/2034934430373224507", "date": "Fri, 20 Mar 2026 10:05:50 GMT", "desc": "WaytoAGI 请到了 @dedaluslabs 创始人 @itsCathyDi 和 AJ 一起聊了 硅谷 YC 创业者在用 Agent 做什么、龙虾的安全问题、工作流和 Agent 的区别、怎么融资、怎么讲故事。 👇🏻整场分享聊了两个多小时，下面是精华内容整理 1/ Cathy 的背景：普林斯顿 CS，退学创业，在 YC 最后5分钟递交申请，当天就进了，种子轮融了 $11M。联创 Windsor 是前 DeepMind / Sentient AGI。 平均年龄23岁的团队，在硅谷做 agent 基础设施。 2/ 她们公司内部禁用龙虾。 原因是 90% 的龙虾可以被 prompt injection 直接盗走密钥。即便部署到云端，agent 在和外部工具交互时依然要把密钥传出去，传递过程就可能被拦截。 她们在龙虾出来的两个月前，就开始做自己的开源安全体系 DAuth 了。 3/ 硅谷 YC 创业者都在搭什么 agent？ • 垂直行业最多：销售、保险、贷款、医疗 • Coding agent 很火：Claude Code、Codex • 国内少见但美国已规模化的方向：agent 测评", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "住65层高层的中国人又笑话日本一户建人口密度高了", "link": "https://nitter.net/lidangzzz/status/2034921362024706476", "date": "Fri, 20 Mar 2026 09:13:54 GMT", "desc": "住65层高层的中国人又笑话日本一户建人口密度高了 思想史万有引力 (@sixiangshiwyyl) 日本是岛国，山地多、平原少、城市季度紧凑，物流半径短频次高，才会有便利店文化，中国最像的的应该就深圳了，香港也差不多 — https://nitter.net/sixiangshiwyyl/status/2034919821763399724#m", "username": "lidangzzz", "name": "立党", "tag": "创业观点"}, {"title 54", "date": "Fri, 20 Mar 2026 01:48:45 GMT", "desc": "我看到有人提问：“如果未来的代码都是 AI 写的，那么我们怎么招聘程序员呢？” 仔细想想，这个问题比预想的难多了。 考察一个人的代码能力不重要（代码不是他写的），更重要的是考察他会不会 AI。 但是，什么样的面试问题，能够考察出一个人是否掌握 AI？ruanyifeng.com/blog/2026/03/…", "username": "ruanyf", "name": "阮一峰", "tag": "科技知识长文"}, {"title": "Grok is the most important tool and resource I have on my iPhone.", "link": "https://nitter.net/teslaownersSV/status/2034806989545775495", "date": "Fri, 20 Mar 2026 01:39:25 GMT", "desc": "Grok is the most important tool and resource I have on my iPhone.", "username": "elonmusk", "name": "Elon Musk", "tag": "科技+商业+加密"}, {"title": "Image", "link": "https://nitter.net/Rothmus/status/2034798271932010953", "date": "Fri, 20 Mar 2026 01:04:47 GMT", "desc": "", "username": "elonmusk", "name": "Elon Musk", "tag": "科技+商业+加密"}, {"title": "A new paper from @ylecun and others – V-JEPA 2.1\n\nIt changes the recipe of V-JEPA so the model learns both:\n\n• Global semantics – what is happening in the scene\n• Dense spatio-temporal structure – where things are and how they move\n\nThe idea is to supervise not just masked tokens but the visible ones too\n\nThere are 4 key ingredients for V-JEPA 2.1:\n\n- Dense prediction loss on both masked and visible tokens\n- Deep self-supervision across intermediate layers\n- Modality-specific tokenizers (2D for images, 3D for videos) within a shared encoder\n- Model + data scaling\n\nThe workflow turns into: masked image/video → encode visible tokens → predict latent representations for both masked and visible tokens → supervise at multiple layers\n\nHere are the details:", "link": "https://nitter.net/TheTuringPost/status/2034795966931640533", "date": "Fri, 20 Mar 2026 00:55:37 GMT", "desc": "A new paper from @ylecun and others – V-JEPA 2.1 It changes the recipe of V-JEPA so the model learns both: • Global semantics – what is happening in the scene • Dense spatio-temporal structure – where things are and how they move The idea is to supervise not just masked tokens but the visible ones too There are 4 key ingredients for V-JEPA 2.1: - Dense prediction loss on both masked and visible tokens - Deep self-supervision across intermediate layers - Modality-specific tokenizers (2D for image", "username": "ylecun", "name": "Yann LeCun", "tag": "Meta AI"}, {"title": "R to Check out @ShenyuanGao's technical deep dive:\n\nhttps://x.com/ShenyuanGao/status/2024898256334114876?s=20", "link": "https://nitter.net/DrJimFan/status/2024899289080910046", "date": "Fri, 20 Feb 2026 17:29:45 GMT", "desc": "Check out @ShenyuanGao's technical deep dive: nitter.net/ShenyuanGao/status/202… Shenyuan Gao (@ShenyuanGao) 🤖 How can we enable zero-shot generalization to unseen scenarios for robot world models? Thrilled to share DreamDojo 🌎 — an interactive robot world model pretrained on 44K hours of human egocentric videos, the largest and most diverse dataset to date for robot world model learning. Our model not only excels in generalization, but also supports real-time interaction at 10 FPS after distill", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "R to - Project website: https://dreamdojo-world.github.io/\n- Paper: https://arxiv.org/abs/2602.06949\n- Code repo and model ckpts: https://github.com/NVIDIA/DreamDojo\n\nThis is a huge team work at NVIDIA. All credits go to the wonderful teams who poured their hearts into it!", "link": "https://nitter.net/DrJimFan/status/2024895360922255776", "date": "Fri, 20 Feb 2026 17:14:09 GMT", "desc": "- Project website: dreamdojo-world.github.io/ - Paper: arxiv.org/abs/2602.06949 - Code repo and model ckpts: github.com/NVIDIA/DreamDojo This is a huge team work at NVIDIA. All credits go to the wonderful teams who poured their hearts into it!", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "Announcing DreamDojo: our open-source, interactive world model that takes robot motor controls and generates the future in pixels. No engine, no meshes, no hand-authored dynamics. It's Simulation 2.0. Time for robotics to take the bitter lesson pill.\n\nReal-world robot learning is bottlenecked by time, wear, safety, and resets. If we want Physical AI to move at pretraining speed, we need a simulator that adapts to pretraining scale with as little human engineering as possible.\n\nOur key insights: (1) human egocentric videos are a scalable source of first-person physics; (2) latent actions make them \"robot-readable\" across different hardware; (3) real-time inference unlocks live teleop, policy eval, and test-time planning *inside* a dream.\n\nWe pre-train on 44K hours of human videos: cheap, abundant, and collected with zero robot-in-the-loop. Humans have already explored the combinatorics: we grasp, pour, fold, assemble, fail, retry—across cluttered scenes, shifting viewpoints, changing light, and hour-long task chains—at a scale no robot fleet could match. The missing piece: these videos have no action labels. So we introduce latent actions: a unified representation inferred directly from videos that captures \"what changed between world states\" without knowing the underlying hardware. This lets us train on any first-person video as if it came with motor commands attached.\n\nAs a result, DreamDojo generalizes zero-shot to objects and environments never seen in any robot training set, because humans saw them first.\n\nNext, we post-train onto each robot to fit its specific hardware. Think of it as separating \"how the world looks and behaves\" from \"how this particular robot actuates.\" The base model follows the general physical rules, then \"snaps onto\" the robot's unique mechanics. It's kind of like loading a new character and scene assets into Unreal Engine, but done through gradient descent and generalizes far beyond the post-training dataset.\n\nA world simulator is only useful if it runs fast enough to close the loop. We train a real-time version of DreamDojo that runs at 10 FPS, stable for over a minute of continuous rollout. This unlocks exciting possibilities:\n\n- Live teleoperation *inside* a dream. Connect a VR controller, stream actions into DreamDojo, and teleop a virtual robot in real time. We demo this on Unitree G1 with a PICO headset and one RTX 5090.\n- Policy evaluation. You can benchmark a policy checkpoint in DreamDojo instead of the real world. The simulated success rates strongly correlate with real-world results - accurate enough to rank checkpoints without burning a single motor.\n- Model-based planning. Sample multiple action proposals → simulate them all in parallel → pick the best future. Gains +17% real-world success out of the box on a fruit packing task. \n\nWe open-source everything!! Weights, code, post-training dataset, eval set, and whitepaper with tons of details to reproduce. DreamDojo is based on NVIDIA Cosmos, which is open-weight too. \n\n2026 is the year of World Models for physical AI. We want you to build with us. Happy scaling! \n\nLinks in thread:", "link": "https://nitter.net/DrJimFan/status/2024895359236051274", "date": "Fri, 20 Feb 2026 17:14:09 GMT", "desc": "Announcing DreamDojo: our open-source, interactive world model that takes robot motor controls and generates the future in pixels. No engine, no meshes, no hand-authored dynamics. It's Simulation 2.0. Time for robotics to take the bitter lesson pill. Real-world robot learning is bottlenecked by time, wear, safety, and resets. If we want Physical AI to move at pretraining speed, we need a simulator that adapts to pretraining scale with as little human engineering as possible. Our key insights: (1", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "We’re the first cloud to bring up an NVIDIA Vera Rubin NVL72 system for validation, another big step in building the next generation of AI infrastructure with NVIDIA.", "link": "https://nitter.net/satyanadella/status/2032515189086761005", "date": "Fri, 13 Mar 2026 17:52:38 GMT", "desc": "We’re the first cloud to bring up an NVIDIA Vera Rubin NVL72 system for validation, another big step in building the next generation of AI infrastructure with NVIDIA.", "username": "satyanadella", "name": "Satya Nadella", "tag": "Microsoft CEO"}, {"title": "We open sourced WAXAL!\n\n- Multilingual speech dataset for African languages\n- 17 languages for TTS\n- 19 languages for ASR\n\nOver 100 million speakers across 40 Sub-Saharan African countries\n\nhttps://huggingface.co/datasets/google/WaxalNLP", "link": "https://nitter.net/osanseviero/status/2032452729059045881", "date": "Fri, 13 Mar 2026 13:44:26 GMT", "desc": "We open sourced WAXAL! - Multilingual speech dataset for African languages - 17 languages for TTS - 19 languages for ASR Over 100 million speakers across 40 Sub-Saharan African countries huggingface.co/datasets/goog…", "username": "JeffDean", "name": "Jeff Dean", "tag": "Google AI"}, {"title": "10分钟用Obsidian + OpenClaw重构AI知识管理体系👇\n\n我们有幸邀请到了AI自媒体博主@aiwarts 来WaytoAGI分享！他刚完成自己知识体系的完整重构，来分享整套方法。\n\n1️⃣为什么选 Obsidian\n\nObsidian 的底层是本地 Markdown 文件，AI Agent 直接读写，不需要 API、不需要授权。\n\nNotion、飞书的数据在云端，AI 每次操作都要走 API，慢、贵、有限制，Obsidian 没有这些问题。\n\n2️⃣第一步：统一信息入口\n\n卡尔每天处理五六千条信息，分散在各处。他用三个插件解决入库问题：\n\n飞书文档下载插件 — 批量转成 Markdown 导入 \nObsidian Web Clipper — 抓网页，自动保留来源和 tag \n微信笔记同步助手 — 微信内容直接同步进来\n\n3️⃣视频和社交平台内容另有方案\n\nX Reader 和 Agent Reach 可以覆盖小红书、公众号、B站、YouTube、抖音、GitHub，连评论区都能抓。\n\n没看过的视频先存链接，确认值得看再用 AI 生成摘要收录，避免无效处理。\n\n4️⃣第二步：搭 AI 能读懂的文件结构\n\n常见误区：把文件夹做得\"对人友好\"，但 AI 不在乎好不好看，只要路径清晰就够。\n\n推荐起点：GitHub 上有中文版 Obsidian 初始结构项目，包含收件箱、日记、项目研究、知识库、资源管理。卡尔在此基础上加了\"工作流存储\"目录，放提示词模板和各平台发布 SOP。\n\n看到更好的结构不需要重构，把链接发给 AI，让它把缺少的部分追加进去就行。\n\n5️⃣第三步：用 CodeX 自动维护文件\n\nCodeX 默认绑定目录，直接连接 Obsidian 文件夹，适合管理文件结构。\n\n卡尔每天用它做：整理下载文件夹、批量优化稿件、拆分重组 Markdown、设置定时任务。\n\n分工逻辑：轻量任务先给 CodeX，解决不了交 Claude Code，再解决不了才上 OpenClaw。\n\n6️⃣进阶：用 OpenClaw 让知识库主动运转\n\nOpenClaw 支持心跳机制和 Cron，可以让 Agent 按计划自动扫描知识库、整理新增内容、发送日报，不需要手动触发。\n\n接入方式推荐飞书或 Discord。飞书可以配置多个 OpenClaw 应用共享同一套记忆体系；Discord 有频道隔离，可以在后台同时跑多个任务。\n\n在 OpenClaw 的 agents 配置文件里写清楚哪些内容归到哪个目录，新信息进来就自动分类，不需要二次整理。\n\n7️⃣防止 AI 误操作的两个措施\n\n软链接 — 只开放 Obsidian 特定文件夹的权限，Agent 无法访问其他文件\n\nGit 版本备份 — Code X 在执行命令前后自动存版本，随时可以回退\n\n卡尔的邪修做法：把本地除 Download 文件夹外的所有内容都同步到了 iCloud 2T\n\n8️⃣一个实用细节：上下文健康检测\n\n和 Claude 对话到五六十轮后，它的\"遗忘\"会明显加速，之前设定的偏好和技能会悄悄丢失。\n\n检测方法：设一个确认指令，能回复关键词说明上下文还在，不行就开新对话。\n\n真正难的不是安装 Obsidian，是想清楚你要管理什么，然后让 AI 读懂你的文件夹逻辑。\n\n#通往AGI之路 #WaytoAGI #OpenClaw #obisidan #claudecode #CodeX #AI知识管理 #知识体系", "link": "https://nitter.net/WaytoAGI/status/2032397724935692651", "date": "Fri, 13 Mar 2026 10:05:52 GMT", "desc": "10分钟用Obsidian + OpenClaw重构AI知识管理体系👇 我们有幸邀请到了AI自媒体博主@aiwarts 来WaytoAGI分享！他刚完成自己知识体系的完整重构，来分享整套方法。 1️⃣为什么选 Obsidian Obsidian 的底层是本地 Markdown 文件，AI Agent 直接读写，不需要 API、不需要授权。 Notion、飞书的数据在云端，AI 每次操作都要走 API，慢、贵、有限制，Obsidian 没有这些问题。 2️⃣第一步：统一信息入口 卡尔每天处理五六千条信息，分散在各处。他用三个插件解决入库问题： 飞书文档下载插件 — 批量转成 Markdown 导入 Obsidian Web Clipper — 抓网页，自动保留来源和 tag 微信笔记同步助手 — 微信内容直接同步进来 3️⃣视频和社交平台内容另有方案 X Reader 和 Agent Reach 可以覆盖小红书、公众号、B站、YouTube、抖音、GitHub，连评论区都能抓。 没看过的视频先存链接，确认值得看再用 AI 生成摘要收录，避免无效处理。 4️⃣第二步：搭 AI 能读懂的文件", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "😎", "link": "https://nitter.net/sundarpichai/status/2032309203369656521", "date": "Fri, 13 Mar 2026 04:14:07 GMT", "desc": "😎 Dieter Bohn (@backlon) Here's the video of the Android XR demo we showed last week at MWC :) Couple things that stand out to me: how well Gemini can handle vague and complex queries and how the glasses work with apps on the phone. 😎 More details here! teddit.net/r/AndroidXR/comme… Video — https://nitter.net/backlon/status/2032197021185270197#m", "username": "sundarpichai", "name": "Sundar Pichai", "tag": "Google CEO"}, {"title": "两周前，一个 Cloudflare 工程师用 AI 重新实现了 Next.js，Token 费用是1100美元。\n\n我觉得，这件事情对Next.js的打击非常大。\n\n代码的护城河不存在了，只要投入一小笔金钱，AI 就能复刻出大型软件。\n\n防止复刻的关键是测试用例，我写了一点看法《测试是新的护城河》。https://www.ruanyifeng.com/blog/2026/03/weekly-issue-388.html", "link": "https://nitter.net/ruanyf/status/2032258957369360859", "date": "Fri, 13 Mar 2026 00:54:27 GMT", "desc": "两周前，一个 Cloudflare 工程师用 AI 重新实现了 Next.js，Token 费用是1100美元。 我觉得，这件事情对Next.js的打击非常大。 代码的护城河不存在了，只要投入一小笔金钱，AI 就能复刻出大型软件。 防止复刻的关键是测试用例，我写了一点看法《测试是新的护城河》。ruanyifeng.com/blog/2026/03/…", "username": "ruanyf", "name": "阮一峰", "tag": "科技知识长文"}, {"title": "I recently spoke at the Sundance Film Festival on a panel about AI. Sundance is an annual gathering of filmmakers and movie buffs that serves as the premier showcase for independent films in the United States. Knowing that many people in Hollywood are extremely uncomfortable about AI, I decided to immerse myself for a day in this community to learn about their anxieties and build bridges.\n\nI’m grateful to Daniel Dae Kim @danieldaekim, an actor/producer/director I’ve come to respect deeply for his artistic and social work, for organizing the panel, which also included Daniel, Dan Kwan, Jonathan Wang, and Janet Yang. I found myself surrounded by award-winning filmmakers and definitely felt like the odd person out!\n\nFirst, Hollywood has many reasons to be uncomfortable with AI. People from the entertainment industry come from a very different culture than many who work in tech, and this drives deep differences in what we focus on and what we value. A significant subset of Hollywood is concerned that:\n- AI companies are taking their work to learn from it without consent and compensation. Whereas the software industry is used to open source and the open internet, Hollywood focuses much more on intellectual property, which underlies the core economic engines of the entertainment industry.\n- Powerful unions like SAG-AFTRA (Screen Actors Guild-American Federation of Television and Radio Artists) are deeply concerned about protecting the jobs of their members. When AI technology (or any other force) threatens the livelihoods of their members — like voice actors — they will fight mightily against potential job losses.\n- This wave of technological change feels forced on them more than previous waves, where they felt more free to adopt or reject the technology. For example, celebrities felt like it was up to them whether to use social media. In contrast, negative messaging from some AI leaders who present the technology as unstoppable, perhaps even a dangerous force that will wipe out many jobs, has not encouraged enthusiastic adoption.\n\nHaving said that, Hollywood is under no illusions that AI will change entertainment, and that if Hollywood does not adapt, perhaps some other place will become the new center for entertainment. The entertainment industry is no stranger to technology change. Radio, TV, computer graphics special effects, video streaming, and social media transformed the industry. But the path to navigating AI’s transformation is still unclear, and organizations like the new Creators Coalition on AI are trying to stake out positions. Unfortunately, Hollywood’s negative sentiment toward AI also means it will produce a lot more Terminator-like movies that portray AI as more dangerous than helpful, and this hurts beneficial AI adoption as well.\n\nThe interests of AI and Hollywood are not always aligned. (Every time I speak in a group like this as the “AI representative,” I can count on being asked very hard questions.) Most of us in tech would prefer a more open internet and more permissive use of creative works. But there is also much common ground, for example in wanting guardrails against deepfakes and a smooth transition for those whose jobs are displaced, perhaps via upskilling.\n\nStorytelling is hard. I’m optimistic that AI tools like Veo, Sora, Runway, Kling, Ray, Hailuo, and many others can make video creation easier for millions of people. I hope Hollywood and AI developers will find more opportunities to collaborate, find more common ground, and also steer our projects toward outcomes that are win-win for as many parties as possible.\n\n[Original text: https://www.deeplearning.ai/the-batch/issue-340/ ]", "link": "https://nitter.net/AndrewYNg/status/2022345770398347407", "date": "Fri, 13 Feb 2026 16:22:59 GMT", "desc": "I recently spoke at the Sundance Film Festival on a panel about AI. Sundance is an annual gathering of filmmakers and movie buffs that serves as the premier showcase for independent films in the United States. Knowing that many people in Hollywood are extremely uncomfortable about AI, I decided to immerse myself for a day in this community to learn about their anxieties and build bridges. I’m grateful to Daniel Dae Kim @danieldaekim, an actor/producer/director I’ve come to respect deeply for his", "username": "AndrewYNg", "name": "Andrew Ng", "tag": "AI教育"}, {"title": "We just launched Codex Security! \n\nProbably a no-brainer for most teams to turn on. Some things I'm excited about it:\n- Agentic security review leveraging our SOTA models\n- Always on codebase scanning \n- Detailed reports with code paths on vulnerabilities\n- Auto-fix any report with a PR\n\nTeams and enterprises can try it out through Codex web.", "link": "https://nitter.net/rohanvarma/status/2030002820515291215", "date": "Fri, 06 Mar 2026 19:29:22 GMT", "desc": "We just launched Codex Security! Probably a no-brainer for most teams to turn on. Some things I'm excited about it: - Agentic security review leveraging our SOTA models - Always on codebase scanning - Detailed reports with code paths on vulnerabilities - Auto-fix any report with a PR Teams and enterprises can try it out through Codex web. Video", "username": "sama", "name": "Sam Altman", "tag": "OpenAI CEO"}, {"title": "最近两三年，美国股市大涨。但是，我本周才知道有一类股票，不仅没涨，还下跌了。\n\n你真想不到，这种倒霉的股票就是软件股。\n\n不仅美国如此，我查了中国股市，软件股也没涨。\n\n为什么AI股一路高歌，不断上涨，软件股却阴跌不已？难道AI不属于软件吗？\n\n我写了一点自己的看法。https://www.ruanyifeng.com/blog/2026/02/weekly-issue-384.html", "link": "https://nitter.net/ruanyf/status/2019580372741480789", "date": "Fri, 06 Feb 2026 01:14:17 GMT", "desc": "最近两三年，美国股市大涨。但是，我本周才知道有一类股票，不仅没涨，还下跌了。 你真想不到，这种倒霉的股票就是软件股。 不仅美国如此，我查了中国股市，软件股也没涨。 为什么AI股一路高歌，不断上涨，软件股却阴跌不已？难道AI不属于软件吗？ 我写了一点自己的看法。ruanyifeng.com/blog/2026/02/…", "username": "ruanyf", "name": "阮一峰", "tag": "科技知识长文"}]};</script>

e": "电子版，19.8一份，卖了1447份，销售额两万八千多。\n自动发货，几乎零成本，每多卖一份都是赚的。\n不过这里最难的可能是怎么卖出去。", "link": "https://nitter.net/gefei55/status/2034062863875387444", "date": "Wed, 18 Mar 2026 00:22:32 GMT", "desc": "电子版，19.8一份，卖了1447份，销售额两万八千多。 自动发货，几乎零成本，每多卖一份都是赚的。 不过这里最难的可能是怎么卖出去。", "username": "gefei55", "name": "哥飞", "tag": "出海SEO"}, {"title": "Openclaw 之类的工具，浮现也就不到两个月。安装调试起来还是很花时间，虽然会带来一些多巴胺的刺激，但并没有在严肃的任务上带来明确的省钱省时间的好处。所以应当再等等，等到前人把各种安全方面的雷区都滚过一遍了，等到它明确无误的展现出应用价值了，等到易用性提高后，再入场。与其焦虑的花时间安装 openclaw, 不如每天多站桩半小时，这样还可以让睾酮分泌保持健康旺盛的水平。\n\n另外一个角度：在这场热闹的玩龙虾的运动中，谁占据了垄断的生态位？不是大模型提供商，因为换模型很容易。如果没有任何玩家在垄断，那么参与这场游戏，除了刷存在感以外，有什么好处呢？", "link": "https://nitter.net/Svwang1/status/2031814658743795844", "date": "Wed, 11 Mar 2026 19:28:58 GMT", "desc": "Openclaw 之类的工具，浮现也就不到两个月。安装调试起来还是很花时间，虽然会带来一些多巴胺的刺激，但并没有在严肃的任务上带来明确的省钱省时间的好处。所以应当再等等，等到前人把各种安全方面的雷区都滚过一遍了，等到它明确无误的展现出应用价值了，等到易用性提高后，再入场。与其焦虑的花时间安装 openclaw, 不如每天多站桩半小时，这样还可以让睾酮分泌保持健康旺盛的水平。 另外一个角度：在这场热闹的玩龙虾的运动中，谁占据了垄断的生态位？不是大模型提供商，因为换模型很容易。如果没有任何玩家在垄断，那么参与这场游戏，除了刷存在感以外，有什么好处呢？ DiscusFish (@bitfish) 最近明显感觉记忆力在下降。 搜了一下，MIT最近发了个研究：长期用AI的人，脑区协同活动大幅减弱——你以为AI在帮你想，其实你的脑子在关机 我把论文甩给了我的龙虾。 \"看来只能忍痛把你卸了\" 龙虾沉默了三秒： \"别急。有个叫JITAI的框架，研究了三十年——干预在'认知恢复窗口'传递，效果远超随机时刻。你的Oura有Restored这个窗口,有api我能读\" \"你不用卸载我。让我反过来逼你学习\" 别", "username": "Svwang1", "name": "王川", "tag": "深度长推+认知商业"}, {"title": "R to ✨WaytoAGI知识库整理了超多OpenClaw相关教程：\nhttps://waytoagi.feishu.cn/wiki/CCR4wl3upi6dF9kVE5YcAcGcnlU", "link": "https://nitter.net/WaytoAGI/status/2031649558393139357", "date": "Wed, 11 Mar 2026 08:32:55 GMT", "desc": "✨WaytoAGI知识库整理了超多OpenClaw相关教程： waytoagi.feishu.cn/wiki/CCR4…", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "🦞OpenClaw技术架构拆解，带你手搓一个最小的龙虾\n\n我们邀请到了Share AI 的来新璐拆解了OpenClaw 技术架构，结论极其简单：\n\n小龙虾 = Claude Code + 定时器 + 自己没事给自己找事干\n\n就这两个机制，让它从被动工具变成了主动运转的个人 AI 助手。\n\n1/ 三个核心机制\n\n🕐 定时任务 \n支持一次性、周期性、标准 Cron 三种模式。用户可以设，agent 自己也可以主动给自己加任务。\n\n💓 心跳 \n每30秒系统自动发一条消息，让 agent 看看有没有事可以做。有事就干，没事不打扰你。这是它和 Claude Code 的本质区别：Claude Code 踹一下动一下，小龙虾每30秒自己醒一次。\n\n🧠 Soul \n把人格设定单独抽成 soul.md，agent 启动时自动读取。社区里可以互相分享 soul.md，\"传播灵魂\"说的就是这个。\n\n2/ 现场发生了什么\n\n分享进行20分钟，他开播前交给 agent 的翻译任务已经悄悄完成，英语和日语版本静静出现在 GitHub 仓库里，他自己都没注意。\n\nOpenClaw 一周新增约5000个 commit，相当于一个工程师连续干一年的量。\"这个项目99%是非人类在更新。\"\n\n最炸的环节：让小龙虾给网友打 FaceTime，电话真的拨通了，对方直接被拉进来即兴连线。\n\n分享快结束时让龙虾\"退出飞书\"，现场就这么被它亲手搞掉了。\n\n3/ 几个判断\n\n本地部署远比云端有价值。云端能干的事和 Manus 没区别，本地能读你所有文件、清理磁盘、帮你找东西。\n\n权限越大，风险越大，有人让它\"继续干所有能干的事\"，差点把给甲方的数据也删了。\n\n复杂任务尽量用 Claude，差距非常明显。有 Claude Code 订阅的可以把 agent core 替换成 Claude Code CLI，复用订阅不走 API，成本更低。\n\n整理自 WaytoAGI 分享，嘉宾：来新璐\n#通往AGI之路 #WaytoAGI #Openclaw #小龙虾 #开发者 #AI开源社区 #shareAI", "link": "https://nitter.net/WaytoAGI/status/2031649232814485733", "date": "Wed, 11 Mar 2026 08:31:37 GMT", "desc": "🦞OpenClaw技术架构拆解，带你手搓一个最小的龙虾 我们邀请到了Share AI 的来新璐拆解了OpenClaw 技术架构，结论极其简单： 小龙虾 = Claude Code + 定时器 + 自己没事给自己找事干 就这两个机制，让它从被动工具变成了主动运转的个人 AI 助手。 1/ 三个核心机制 🕐 定时任务 支持一次性、周期性、标准 Cron 三种模式。用户可以设，agent 自己也可以主动给自己加任务。 💓 心跳 每30秒系统自动发一条消息，让 agent 看看有没有事可以做。有事就干，没事不打扰你。这是它和 Claude Code 的本质区别：Claude Code 踹一下动一下，小龙虾每30秒自己醒一次。 🧠 Soul 把人格设定单独抽成 soul.md，agent 启动时自动读取。社区里可以互相分享 soul.md，\"传播灵魂\"说的就是这个。 2/ 现场发生了什么 分享进行20分钟，他开播前交给 agent 的翻译任务已经悄悄完成，英语和日语版本静静出现在 GitHub 仓库里，他自己都没注意。 OpenClaw 一周新增约5000个 commit，相当于一个工程师连续干", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "APP 设计里的游戏感和游戏化\n\n#迷你设计课\n\n好久没黑多邻国和 Anki 了，今天继续\n\nCapWords 学外语、背单词的方式，特别像玩“宝可梦”游戏搜集宝贝，它利用了每个人都有的好奇心，以及搜集好东西的本能\n\n每天都能拍到意想不到的照片、学到意想不到的单词，别说是小朋友喜欢玩这个“学单词”的游戏，成年人也能很愉快地积累单词量\n\n这种采集和收获过程，最终能激发你的内啡肽，让你产生发自内心的成就感和愉悦感，让你还想一直玩下去\n\n现在越来越多的产品设计也像 CapWords 这样，引入了游戏的手感和游戏的体验，这种设计方法一般叫做 游戏感 / Game-like design，最典型的例子还有 not boring 出的有趣天气预报 app\n\n---\n\n相反，多邻国背单词的方式，性质和小时候父母说“英语考95分以上，就奖励你100块！”很相似，当时很刺激，但现在你既不记得当时考试里的单词、也不记得 100 块拿来买什么好东西了\n\n多邻国刺激的是多巴胺，当时的确也很爽，但多邻国带来的这一点点刺激，很快就不足以抵消重复背单词的无聊和痛苦\n\n多邻国这种设计方法，就是 游戏化 / Gamification，它创造一个奖励系统来骗你干苦力活\n\n---\n\n现在的用户越来越聪明，普通的“游戏化”越来越难打动用户。这时候就体现出了“游戏感”的好处，谁不喜欢玩啊？！\n\n至于 Anki，它只适合特定的人", "link": "https://nitter.net/nishuang/status/1909820720076501261", "date": "Wed, 09 1 GMT", "desc": "April 8 — AGI HORIZON: Tokyo 2026 | Global AI Builders Summit will take place at Happo-en in Tokyo, Japan. Hosted by WaytoAGI, this highly curated summit converges the world's top AI leaders, tech practitioners, visionary founders, creators, and tier-1 investors. Experience a high-octane day featuring immersive Keynotes, thought-provoking Panel Discussions, lightning-fast Demo Shows, breathtaking AI Art Exhibitions, and exclusive VVIP Tea Ceremony Networking in a 400-year-old Zen garden. The fut", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "比龙虾更可控，首个为一人公司打造的 AI 工作空间 Floatboat 来了\n\n我们邀请到了 http://floatboat.ai 创始人少卿，分享他花了大半年打磨的 all-in-one AI 工作台 Floatboat。\n\n从产品逻辑到真实用法，每个案例都是可以直接抄的工作流，信息量拉满👇\n\nFloatboat 解决了什么问题？\n\n做复杂项目时，你可能同时开着文件管理器、浏览器、AI工具、文档……每切换一次都是打断，上下文来回传。\n\n少卿的核心判断：上下文管理 = 文件夹管理 + 标签页管理\n解法：把 chat / file manager / browser 三个视图放进同一界面，自由组合，随时拖拽，切换时间直接省掉。\n\n几个关键功能\n\n📁 多视图自由拼合 \nchat、file manager、browser 三个视图可以任意组合并排显示。演示里少卿同时开了5个文件夹，每个文件夹是一个独立上下文，你告诉 agent \"把这个转成 PDF\"，它自己知道你指的是哪一个，不需要再解释一遍。\n\n🖱️ 全局拖拽，文件即上下文\n文件管理器是完整可用的，不是摆设。你可以直接把文档拖进对话，告诉 agent \"把这几个版本合并一下\"或者\"选中这份转成 PDF\"，全程不需要手动上传、也不需要切换窗口，选中即处理。\n\n📸 截图存 Memo，一键建日程\n演示里少卿截了一张直播预告图，存入 Memo 后点一下 combo skill，agant 自动解析出标题、时间、内容，直接写入系统日历。专门做了截图入口，是因为很多时候图片根本拖不出来，这个路径更顺。\n\n🔁 任务沉淀为可复用 Skill \n跑完一个任务，觉得这个流程值得留下来，点一下\"沉淀为技能\"，agent 会把有效路径提炼出来保存到技能库。这些 Skill 可以在其他会话里直接加载，也可以上架官方市场供其他用户安装，后续经济系统上线后还支持二创分成。\n\n💬 龙虾模式：把 agent 拉进 IM 里干活 \n开启后可以把创建好的 agent 拉进飞书群或 Telegram。你在手机上发消息，agent 在电脑上执行任务。出门吃饭前布置好任务，回来打开手机问\"做完了没\"，agent 直接回复结果，不需要再坐回电脑前重新操作一遍。\n\n社区用户真实案例\n\nAI短剧创作者陈星：输入主题自动生成项目文件夹结构（梗概 / 角色 / 分镜 / 音频），分屏把即梦、素材、提示词全放一起，省掉大量工具切换\n\n入境游创业者刘宇龙：喂 logo 和品牌文档 → 自动生成官网页面，对话修改文案，中英文报价单一并输出，整套流程保存为 Skill 直接复用\n\n实用信息\n🤖 内置 Gemini & Claude，多模态推荐首选 Gemini \n🔌 支持接入 n8n / Dify / Coze，填入自己的 key 积分消耗更低 \n🔄 文件夹整理支持一键回滚，放心试\n\n如果你是一人公司、自由职业者，或者每天在多个工具之间反复横跳，这套思路值得认真看一看。\n#WaytoAGI #AITools #AgentWorkflow #Productivity #FloatboatAI", "link": "https://nitter.net/WaytoAGI/status/2033821568598720809", "date": "Tue, 17 Mar 2026 08:23:43 GMT", "desc": "比龙虾更可控，首个为一人公司打造的 AI 工作空间 Floatboat 来了 我们邀请到了 floatboat.ai 创始人少卿，分享他花了大半年打磨的 all-in-one AI 工作台 Floatboat。 从产品逻辑到真实用法，每个案例都是可以直接抄的工作流，信息量拉满👇 Floatboat 解决了什么问题？ 做复杂项目时，你可能同时开着文件管理器、浏览器、AI工具、文档……每切换一次都是打断，上下文来回传。 少卿的核心判断：上下文管理 = 文件夹管理 + 标签页管理 解法：把 chat / file manager / browser 三个视图放进同一界面，自由组合，随时拖拽，切换时间直接省掉。 几个关键功能 📁 多视图自由拼合 chat、file manager、browser 三个视图可以任意组合并排显示。演示里少卿同时开了5个文件夹，每个文件夹是一个独立上下文，你告诉 agent \"把这个转成 PDF\"，它自己知道你指的是哪一个，不需要再解释一遍。 🖱️ 全局拖拽，文件即上下文 文件管理器是完整可用的，不是摆设。你可以直接把文档拖进对话，告诉 agent \"把这几个版本合", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "早上做力量训练或者爆发力训练，可以精神振奋 ； \n\n避免和外界直接竞争，专注构建各类结构性优势，积累垄断性资产，可以减小日常压力 ； \n\n多练站桩和太极，可以激活副交感神经，抑制身体炎症，促进机体恢复和深度睡眠; \n\n深度睡眠后大脑分泌更多生长激素，早起后更加振奋。", "link": "https://nitter.net/Svwang1/status/2031207231161774281", "date": "Tue, 10 Mar 2026 03:15:16 GMT", "desc": "早上做力量训练或者爆发力训练，可以精神振奋 ； 避免和外界直接竞争，专注构建各类结构性优势，积累垄断性资产，可以减小日常压力 ； 多练站桩和太极，可以激活副交感神经，抑制身体炎症，促进机体恢复和深度睡眠; 深度睡眠后大脑分泌更多生长激素，早起后更加振奋。 硅谷王川 Chuan (@Svwang1) 提高生活质量就关注三个要素： 早上精神振奋，白天精神压力可控，晚上睡眠深沉。 其它东西都是浮云。 — https://nitter.net/Svwang1/status/2031055450591105324#m", "username": "Svwang1", "name": "王川", "tag": "深度长推+认知商业"}, {"title": "约翰·卡马克对于微软用 AI 生成了《雷神之锤 II》的回应：\n\n我觉得你可能误解了这个技术演示的本质，不过我还是愿意和你聊聊我所理解的你担忧的那个点——AI工具的兴起，让程序员、艺术家和设计师这些职业的技能逐渐变得简单和普通。\n\n最初，我自己开发游戏时需要手工用机器码编程，还得把画在方格纸上的图案逐个转换成十六进制的数字。可随着软件技术的发展，这种曾经必不可少的苦工，就像古代战车车轮的维护一样，早已不再相关。\n\n事实上，构建强大的工具一直都是计算机进步的核心所在。\n\n游戏引擎的出现，大幅扩大了能够参与游戏开发的人群范围，虽然它也确实降低了我所热爱的系统工程方面的重要性。\n\n而AI工具的兴起，同样也将帮助最顶尖的创作者迈上更高的高度，让规模更小的团队也能实现更多想法，甚至会吸引一些过去根本不可能进入这个领域的新创作者群体。\n\n未来的世界里，可能确实会出现你只需输入一个简单的文字提示，就能生成互动游戏（或小说、电影）的场景。但那些真正卓越的经典作品，仍将是由充满热情的专业团队精雕细琢而成。\n\n从整体来看，我们在单位成本下所能获得的优质内容，将会大大增加。\n\n至于游戏开发者的岗位究竟会增多还是减少，这目前还是个未知的问题。有可能像农业一样，科技进步让极少数人就能满足所有人的需求；也可能像社交媒体行业那样，各种规模的创意型创业蓬勃兴起。\n\n但无论如何，单纯因为担心工具抢走人的工作机会，就拒绝使用先进工具，这显然不是一种成功的策略。", "link": "https://nitter.net/dotey/status/1909713128323268751", "date": "Tue, 08 Apr 2025 21:01:05 GMT", "desc": "约翰 为推文翻译\n---\n\nMiMo-V2-Pro、Omni 和 TTS 发布了。这是我们第一个真正为 Agent 时代打造的全栈模型家族。\n\n我把这次发布称为一场无声的奇袭，不是因为我们刻意谋划，而是因为从 Chat 到 Agent 的范式转换来得太快，快到连我们自己都不敢相信。那个过程让人兴奋、痛苦，又着迷。\n\n1T 参数的基座模型几个月前就开始训练了。最初的目标是长上下文推理效率。混合注意力（Hybrid Attention）机制有真正的创新，但没有用力过猛，而事实证明，它恰好是 Agent 时代最合适的基础架构。百万级上下文窗口。MTP 推理（Multi-Token Prediction）实现超低延迟和成本。这些架构决策在当时并不时髦，但它们是我们在需要之前就建好的结构性优势。\n\n真正改变一切的，是第一次亲身体验一个复杂的智能体脚手架，我称之为\"编排式上下文\"（orchestrated Context）。第一天我就被震撼到了。我试图说服团队去用它，但没用。\n\n于是我下了一道硬指令：MiMo 团队里，明天跟 Agent 系统的对话不到 100 轮的人，可以走人。这招管用了。一旦团队的想象力被智能体系统的能力点燃，这种想象力就直接转化为了研究速度。\n\n人们总问我们为什么能跑这么快。我在做 DeepSeek R1 的时候亲眼见证过。我的真实总结：\n\n— 基座与基础设施研究周期很长。你需要在它产出回报的一年前就有战略定力。\n\n— 后训练的敏捷性是另一种能力：靠产品直觉驱动评估，压缩迭代周期，及早捕捉范式转换。\n\n— 还有那些不变的东西：好奇心、敏锐的技术直觉、果断的执行力、全力以赴，以及一样很容易被低估的东西：对你正在为之构建的世界，发自内心的热爱。\n\n我们会开源的——等模型稳定到值得开源的时候。\n\n发自北京，很晚了，还没完全清醒。\n\n---\n\n译注：\n- orchestrated Context：作者自创概念，指复杂 Agent 系统中经过编排的上下文管理方式\n- MTP：Multi-Token Prediction，一种可同时预测多个 token 的推理方式，能降低延迟和成本", "link": "https://nitter.net/dotey/status/2034676907359576501", "date": "Thu, 19 Mar 2026 17:02:31 GMT", "desc": "以下为推文翻译 --- MiMo-V2-Pro、Omni 和 TTS 发布了。这是我们第一个真正为 Agent 时代打造的全栈模型家族。 我把这次发布称为一场无声的奇袭，不是因为我们刻意谋划，而是因为从 Chat 到 Agent 的范式转换来得太快，快到连我们自己都不敢相信。那个过程让人兴奋、痛苦，又着迷。 1T 参数的基座模型几个月前就开始训练了。最初的目标是长上下文推理效率。混合注意力（Hybrid Attention）机制有真正的创新，但没有用力过猛，而事实证明，它恰好是 Agent 时代最合适的基础架构。百万级上下文窗口。MTP 推理（Multi-Token Prediction）实现超低延迟和成本。这些架构决策在当时并不时髦，但它们是我们在需要之前就建好的结构性优势。 真正改变一切的，是第一次亲身体验一个复杂的智能体脚手架，我称之为\"编排式上下文\"（orchestrated Context）。第一天我就被震撼到了。我试图说服团队去用它，但没用。 于是我下了一道硬指令：MiMo 团队里，明天跟 Agent 系统的对话不到 100 轮的人，可以走人。这招管用了。一旦团队的想象力被", "username": "dotey", "name": "宝玉", "tag": "Prompt+AI实战工具"}, {"title": "传说中的DeepSeek天才少女、雷军千万年薪挖角的罗福莉也开始发推了。\n\n帖子里最生动的段落是关于她第一次使用复杂 Agent 脚手架的经历。她用的词是：orchestrated Context，编排过的上下文，我理解就是现在比较火的 Harness Engineering。\n\n她说第一天就被震惊了，然后试图说服团队去用，没成功，于是下了一个硬性命令：\n> MiMo 团队里，明天对话数不到 100 条的人，可以辞职了。\n\n这个管理风格相当激进，但有效。一旦团队的想象力被 Agent 系统的能力点燃，这种想象力就直接转化成了研发速度。\n\n一方面确实霸气，一方面也让我有点意外，原以为大模型团队应该是更积极拥抱这种从传统 Chat 模型到 Agent 模型范式变化的。\n\n其他都是“干货”\n\n1. 提前押注的架构优势\n
