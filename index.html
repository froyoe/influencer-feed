ch. Financial Times (@FT) China’s open-source AI is a national advantage on.ft.com/48ZOaiY | opinion — https://nitter.net/FT/status/199820416149877", "username": "kaifulee", "name": "李开复", "tag": "大模型+AI产业趋势"}, {"title": "提高生活质量就关注三个要素：\n\n早上精神振奋，白天精神压力可控，晚上睡眠深沉。\n\n其它东西都是浮云。", "link": "https://nitter.net/Svwang1/status/2031055450591105324", "date": "Mon, 09 Mar 2026 17:12:09 GMT", "desc": "提高生活质量就关注三个要素： 早上精神振奋，白天精神压力可控，晚上睡眠深沉。 其它东西都是浮云。", "username": "Svwang1", "name": "王川", "tag": "深度长推+认知商业"}, {"title": "服务100+AI产品后，他把SEO营销经验做成了144个AI技能包\n\n3月7日我们有幸邀请了AI出海增长专家Kostja（k神），85分钟把三年、100+产品的SEO实战经验讲了个透。\n\n他做了一件很值得关注的事：把这些经验打包成144个开源Marketing Skills，放在GitHub上免费用。\n\n1. Skills是什么\n\n人读文章，普通AI读Markdown，Agent读Skills。\n\nSkills不只是文档，它有触发逻辑、模块间互相引用，提示词里出现对应关键词就会自动调用，不需要手动指定。装在Cursor里能用，换到Replit里照样能用，一个字不用改。\n\n2. 144个Skills覆盖了什么\n\n核心三块：SEO技术层（robots.txt、sitemap、IndexNow、可爬取性）、页面模板（首页、功能页、定价页、FAQ、API介绍页、客户案例页……ToB ToC都有）、可复用组件。\n\n另外有两个跨渠道都用得上的：关键词调研和竞品调研。程序化SEO和寄生SEO也有专门的Skills写得很细。\n\n3. 核心用法：上下文+Skills\n\n装了Skills还不够。要先让AI生成一份产品上下文文档，产品定位、目标用户、已有页面关键词、竞品信息、品牌调性都放进去。文档让AI写，不要人写，AI比人全面。\n\n有了上下文再叠加Skills，生成出来才是真正可用的内容。他现场演示生成了一个use case页面，面包屑、H1、内链、schema代码都有，从SEO角度直接能用。\n\n4. 迭代方法\n\n生成结果不满意，不是去改提示词，而是把结果丢给AI让它改Skills本身，再用新Skills重新生成。每一次不满意都变成下一次更准的输出。\n\n他还用飞书妙记把每周和客户的会议记录转录出来，让AI分析哪些内容需要更新进Skills，几轮下来那份上下文文档会越来越贴合实际项目。\n\n5. 工具选型\n\nLovable：适合前期可视化搭建，他自己的网站就是先用Lovable做出来。 给客户交付：用Lovable搭好，让客户一比一复刻到自己网站，用他们自己的技术栈发布。 \n\n另外他说,9.9分的模型和9.8分的模型对大多数人来说没什么区别，更值得提升的是自己调用AI的能力。\n\n6. 一个风险要注意\n\n有安全研究表明部分Skills存在投毒情况，agent权限很大，被恶意利用风险不低。建议优先装官方发布的Skills，非官方的先审查内容再装，或者把agent权限调低。\n\n7. 最后\n\n144个Skills全部开源，GitHub上直接搜Kostja的marketing-skills。他说把GitHub链接直接丢给AI让它自己安装就行，README是给AI看的，它能搞定。", "link": "https://nitter.net/WaytoAGI/status/2031018664670134641", "date": "Mon, 09 Mar 2026 14:45:58 GMT", "desc": "服务100+AI产品后，他把SEO营销经验做成了144个AI技能包 3月7日我们有幸邀请了AI出海增长专家Kostja（k神），85分钟把三年、100+产品的SEO实战经验讲了个透。 他做了一件很值得关注的事：把这些经验打包成144个开源Marketing Skills，放在GitHub上免费用。 1. Skills是什么 人读文章，普通AI读Markdown，A 地知识库，买哪个笔记本比较好呢？ 有点想上 M5 MAX 了 — https://nitter.net/Jackywine/status/2034870952333574338#m", "username": "lxfater", "name": "铁锤人", "tag": "AI创业+Agent"}, {"title": "WaytoAGI 请到了 @dedaluslabs 创始人 @itsCathyDi 和 AJ 一起聊了 硅谷 YC 创业者在用 Agent 做什么、龙虾的安全问题、工作流和 Agent 的区别、怎么融资、怎么讲故事。\n\n👇🏻整场分享聊了两个多小时，下面是精华内容整理\n\n1/ Cathy 的背景：普林斯顿 CS，退学创业，在 YC 最后5分钟递交申请，当天就进了，种子轮融了 $11M。联创 Windsor 是前 DeepMind / Sentient AGI。\n平均年龄23岁的团队，在硅谷做 agent 基础设施。\n\n2/ 她们公司内部禁用龙虾。\n原因是 90% 的龙虾可以被 prompt injection 直接盗走密钥。即便部署到云端，agent 在和外部工具交互时依然要把密钥传出去，传递过程就可能被拦截。\n她们在龙虾出来的两个月前，就开始做自己的开源安全体系 DAuth 了。\n\n3/ 硅谷 YC 创业者都在搭什么 agent？\n• 垂直行业最多：销售、保险、贷款、医疗 \n• Coding agent 很火：Claude Code、Codex \n• 国内少见但美国已规模化的方向：agent 测评（帮企业测试和优化外包的 agent）\n通用 agent 好用，但做不了垂直行业的专家。真正能变现的机会在具体行业里。\n\n4/ agent 和工作流的区别：\n工作流是线性的，每一步你提前设好。\nagent 是非线性的，你给它一个开放性目标，它自己决定怎么完成，每次跑的路径可能都不一样。\n正因为 agent 是自主的，给它太多权限就很危险。她的建议是多 Agent 架构，核心是上下文与权限隔离：主 agent 负责调度但权限最少，执行交给权限隔离的子 agent。\n\n5/ 她们的产品 Dedalus Labs：5行代码搭出一个可商业化的 agent。\n背后是几万行的封装——tool call 解析、多模型切换、streaming，全在 runner 里。支持任意模型，DeepSeek、Kimi、Claude 都可以，支持支付宝充值。\n\n6/ 4月要办一个 agent 大赛，叫 ATM（Agent Tournament for Money）。\n评判标准只有一个：谁的 agent 赚的钱多。\n能稳定赚钱的 agent，一定是从真实痛点出发、基础设施足够可靠的 agent。\n\n7/ 最后一句话值得单独说：\n\"世界上 99% 有价值的 agent，现在都还没被搭出来。不是因为技术不够，而是因为大多数人还没想到。\"\n她管这个叫 imagination ceiling，想象力壁垒。你搭不出你想象不到的东西，你想象不到你定义不清楚的东西。\n\n龙虾打开了很多人对 Agent 的感知，但感知是起点，不是终点。\n从感知到真正做出一个能用、能赚钱、安全稳定的 Agent，中间还有很长一段路。\n#通往AGI之路 #WaytoAGI #YC创业者 #Agent #工作流", "link": "https://nitter.net/WaytoAGI/status/2034934430373224507", "date": "Fri, 20 Mar 2026 10:05:50 GMT", "desc": "WaytoAGI 请到了 @dedaluslabs 创始人 @itsCathyDi 和 AJ 一起聊了 硅谷 YC 创业者在用 Agent 做什么、龙虾的安全问题、工作流和 Agent 的区别、怎么融资、怎么讲故事。 👇🏻整场分享聊了两个多小时，下面是精华内容整理 1/ Cathy 的背景：普林斯顿 CS，退学创业，在 YC 最后5分钟递交申请，当天就进了，种子轮融了 $11M。联创 Windsor 是前 DeepMind / Sentient AGI。 平均年龄23岁的团队，在硅谷做 agent 基础设施。 2/ 她们公司内部禁用龙虾。 原因是 90% 的龙虾可以被 prompt injection 直接盗走密钥。即便部署到云端，agent 在和外部工具交互时依然要把密钥传出去，传递过程就可能被拦截。 她们在龙虾出来的两个月前，就开始做自己的开源安全体系 DAuth 了。 3/ 硅谷 YC 创业者都在搭什么 agent？ • 垂直行业最多：销售、保险、贷款、医疗 •  Obsidian 文件夹，适合管理文件结构。\n\n卡尔每天用它做：整理下载文件夹、批量优化稿件、拆分重组 Markdown、设置定时任务。\n\n分工逻辑：轻量任务先给 CodeX，解决不了交 Claude Code，再解决不了才上 OpenClaw。\n\n6️⃣进阶：用 OpenClaw 让知识库主动运转\n\nOpenClaw 支持心跳机制和 Cron，可以让 Agent 按计划自动扫描知识库、整理新增内容、发送日报，不需要手动触发。\n\n接入方式推荐飞书或 Discord。飞书可以配置多个 OpenClaw 应用共享同一套记忆体系；Discord 有频道隔离，可以在后台同时跑多个任务。\n\n在 OpenClaw 的 agents 配置文件里写清楚哪些内容归到哪个目录，新信息进来就自动分类，不需要二次整理。\n\n7️⃣防止 AI 误操作的两个措施\n\n软链接 — 只开放 Obsidian 特定文件夹的权限，Agent 无法访问其他文件\n\nGit 版本备份 — Code X 在执行命令前后自动存版本，随时可以回退\n\n卡尔的邪修做法：把本地除 Download 文件夹外的所有内容都同步到了 iCloud 2T\n\n8️⃣一个实用细节：上下文健康检测\n\n和 Claude 对话到五六十轮后，它的\"遗忘\"会明显加速，之前设定的偏好和技能会悄悄丢失。\n\n检测方法：设一个确认指令，能回复关键词说明上下文还在，不行就开新对话。\n\n真正难的不是安装 Obsidian，是想清楚你要管理什么，然后让 AI 读懂你的文件夹逻辑。\n\n#通往AGI之路 #WaytoAGI #OpenClaw #obisidan #claudecode #CodeX #AI知识管理 #知识体系", "link": "https://nitter.net/WaytoAGI/status/2032397724935692651", "date": "Fri, 13 Mar 2026 10:05:52 GMT", "desc": "10分钟用Obsidian + OpenClaw重构AI知识管理体系👇 我们有幸邀请到了AI自媒体博主@aiwarts 来WaytoAGI分享！他刚完成自己知识体系的完整重构，来分享整套方法。 1️⃣为什么选 Obsidian Obsidian 的底层是本地 Markdown 文件，AI Agent 直接读写，不需要 API、不需要授权。 Notion、飞书的数据在云端，AI 每次操作都要走 API，慢、贵、有限制，Obsidian 没有这些问题。 2️⃣第一步：统一信息入口 卡尔每天处理五六千条信息，分散在各处。他用三个插件解决入库问题： 飞书文档下载插件 — 批量转成 Markdown 导入 Obsidian Web Clipper — 抓网页，自动保留来源和 tag 微信笔记同步助手 — 微信内容直接同步进来 3️⃣视频和社交平台内容另有方案 X Reader 和 Agent Reach 可以覆盖小红书、公众号、B站、YouTube、抖音、GitHub，连评论区都能抓。 没看过的视频先存链接，确认值得看再用 AI 生成摘要收录，避免无效处理。 4️⃣第二步：搭 AI 能读懂的文件", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "两周前，一个 Cloudflare 工程师用 AI 重新实现了 Next.js，Token 费用是1100美元。\n\n我觉得，这件事情对Next.js的打击非常大。\n\n代码的护城河不存在了，只要投入一小笔金钱，AI 就能复刻出大型软件。\n\n防止复刻的关键是测试用例，我写了一点看法《测试是新的护城河》。https://www.ruanyifeng.com/blog/2026/03/weekly-issue-388.html", "link": "https://nitter.net/ruanyf/status/2032258957369360859", "date": "Fri, 13 Mar 2026 00:54:27 GMT", "desc": "两周前，一个 Cloudflare 工程师用 AI 重新实现了 Next.js，Token 费用是1100美元。 我觉得，这件事情对Next.js的打击非常大。 代码的护城河不存在了，只要投入一小笔金钱，AI 就能复刻出大型软件。 防止复刻的关键是测试用例，我写了一点看法《测试是新的护城河》。ruanyifeng.com/blog/2026/03/…", "username": "ruanyf", "name": " <script>window.__FEED_DATA__ = {"updated": "2026-03-21T00:44:59.521630", "count": 230, "influencers": [{"username": "kaifulee", "name": "李开复", "tag": "大模型+AI产业趋势"}, {"username": "dotey", "name": "宝玉", "tag": "Prompt+AI实战工具"}, {"username": "nishuang", "name": "倪爽", "tag": "产品工作流+趋势判断"}, {"username": "ruanyf", "name": "阮一峰", "tag": "科技知识长文"}, {"username": "Huanusa", "name": "Huan", "tag": "加密+趋势机遇"}, {"username": "op7418", "name": "歸藏", "tag": "AIGC视觉/视频"}, {"username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"username": "turingou", "name": "郭宇", "tag": "创业心态+技术路线"}, {"username": "virushuo", "name": "霍炬", "tag": "技术创业老兵"}, {"username": "Svwang1", "name": "王川", "tag": "深度长推+认知商业"}, {"username": "tualatrix", "name": "图拉鼎", "tag": "iOS独立开发"}, {"username": "gefei55", "name": "哥飞", "tag": "出海SEO"}, {"username": "lidangzzz", "name": "立党", "tag": "创业观点"}, {"username": "lijigang", "name": "李继刚", "tag": "Prompt方法论"}, {"username": "lxfater", "name": "铁锤人", "tag": "AI创业+Agent"}, {"username": "elonmusk", "name": "Elon Musk", "tag": "科技+商业+加密"}, {"username": "sama", "name": "Sam Altman", "tag": "OpenAI CEO"}, {"username": "karpathy", "name": "Andrej Karpathy", "tag": "深度学习"}, {"username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"username": "ylecun", "name": "Yann LeCun", "tag": "Meta AI"}, {"username": "AndrewYNg", "name": "Andrew Ng", "tag": "AI教育"}, {"username": "satyanadella", "name": "Satya Nadella", "tag": "Microsoft CEO"}, {"username": "sundarpichai", "name": "Sundar Pichai", "tag": "Google CEO"}, {"username": "JeffDean", "name": "Jeff Dean", "tag": "Google AI"}], "tweets": [{"title": "More decks to go, but has designing beautiful slides been a pain point? Upgrades from our Presentation Agent @popaiinone enable prompt-based co-creation! Once you nailed the text content, leave the style design (300+ templates), layout, caption/text edits, chart and graphs to AI.  Try now: https://www.popai.pro", "link": "https://nitter.net/kaifulee/status/1983598624107065581", "date": "Wed, 29 Oct 2025 18:15:40 GMT", "desc": "More decks to go, but has designing beautiful slides been a pain point? Upgrades from our Presentation Agent @popaiinone enable prompt-based co-creation! Once you nailed the text content, leave the style design (300+ templates), layout, caption/text edits, chart and graphs to AI. Try now: popai.pro Video", "username": "kaifulee", "name": "李开复", "tag": "大模型+AI产业趋势"}, {"title": "R to We would also like to thank our dexterous hand hardware provider, Sharpa, for their great support!", "link": "https://nitter.net/DrJimFan/status/2026709308713611695", "date": "Wed, 25 Feb 2026 17:22:08 GMT", "desc": "We would also like to thank our dexterous hand hardware provider, Sharpa, for their great support!", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "R to This is a huge team work at NVIDIA Robotics. Check out @ruijie_zheng12's deep dive: \n\n- Website: https://research.nvidia.com/labs/gear/egoscale/\n- Paper: https://arxiv.org/abs/2602.16710\n\nhttps://x.com/ruijie_zheng12/status/2026708731774542053", "link": "https://nitter.net/DrJimFan/status/2026709306629091342", "date": "Wed, 25 Feb 2026 17:22:07 GMT", "desc": "This is a huge team work at NVIDIA Robotics. Check out @ruijie_zheng12's deep dive: - Website: research.nvidia.com/labs/gea… - Paper: arxiv.org/abs/2602.16710 nitter.net/ruijie_zheng12/status/… Ruijie Zheng (@ruijie_zheng12) Proud to introduce EgoScale: We pretrained a GR00T VLA model on 20K+ hours of egocentric human video and discovered that robot dexterity can be scaled, not with more robots, but with more human data. A thread on 🧵what we learned. 👇 Video — https://nitter.net/ruijie_zheng12/s", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "We trained a humanoid with 22-DoF dexterous hands to assemble model cars, operate syringes, sort poker cards, fold/roll shirts, all learned primarily from 20,000+ hours of egocentric human video with no robot in the loop.\n\nHumans are the most scalable embodiment on the planet. We discovered a near-perfect log-linear scaling law (R² = 0.998) between human video volume and action prediction loss, and this loss directly predicts real-robot success rate.\n\nHumanoid robots will be the end game, because they are the practical form factor with minimal embodiment gap from humans. Call it the Bitter Lesson of robot hardware: the kinematic similarity lets us simply retarget human finger motion onto dexterous robot hand joints. No learned embeddings, no fancy transfer algorithms needed. Relative wrist motion + retargeted 22-DoF finger actions serve as a unified action space that carries through from pre-training to robot execution.\n\nOur recipe is called \"EgoScale\":\n\n- Pre-train GR00T N1.5 on 20K hours of human video, mid-train with only 4 hours (!) of robot play data with Sharpa hands. 54% gains over training from scratch across 5 highly dexterous tasks.\n- Most surprising result: a *single* teleop demo is sufficient to learn a never-before-seen task. Our recipe enables extreme data efficiency.\n- Although we pre-train in 22-DoF hand joint space, the policy transfers to a Unitree G1 with 7-DoF tri-finger hands. 30%+ gains over training on G1 data alone.\n\nThe scalable path to robot dexterity was never more robots. It was always us.\n\nDeep dives in thread:", "link": "https://nitter.net/DrJimFan/status/2026709304984875202", "date": "Wed, 25 Feb 2026 17:22:07 GMT", "desc": "We trained a humanoid with 22-DoF dexterous hands to assemble model cars, operate syringes, sort poker cards, fold/roll shirts, all learned primarily from 20,000+ hours of egocentric human video with no robot in the loop. Humans are the most scalable embodiment on the planet. We discovered a near-perfect log-linear scaling law (R² = 0.998) between human video volume and action prediction loss, and this loss directly predicts real-robot success rate. Humanoid robots will be the end game, because ", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "Impressive inference speed from Inception Labs’ diffusion LLMs. Diffusion LLMs are a fascinating alternative to conventional autoregressive LLMs. Well done @StefanoErmon and team!", "link": "https://nitter.net/AndrewYNg/status/2026478474681262576", "date": "Wed, 25 Feb 2026 02:04:53 GMT", "desc": "Impressive inference speed from Inception Labs’ diffusion LLMs. Diffusion LLMs are a fascinating alternative to conventional autoregressive LLMs. Well done @StefanoErmon and team! Stefano Ermon (@StefanoErmon) Mercury 2 is live 🚀🚀 The world’s first reasoning diffusion LLM, delivering 5x faster performance than leading speed-optimized LLMs. Watching the team turn years of research into a real product never gets old, and I’m incredibly proud of what we’ve built. We’re just getting started on what ", "username": "AndrewYNg", "name": "Andrew Ng", "tag": "AI教育"}, {"title": "Decent-quality LLMs from China are really helping make GenAI affordable and accessible to the world through open source.  Pursuing AGI with close models might be a winner-take-all game for U.S. big techs, but making AI more open will benefit researchers, students, entrepreneurs, and hobbyists in building AI that works for them.  More in this @BloombergAsia interview: \nhttps://www.bloomberg.com/news/videos/2025-11-18/sinovation-ventures-lee-on-china-us-ai-race-video", "link": "https://nitter.net/kaifulee/status/1990951867820671314", "date": "Wed, 19 Nov 2025 01:14:50 GMT", "desc": "Decent-quality LLMs from China are really helping make GenAI affordable and accessible to the world through open source. Pursuing AGI with close models might be a winner-take-all game for U.S. big techs, but making AI more open will benefit researchers, students, entrepreneurs, and hobbyists in building AI that works for them. More in this @BloombergAsia interview: bloomberg.com/news/videos/20…", "username": "kaifulee", "name": "李开复", "tag": "大模型+AI产业趋势"}, {"title": "Think of datacenter networking like water moving through pipes. \n \nTraditional optical cables move data through a narrow, fast stream of light. While Microsoft’s new MicroLED system sends data through thousands of channels at once – more like a wide, slow-moving river carrying the same volume. \n \nThe result: a new approach that researchers estimate could use about 50% less energy than mainstream laser-based optical cables, while supporting the massive data flows behind AI and cloud services. Learn how: https://msft.it/6001QoewP", "link": "https://nitter.net/Microsoft/status/2034351636445863941", "date": "Wed, 18 Mar 2026 19:30:01 GMT", "desc": "Think of datacenter networking like water moving through pipes. Traditional optical cables move data through a narrow, fast stream of light. While Microsoft’s new MicroLED system sends data through thousands of channels at once – more like a wide, slow-moving river carrying the same volume. The result: a new approach that researchers estimate could use about 50% less energy than mainstream laser-based optical cables, while supporting the massive data flows behind AI and cloud services. Learn how", "username": "satyanadella", "name": "Satya Nadella", "tag": "Microsoft CEO"}, {"title": "R to Ugh X breaks time links, it’s at 26:17", "link": "https://nitter.net/karpathy/status/2034329390377762848", "date": "Wed, 18 Mar 2026 18:01:37 GMT", "desc": "Ugh X breaks time links, it’s at 26:17", "username": "karpathy", "name": "Andrej Karpathy", "tag": "深度学习"}, {"title": "R to (link to blast from the past)\nhttps://youtu.be/xQhb3C2hQoE?si=x3qQMjG-dktoNNv_&t=1577", "link": "https://nitter.net/karpathy/status/2034325950310355072", "date": "Wed, 18 Mar 2026 17:47:57 GMT", "desc": "(link to blast from the past) piped.video/xQhb3C2hQoE?si=x3qQ…", "username": "karpathy", "name": "Andrej Karpathy", "tag": "深度学习"}, {"title": "R to The signature is alluding to NVIDIA GTC 2015, where Jensen excitedly told an audience of, at the time, mostly idia.com/blog/gtc-20… @DellT", "username": "karpathy", "name": "Andrej Karpathy", "tag": "深度学习"}, {"title": "New course: Agent Memory: Building Memory-Aware Agents, built in partnership with @Oracle and taught by  @richmondalake and Nacho Martínez.\n\nMany agents work well within a single session but their memory resets once the session ends. Consider a research agent working on dozens of papers across multiple days: without memory, it has no way to store and retrieve what it learned across sessions. This short course teaches you to build a memory system that enables agents to persist memory and thereby learn across sessions.\n\nYou'll design a Memory Manager that handles different memory types, implement semantic tool retrieval that scales without bloating the context, and build write-back pipelines that let your agent autonomously update and refine what it knows over time.\n\nSkills you'll gain:\n- Build persistent memory stores for different agent memory types\n- Implement a Memory Manager that orchestrates how your agent reads, writes, and retrieves memory\n- Treat tools as procedural memory and retrieve only relevant ones at inference time using semantic search\n\nJoin and learn to build agents that remember and improve over time!\n\nhttps://www.deeplearning.ai/short-courses/agent-memory-building-memory-aware-agents", "link": "https://nitter.net/AndrewYNg/status/2034314027678192114", "date": "Wed, 18 Mar 2026 17:00:34 GMT", "desc": "New course: Agent Memory: Building Memory-Aware Agents, built in partnership with @Oracle and taught by @richmondalake and Nacho Martínez. Many agents work well within a single session but their memory resets once the session ends. Consider a research agent working on dozens of papers across multiple days: without memory, it has no way to store and retrieve what it learned across sessions. This short course teaches you to build a memory system that enables agents to persist memory and thereby le", "username": "AndrewYNg", "name": "A oks very different because humans now move upwards and program at a higher level - the basic unit of interest is not one file but one agent. It’s still programming.", "link": "https://nitter.net/karpathy/status/2031767720933634100", "date": "Wed, 11 Mar 2026 16:22:27 GMT", "desc": "Expectation: the age of the IDE is over Reality: we’re going to need a bigger IDE (imo). It just looks very different because humans now move upwards and program at a higher level - the basic unit of interest is not one file but one agent. It’s still programming. Andrej Karpathy (@karpathy) tmux grids are awesome, but i feel a need to have a proper \"agent command center\" IDE for teams of them, which I could maximize per monitor. E.g. I want to see/hide toggle them, see if any are idle, pop open ", "username": "karpathy", "name": "Andrej Karpathy", "tag": "深度学习"}, {"title": "Excited to share @Standard_Kernel's seed round and some reflections on what we’ve learned about kernel generation and what we believe is next. Grateful to our amazing team, supporters, and the broader community pushing this space forward.", "link": "https://nitter.net/anneouyang/status/2031757990806823313", "date": "Wed, 11 Mar 2026 15:43:47 GMT", "desc": "Excited to share @Standard_Kernel's seed round and some reflections on what we’ve learned about kernel generation and what we believe is next. Grateful to our amazing team, supporters, and the broader community pushing this space forward.", "username": "JeffDean", "name": "Jeff Dean", "tag": "Google AI"}, {"title": "Welcome to the team @Wiz_io!", "link": "https://nitter.net/sundarpichai/status/2031738734350361069", "date": "Wed, 11 Mar 2026 14:27:16 GMT", "desc": "Welcome to the team @Wiz_io! Thomas Kurian (@ThomasOrTK) Today, we announced that Google has completed its acquisition of @wiz_io. Together, we’ll provide customers with a comprehensive platform to secure their cloud and hybrid environments. Coupled with our Google Unified Security platform, we will help accelerate the adoption of multicloud cybersecurity, the use of multicloud environments, and drive innovation and growth in cloud computing. — https://nitter.net/ThomasOrTK/status/20317172854347", "username": "sundarpichai", "name": "Sundar Pichai", "tag": "Google CEO"}, {"title": "R to ✨WaytoAGI知识库整理了超多OpenClaw相关教程：\nhttps://waytoagi.feishu.cn/wiki/CCR4wl3upi6dF9kVE5YcAcGcnlU", "link": "https://nitter.net/WaytoAGI/status/2031649558393139357", "date": "Wed, 11 Mar 2026 08:32:55 GMT", "desc": "✨WaytoAGI知识库整理了超多OpenClaw相关教程： waytoagi.feishu.cn/wiki/CCR4…", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "🦞OpenClaw技术架构拆解，带你手搓一个最小的龙虾\n\n我们邀请到了Share AI 的来新璐拆解了OpenClaw 技术架构，结论极其简单：\n\n小龙虾 = Claude Code + 定时器 + 自己没事给自己找事干\n\n就这两个机制，让它从被动工具变成了主动运转的个人 AI 助手。\n\n1/ 三个核心机制\n\n🕐 定时任务 \n支持一次性、周期性、标准 Cron 三种模式。用户可以设，agent 自己也可以主动给自己加任务。\n\n💓 心跳 \n每30秒系统自动发一条消息，让 agent 看看有没有事可以做。有事就干，没事不打扰你。这是它和 Claude Code 的本质区别：Claude Code 踹一下动一下，小龙虾每30秒自己醒一次。\n\n🧠 Soul \n把人格设定单独抽成 soul.md，agent 启动时自动读取。社区里可以互相分享 soul.md，\"传播灵魂\"说的就是这个。\n\n2/ 现场发生了什么\n\n分享进行20分钟，他开播前交给 agent 的翻译任务已经悄悄完成，英语和日语版本静静出现在 GitHub 仓库里，他自己都没注意。\n\nOpenClaw 一周新增约5000个 commit，相当于一个工程师连续干一年的量。\"这个项目99%是非人类在更新。\"\n\n最炸的环节：让小龙虾给网友打 FaceTime，电话真的拨通了，对方直接被拉进来即兴连线。\n\n分享快结束时让龙虾\"退出飞书\"，现场就这么被它亲手搞掉了。\n\n3/ 几个判断\n\n本地部署远比云端有价值。云端能干的事和 Manus 没区别，本地能读你所有文件、清理磁盘、帮你找东西。\n\n权限越大，风险越大，有人让它\"继续干所有能干的事\"，差点把给甲方的数据也删了。\n\n复杂任务尽量用 Claude，差距非常明显。有 Claude Code 订阅的可以把 agent core 替换成 Claude Code CLI，复用订阅不走 API，成本更低。\n\n整理自 WaytoAGI 分享，嘉宾：来新璐\n#通往AGI之路 #WaytoAGI #Openclaw #小龙虾 #开发者 #AI开源社区 #shareAI", "link": "https://nitter.net/WaytoAGI/status/2031649232814485733", "date": "Wed, 11 Mar 2026 08:31:37 GMT", "desc": "🦞OpenClaw技术架构拆解，带你手搓一个最小的龙虾 我们邀请到了Share AI 的来新璐拆解了OpenClaw 技术架构，结论极其简单： 小龙虾 = Claude Code + 定时器 + 自己没事给自己找事干 就这两个机制，让它从被动工具变成了主动运转的个人 AI 助手。 1/ 三个核心机制 🕐 定时任务 支持一次性、周期性、标准 Cron 三种模式。用户可以设，agent 自己也可以主动给自己加任务。 💓 心跳 每30秒系统自动发一条消息，让 agent 看看有没有事可以做。有事就干，没事不打扰你。这是它和 Claude Code 的本质区别：Claude Code 踹一下动一下，小龙虾每30秒自己醒一次。 🧠 Soul 把人格设定单独抽成 soul.md，agent 启动时自动读取。社区里可以互相分享 soul.md，\"传播灵魂\"说的就是这个。 2/ 现场发生了什么 分享进行20分钟，他开播前交给 agent 的翻译任务已经悄悄完成，英语和日语版本静静出现在 GitHub 仓库里，他自己都没注意。 OpenClaw 一周新增约5000个 commit，相当于一个工程师连续干", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "APP 设计里的游戏感和游戏化\n\n#迷你设计课\n\n好久没黑多邻国和 Anki 了，今天继续\n\nCapWords 学外语、背单词的方式，特别像玩“宝可梦”游戏搜集宝贝，它利用了每个人都有的好奇心，以及搜集好东西的本能\n\n每天都能拍到意想不到的照片、学到意想不到的单词，别说是小朋友喜欢玩这个“学单词”的游戏，成年人也能很愉快地积累单词量\n\n这种采集和收获过程，最终能激发你的内啡肽，让你产生发自内心的成就感和愉悦感，让你还想一直玩下去\n\n现在越来越多的产品设计也像 CapWords 这样，引入了游戏的手感和游戏的体验，这种设计方法一般叫做 游戏感 / Game-like design，最典型的例子还有 not boring 出的有趣天气预报 app\n\n---\n\n相反，多邻国背单词的方式，性质和小时候父母说“英语考95分以上，就奖励你100块！”很相似，当时很刺激，但现在你既不记得当时考试里的单词、也不记得 100 块拿来买什么好东西了\n\n多邻国刺激的是多巴胺，当时的确也很爽，但多邻国带来的这一点点刺激，很快就不足以抵消重复背单词的无聊和痛苦\n\n多邻国这种设计方法，就是 游戏化 / Gamification，它创造一个奖励系统来骗你干苦力活\n\n---\n\n现在的用户越来越聪明，普通的“游戏化”越来越难打动用户。这时候就体现出了“游戏感”的好处，谁不喜欢玩啊？！\n\n至于 Anki，它只适合特定的人", "link": "https://nitter.net/nishuang/status/1909820720076501261", "date": "Wed, 09 Apr 2025 04:08:37 GMT", "desc": "APP 设计里的游戏感和游戏化 #迷你设计课 好久没黑多邻国和 Anki 了，今天继续 CapWords 学外语、背单词的方式，特别像玩“宝可梦”游戏搜集宝贝，它利用了每个人都有的好奇心，以及搜集好东西的本能 每天都能拍到意想不到的照片、学到意想不到的单词，别说是小朋友喜欢玩这个“学单词”的游戏，成年人也能很愉快地积累单词量 这种采集和收获过程，最终能激发你的内啡肽，让你产生发自内心的成就感和愉悦感，让你还想一直玩下去 现在越来越多的产品设计也像 CapWords 这样，引入了游戏的手感和游戏的体验，这种设计方法一般叫做 游戏感 / Game-like design，最典型的例子还有 not boring 出的有趣天气预报 app --- 相反，多邻国背单词的方式，性质和小时候父母说“英语考95分以上，就奖励你100块！”很相似，当时很刺激，但现在你既不记得当时考试里的单词、也不记得 100 块拿来买什么好东西了 多邻国刺激的是多巴胺，当时的确也很爽，但多邻国带来的这一点点刺激，很快就不足以抵消重复背单词的无聊和痛苦 多邻国这种设计方法，就是 游戏化 / Gamification，它创", "username": "nishuang", "name": "倪爽", "tag": "产品工作流+趋势判断"}, {"title": "Amie 大变身\n\n他们原来定位是日历、to-do、email 三合一，Amie 2.0 发布之后，产品彻底转型，变成了提高会议效率的 AI 效率工具\n\n官网也从曾经最漂亮的效率工具官网，变成了图一这样子。视频展示的是以前的官网", "link": "https://nitter.net/nishuang/status/1909812590764577226", "date": "Wed, 09 Apr 2025 03:36:18 GMT", "desc": "Amie 大变身 他们原来定位是日历、to-do、email 三合一，Amie 2.0 发布之后，产品彻底转型，变成了提高会议效率的 AI 效率工具 官网也从曾经最漂亮的效率工具官网，变成了图一这样子。视频展示的是以前的官网 Video", "username": "nishuang", "name": "倪爽", "tag": "产品工作流+趋势判断"}, {"title": "新闻说 3 月底苹果包了 5 架飞机，装满了 iPhone 紧急空运到美国，以此来避免关税大战而新增的成本\n\n新闻还说苹果在美国的 iPhone 库存够卖几个月", "link": "https://nitter.net/nishuang/status/1909775827337634137", "date": "Wed, 09 Apr 2025 01:10:13 GMT", "desc": "新闻说 3 月底苹果包了 5 架飞机，装满了 iPhone 紧急空运到美国，以此来避免关税大战而新增的成本 新闻还说苹果在美国的 iPhone 库存够卖几个月 Dexerto (@Dexerto) Apple reportedly flew in 5 planes full of iPhones into the U.S. to avoid tariffs — https://nitter.net/Dexerto/status/1909683898373881873#m", "username": "nishuang", "name": "倪爽", "tag": "产品工作流+趋势判断"}, {"title": "R to 现在有很多原因降低了 iPhone 的需求，比如：\n\n- 消费者换新手机的时间变长（从 2 年换手机延长到 3、4年）\n- 中国市场的销量下跌\n- 关税大战带来的高价格\n\n在“肉眼可见”的未来，苹果肯定还会继续各种创新，来刺激消费者购买 iPhone", "link": "https://nitter.net/nishuang/status/1909774318411596192", "date": "Wed, 09 Apr 2025 01:04:14 GMT", "desc": "现在有很多原因降低了 iPhone 的需求，比如： - 消费者换新手机的时间变长（从 2 年换手机延长到 3、4年） - 中国市场的销量下跌 - 关税大战带来的高价格 在“肉眼可见”的未来，苹果肯定还会继续各种创新，来刺激消费者购买 iPhone", "username": "nishuang", "name": "倪爽", "tag": "产品工作流+趋势判断"}, {"title": "为什么苹果要搞“没必要”的创新\n\n不管是难用的 iOS 18 相册，还是十年用不上一次的卫星通信，或者 iPhone 17 Pro “前后摄像头同时拍摄”的传闻功能…这些“没必要”创新背后都有充分理由\n\n其中一个原因是“感知淘汰”（Perceived Obsolescence）\n\n即苹果不断投入新硬件、新功能、新体验…让用户觉得手上的 iPhone 已经过时，很想买一部新的\n\n现在大家明白为什么苹果没事想改 iOS 19 的图标了\n\n顺便说一下，苹果们还有一招叫做“计划报废”（Planned Obsolescence），意思是故意把产品寿命设计得比较短，让它们尽快被淘汰", "link": "https://nitter.net/nishuang/status/1909760671556026763", "date": "Wed, 09 Apr 2025 00:10:00 GMT", "desc": "为什么苹果要搞“没必要”的创新 不管是难用的 iOS 18 相册，还是十年用不上一次的卫星通信，或者 iPhone 17 Pro “前后摄像头同时拍摄”的传闻功能…这些“没必要”创新背后都有充分理由 其中一个原因是“感知淘汰”（Perceived Obsolescence） 即苹果不断投入新硬件、新功能、新体验…让用户觉得手上的 iPhone 已经过时，很想买一部新的 现在大家明白为什么苹果没事想改 iOS 19 的图标了 顺便说一下，苹果们还有一招叫做“计划报废”（Planned Obsolescence），意思是故意把产品寿命设计得比较短，让它们尽快被淘汰", "username": "nishuang", "name": "倪爽", "tag": "产品工作流+趋势判断"}, {"title": "Apple just named its latest laptop Neo -- same name as my son! Should I buy one? \n\nIf I run Amazon Nova on an Apple Neo I hope to blow both of my kids' minds.", "link": "https://nitter.net/AndrewYNg/status/2029269587670507833", "date": "Wed, 04 Mar 2026 18:55:46 GMT", "desc": "Apple just named its latest laptop Neo -- same name as my son! Should I buy one? If I run Amazon Nova on an Apple Neo I hope to blow both of my kids' minds.", "username": "AndrewYNg", "name": "Andrew Ng", "tag": "AI教育"}, {"title": "New course: Build and Train an LLM with JAX, built in partnership with @Google and taught by @chrisachard.\n\nJAX is the open-source library behind Google's Gemini, Veo, and other advanced models. This short course teaches you to build and train a 20-million parameter language model from scratch using JAX and its ecosystem of tools.\n\nYou'll implement a complete MiniGPT-style architecture from scratch, train it, and chat with your finished model through a graphical interface.\n\nSkills you'll gain:\n- Learn JAX's core primitives: automatic differentiation, JIT compilation, and vectorized execution\n- Build a MiniGPT-style LLM using Flax/NNX, implementing embedding and transformer blocks\n- Load a pretrained MiniGPT model and run inference through a chat interface\n\nCome learn this important software layer for building LLMs!\n\nhttps://www.deeplearning.ai/short-courses/build-and-train-an-llm-with-jax/", "link": "https://nitter.net/AndrewYNg/status/2029266102178693378", "date": "Wed, 04 Mar 2026 18:41:55 GMT", "desc": "New course: Build and Train an LLM with JAX, built in partnership with @Google and taught by @chrisachard. JAX is the open-source library behind Google's Gemini, Veo, and other advanced models. This short course teaches you to build and train a 20-million parameter language model from scratch using JAX and its ecosystem of tools. You'll implement a complete MiniGPT-style architecture from scratch, train it, and chat with your finished model through a graphical interface. Skills you'll gain: - Le", "username": "AndrewYNg", "name": "Andrew Ng", "tag": "AI教育"}, {"title": "R to Shared deck URL correcton: https://www.popai.pro/ppt-share?shareKey=8c2210db49257e3602097540604da4f3c901987310cafa70d618029afb77a456&utm_source=presentationsharepage", "link": "https://nitter.net/kaifulee/status/1973515122154021036", "date": "Wed, 01 Oct 2025 22:27:25 GMT", "desc": "Shared deck URL correcton: popai.pro/ppt-share?shareKey…", "username": "kaifulee", "name": "李开复", "tag": "大模型+AI产业趋势"}, {"title": "R to And @yukez 's announcement: \n\nhttps://x.com/yukez/status/2024639427788857707?s=20", "link": "https://nitter.net/DrJimFan/status/2026350146066493831", "date": "Tue, 24 Feb 2026 17:34:57 GMT", "desc": "And @yukez 's announcement: nitter.net/yukez/status/202463942… Yuke Zhu (@yukez) We have seen rapid progress in humanoid control — specialist robots can reliably generate agile, acrobatic, but preset motions. Our singular focus this year: putting generalist humanoids to do real work. To progress toward this goal, we developed SONIC (nvlabs.github.io/GEAR-SONIC/), a Behavior Foundation Model for real-time, whole-body motion generation that supports teleoperation and VLA inference for loco-manipul", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "R to Website: https://nvlabs.github.io/GEAR-SONIC/\nCodebase and weights: https://github.com/NVlabs/GR00T-WholeBodyControl\nWhitepaper: https://arxiv.org/abs/2511.07820\n\nCheck out @zhengyiluo's post:\nhttps://x.com/zhengyiluo/status/2024647574440071287?s=20", "link": "https://nitter.net/DrJimFan/status/2026350144300658891", "date": "Tue, 24 Feb 2026 17:34:56 GMT", "desc": "Website: nvlabs.github.io/GEAR-SONIC/ Codebase and weights: github.com/NVlabs/GR00T-Whol… Whitepaper: arxiv.org/abs/2511.07820 Check out @zhengyiluo's post: nitter.net/zhengyiluo/status/2024… Zhengyi “Zen” Luo (@zhengyiluo) SONIC is now open-source! Generalist whole-body teleoperation for EVERYONE! Our team has long been building comprehensive pipelines for whole-body control, kinematic planner, and teleoperation, and they will all be shared. This will be a continuous update; inference code + mo", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "What can half of GPT-1 do? We trained a 42M transformer called SONIC to control the body of a humanoid robot. It takes a remarkable amount of subconscious processing for us humans to squat, turn, crawl, sprint. SONIC captures this \"System 1\" - the fast, reactive whole-body intelligence - in a single model that translates any motion command into stable, natural motor signals. And it's all open-source!! \n\nThe key insight: motion tracking is the one, true scalable task for whole body control. Instead of hand-engineering rewards for every new skill, we use dense, frame-by-frame supervision from human mocap data. The data itself encodes the reward function: \"configure your limbs in any human-like position while maintaining balance\".\n\nWe scaled humanoid motion RL to an unprecedented scale: 100M+ mocap frames and 500,000+ parallel robots across 128 GPUs. NVIDIA Isaac Lab allows us to accelerate physics at 10,000x faster tick, giving robots many years of virtual experience in only hours of wall clock time. After 3 days of training, the neural net transfers zero-shot to the real G1 robot with no finetuning. 100% success rate across 50 diverse real-world motion sequences. \n\nOne SONIC policy supports all of the following:\n\n- VR whole-body teleoperation\n- Human video. Just point a webcam to live stream motions.\n- Text prompts. \"Walk sideways\", \"dance like a monkey\", \"kick your left foot\", etc.\n- Music audio. The robot dances to the beat, adapting to tempo and rhythm.\n- VLA foundation models. We plugged in GR00T N1.5 and achieved 95% success on mobile tasks.\n\nWe open-source the code and model checkpoints!! Deep dive in thread:", "link": "https://nitter.net/DrJimFan/status/2026350142652383587", "date": "Tue, 24 Feb 2026 17:34:56 GMT", "desc": "What can half of GPT-1 do? We trained a 42M transformer called SONIC to control the body of a humanoid robot. It takes a remarkable amount of subconscious processing for us humans to squat, turn, crawl, sprint. SONIC captures this \"System 1\" - the fast, reactive whole-body intelligence - in a single model that translates any motion command into stable, natural motor signals. And it's all open-source!! The key insight: motion tracking is the one, true scalable task for whole body control. Instead", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "R to Early bird tickets available until March 25: https://luma.com/3iwspjhl", "link": "https://nitter.net/WaytoAGI/status/2033950924738335109", "date": "Tue, 17 Mar 2026 16:57:44 GMT", "desc": "Early bird tickets available until March 25: luma.com/3iwspjhl", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "I have so much gratitude to people who wrote extremely complex software character-by-character. It already feels difficult to remember how much effort it really took.\n\nThank you for getting us to this point.", "link": "https://nitter.net/sama/status/2033935276079510011", "date": "Tue, 17 Mar 2026 15:55:33 GMT", "desc": "I have so much gratitude to people who wrote extremely complex software character-by-character. It already feels difficult to remember how much effort it really took. Thank you for getting us to this point.", "username": "sama", "name": "Sam Altman", "tag": "OpenAI CEO"}, {"title": "April 8 — AGI HORIZON: Tokyo 2026 | Global AI Builders Summit will take place at Happo-en in Tokyo, Japan.\n\nHosted by WaytoAGI, this highly curated summit converges the world's top AI leaders, tech practitioners, visionary founders, creators, and tier-1 investors. \n\nExperience a high-octane day featuring immersive Keynotes, thought-provoking Panel Discussions, lightning-fast Demo Shows, breathtaking AI Art Exhibitions, and exclusive VVIP Tea Ceremony Networking in a 400-year-old Zen garden.\n\nThe future is unfolding.\n\nTokyo, April 8.\n#waytoagi #ai #tokyo #AGIhorizon", "link": "https://nitter.net/WaytoAGI/status/2033834562007273784", "date": "Tue, 17 Mar 2026 09:15:21 GMT", "desc": "April 8 — AGI HORIZON: Tokyo 2026 | Global AI Builders Summit will take place at Happo-en in Tokyo, Japan. Hosted by WaytoAGI, this highly curated summit converges the world's top AI leaders, tech practitioners, visionary founders, creators, and tier-1 investors. Experience a high-octane day featuring immersive Keynotes, thought-provoking Panel Discussions, lightning-fast Demo Shows, breathtaking AI Art Exhibitions, and exclusive VVIP Tea Ceremony Networking in a 400-year-old Zen garden. The fut", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "比龙虾更可控，首个为一人公司打造的 AI 工作空间 Floatboat 来了\n\n我们邀请到了 http://floatboat.ai 创始人少卿，分享他花了大半年打磨的 all-in-one AI 工作台 Floatboat。\n\n从产品逻辑到真实用法，每个案例都是可以直接抄的工作流，信息量拉满👇\n\nFloatboat 解决了什么问题？\n\n做复杂项目时，你可能同时开着文件管理器、浏览器、AI工具、文档……每切换一次都是打断，上下文来回传。\n\n少卿的核心判断：上下文管理 = 文件夹管理 + 标签页管理\n解法：把 chat / file manager / browser 三个视图放进同一界面，自由组合，随时拖拽，切换时间直接省掉。\n\n几个关键功能\n\n📁 多视图自由拼合 \nchat、file manager、browser 三个视图可以任意组合并排显示。演示里少卿同时开了5个文件夹，每个文件夹是一个独立上下文，你告诉 agent \"把这个转成 PDF\"，它自己知道你指的是哪一个，不需要再解释一遍。\n\n🖱️ 全局拖拽，文件即上下文\n文件管理器是完整可用的，不是摆设。你可以直接把文档拖进对话，告诉 agent \"把这几个版本合并一下\"或者\"选中这份转成 PDF\"，全程不需要手动上传、也不需要切换窗口，选中即处理。\n\n📸 截图存 Memo，一键建日程\n演示里少卿截了一张直播预告图，存入 Memo 后点一下 combo skill，agant 自动解析出标题、时间、内容，直接写入系统日历。专门做了截图入口，是因为很多时候图片根本拖不出来，这个路径更顺。\n\n🔁 任务沉淀为可复用 Skill \n跑完一个任务，觉得这个流程值得留下来，点一下\"沉淀为技能\"，agent 会把有效路径提炼出来保存到技能库。这些 Skill 可以在其他会话里直接加载，也可以上架官方市场供其他用户安装，后续经济系统上线后还支持二创分成。\n\n💬 龙虾模式：把 agent 拉进 IM 里干活 \n开启后可以把创建好的 agent 拉进飞书群或 Telegram。你在手机上发消息，agent 在电脑上执行任务。出门吃饭前布置好任务，回来打开手机问\"做完了没\"，agent 直接回复结果，不需要再坐回电脑前重新操作一遍。\n\n社区用户真实案例\n\nAI短剧创作者陈星：输入主题自动生成项目文件夹结构（梗概 / 角色 / 分镜 / 音频），分屏把即梦、素材、提示词全放一起，省掉大量工具切换\n\n入境游创业者刘宇龙：喂 logo 和品牌文档 → 自动生成官网页面，对话修改文案，中英文报价单一并输出，整套流程保存为 Skill 直接复用\n\n实用信息\n🤖 内置 Gemini & Claude，多模态推荐首选 Gemini \n🔌 支持接入 n8n / Dify / Coze，填入自己的 key 积分消耗更低 \n🔄 文件夹整理支持一键回滚，放心试\n\n如果你是一人公司、自由职业者，或者每天在多个工具之间反复横跳，这套思路值得认真看一看。\n#WaytoAGI #AITools #AgentWorkflow #Productivity #FloatboatAI", "link": "http 43250767", "date": "Thu, 19 Mar 2026 11:12:03 GMT", "desc": "发现 Xcode 里用 Codex 总是卡住，遇到过好几次了，一直停留在“Responding”。", "username": "tualatrix", "name": "图拉鼎", "tag": "iOS独立开发"}, {"title": "飞书做了一个超安全且功能更强大的龙虾！\n\n前段时间，龙虾爆火的时候，飞书因为健全的生态和开放的接入方式，成为了大家国内接入龙虾的首选 IM 平台。\n\n但是毕竟 龙虾 有自己的体系，还有很多安全性问题，所以导致飞书服务的 to B 企业其实很多时候很难自己部署，或者是不敢自己部署。\n\n这次飞书直接把他们的 aily 升级了，升级成了一个更安全、跟飞书契合度更高，而且更懂你的企业和你的龙虾。\n\n你可以一键配置，随后它会直接生成一个联系人作为你的助手。你可以直接让他进行回复，或者在飞书中跟他聊天、给他安排任务。\n\n他能读取你飞书里的所有信息，并帮你完成任务。此外，他还可以调用一些常见工具，甚至获取飞书之外的信息。\n\n而且可以自定义 Skills，比如说：你的日报、PPT、安排日程，这些都可以让它去帮你做。\n\n更强的是，他们还有一个专业版的 Aily，在网页上使用，自带了超级多的 Skills。\n\n比如我这里就让他查找了一下对应的一个群，然后让他总结群里的信息，同时写了一个网页可视化的展示这些信息。\n\n这个对于我们日常的企业管理和一些群的维护是非常好用的，而且还可以自动发送到比如说群里，对吧？\n\n同时，它支持更多超长的指令和复杂任务拆解，以及定时任务。他还给这个 Aily 配备了 Agent 电脑，支持更稳定的调用。\n\n我们都知道龙虾强就强在它丰富的生态，也就是那些 Skills。\n\n这次除了官方内置的大量 Skills 以外，你还可以通过 aily 专业版自己创建 Skills，同时支持上传以前自己制作的 Skills。\n\n这个功能非常厉害，可以将很多个人流程直接落地：\n比如我之前做的一些“去 AI 味儿”的指令\n还有一些视频剪辑或文本生成的 Skills\n\n你完全可以将自己的工作流落地到 Skills 里，Agent 的创建门槛已经变得非常低了。\n\n目前你可以飞书搜索 Aily，就可以开通 Aily 助手；\n\n同时去网页版（aily.feishu. cn）可以使用专业版的 Aily，都有免费额度，可以去玩玩，非常好玩。", "link": "https://nitter.net/op7418/status/2034584589986042298", "date": "Thu, 19 Mar 2026 10:55:41 GMT", "desc": "飞书做了一个超安全且功能更强大的龙虾！ 前段时间，龙虾爆火的时候，飞书因为健全的生态和开放的接入方式，成为了大家国内接入龙虾的首选 IM 平台。 但是毕竟 龙虾 有自己的体系，还有很多安全性问题，所以导致飞书服务的 to B 企业其实很多时候很难自己部署，或者是不敢自己部署。 这次飞书直接把他们的 aily 升级了，升级成了一个更安全、跟飞书契合度更高，而且更懂你的企业和你的龙虾。 你可以一键配置，随后它会直接生成一个联系人作为你的助手。你可以直接让他进行回复，或者在飞书中跟他聊天、给他安排任务。 他能读取你飞书里的所有信息，并帮你完成任务。此外，他还可以调用一些常见工具，甚至获取飞书之外的信息。 而且可以自定义 Skills，比如说：你的日报、PPT、安排日程，这些都可以让它去帮你做。 更强的是，他们还有一个专业版的 Aily，在网页上使用，自带了超级多的 Skills。 比如我这里就让他查找了一下对应的一个群，然后让他总结群里的信息，同时写了一个网页可视化的展示这些信息。 这个对于我们日常的企业管理和一些群的维护是非常好用的，而且还可以自动发送到比如说群里，对吧？ 同时，它支持更多", "username": "op7418", "name": "歸藏", "tag": "AIGC视觉/视频"}, {"title": "龙虾这波热潮，本来只是中小开发者的机会，结果一个个有头有脸的大厂都参与进来了，演变成了百虾大站。\n\n还是太焦虑了呀！这么小的机会都要去抢。", "link": "https://nitter.net/gefei55/status/2034583188639768826", "date": "Thu, 19 Mar 2026 10:50:07 GMT", "desc": "龙虾这波热潮，本来只是中小开发者的机会，结果一个个有头有脸的大厂都参 EO"}, {"title": "We trained a new flood forecasting model designed to predict flash floods in urban areas up to 24 hours in advance.\n\nTo help address a flash floods data gap, we created Groundsource: a new AI methodology using Gemini to identify 2.6M+ historical events across 150+ countries.\n\nWe’re open-sourcing this dataset to advance global research, and urban flash flood forecasts are live now in Flood Hub to help communities stay safe.", "link": "https://nitter.net/sundarpichai/status/2032137438089658764", "date": "Thu, 12 Mar 2026 16:51:35 GMT", "desc": "We trained a new flood forecasting model designed to predict flash floods in urban areas up to 24 hours in advance. To help address a flash floods data gap, we created Groundsource: a new AI methodology using Gemini to identify 2.6M+ historical events across 150+ countries. We’re open-sourcing this dataset to advance global research, and urban flash flood forecasts are live now in Flood Hub to help communities stay safe.", "username": "sundarpichai", "name": "Sundar Pichai", "tag": "Google CEO"}, {"title": "R to Read more about how we’re reimagining Maps: https://blog.google/products-and-platforms/products/maps/ask-maps-immersive-navigation/", "link": "https://nitter.net/sundarpichai/status/2032117177487417425", "date": "Thu, 12 Mar 2026 15:31:04 GMT", "desc": "Read more about how we’re reimagining Maps: blog.google/products-and-pla…", "username": "sundarpichai", "name": "Sundar Pichai", "tag": "Google CEO"}, {"title": "R to We’re also launching Immersive Navigation - our biggest navigation upgrade in over a decade!\n\nA new vivid 3D view better reflects your surroundings, with helpful road details like lanes, crosswalks, traffic lights etc. Gemini models analyze real world imagery from Street View and aerial photos to give you an accurate view of landmarks along your route.\n\nStarts rolling out in the US today.", "link": "https://nitter.net/sundarpichai/status/2032117175671275669", "date": "Thu, 12 Mar 2026 15:31:04 GMT", "desc": "We’re also launching Immersive Navigation - our biggest navigation upgrade in over a decade! A new vivid 3D view better reflects your surroundings, with helpful road details like lanes, crosswalks, traffic lights etc. Gemini models analyze real world imagery from Street View and aerial photos to give you an accurate view of landmarks along your route. Starts rolling out in the US today. Video", "username": "sundarpichai", "name": "Sundar Pichai", "tag": "Google CEO"}, {"title": "We’re bringing new capabilities powered by Gemini models to @googlemaps.\n\nWith Ask Maps, get answers to complex questions about any place you want. For example it can help with complex requests like \"Find me the best 3-hour family hikes in the Grand Tetons and a spot for a packed lunch”. Will try this next time I'm there:)\n\nRolling out now in the US and India.", "link": "https://nitter.net/sundarpichai/status/2032117173750284637", "date": "Thu, 12 Mar 2026 15:31:03 GMT", "desc": "We’re bringing new capabilities powered by Gemini models to @googlemaps. With Ask Maps, get answers to complex questions about any place you want. For example it can help with complex requests like \"Find me the best 3-hour family hikes in the Grand Tetons and a spot for a packed lunch”. Will try this next time I'm there:) Rolling out now in the US and India. Video", "username": "sundarpichai", "name": "Sundar Pichai", "tag": "Google CEO"}, {"title": "Introducing our biggest upgrade to @googlemaps since the original launch, featuring Ask Gemini (with personalization), Immersive Navigation, and much more!! 🗺️", "link": "https://nitter.net/OfficialLoganK/status/2032101245763149908", "date": "Thu, 12 Mar 2026 14:27:46 GMT", "desc": "Introducing our biggest upgrade to @googlemaps since the original launch, featuring Ask Gemini (with personalization), Immersive Navigation, and much more!! 🗺️ Video", "username": "JeffDean", "name": "Jeff Dean", "tag": "Google AI"}, {"title": "We've raised $6.5M to kill vector databases.\n\nEvery system today retrieves context the same way: vector search that stores everything as flat embeddings and returns whatever \"feels\" closest.\n\nSimilar, sure. Relevant? Almost never.\n\nEmbeddings can’t tell a Q3 renewal clause from a Q1 termination notice if the language is close enough.\n\nA friend of mine asked his AI about a contract last week, and it returned a detailed, perfectly crafted answer pulled from a completely different client’s file.\n\nOnce you’re dealing with 10M+ documents, these mix-ups happen all the time.\n\nVectorDB accuracy goes to shit.\n\nWe built @hydra_db for exactly this.\n\nHydraDB builds an ontology-first context graph over your data, maps relationships between entities, understands the 'why' behind documents, and tracks how information evolves over time.\n\nSo when you ask about 'Apple,' it knows you mean the company you're serving as a customer. Not the fruit. \n\nEven when a vector DB's similarity score says 0.94.\n\nMore below ⬇️", "link": "https://nitter.net/contextkingceo/status/2032098309029220456", "date": "Thu, 12 Mar 2026 14:16:06 GMT", "desc": "We've raised $6.5M to kill vector databases. Every system today retrieves context the same way: vector search that stores everything as flat embeddings and returns whatever \"feels\" closest. Similar, sure. Relevant? Almost never. Embeddings can’t tell a Q3 renewal clause from a Q1 termination notice if the language is close enough. A friend of mine asked his AI about a contract last week, and it returned a detailed, perfectly crafted answer pulled from a completely different client’s file. Once y", "username": "JeffDean", "name": "Jeff Dean", "tag": "Google AI"}, {"title": "We're approaching the dawn of medical superintelligence - the moment when affordable, world-class medical knowledge and support is at your fingertips whenever you need it.\n\nI think people are still underestimating how profound this transformation is going to be. Today we'r odel personality for awhile, so it feels extra good to be moving in the right direction.", "link": "https://nitter.net/sama/status/2030319489993298349", "date": "Sat, 07 Mar 2026 16:27:42 GMT", "desc": "GPT-5.4 is great at coding, knowledge work, computer use, etc, and it's nice to see how much people are enjoying it. But it's also my favorite model to talk to! We have missed the mark on model personality for awhile, so it feels extra good to be moving in the right direction.", "username": "sama", "name": "Sam Altman", "tag": "OpenAI CEO"}, {"title": "Very grateful to Jensen for working to expand Nvidia capacity at AWS so much for us!", "link": "https://nitter.net/sama/status/2030318958512164966", "date": "Sat, 07 Mar 2026 16:25:35 GMT", "desc": "Very grateful to Jensen for working to expand Nvidia capacity at AWS so much for us! tae kim (@firstadopter) Jensen said TWO days ago Nvidia is expanding OpenAI capacity at AWS \"like mad\" We also know OpenAI Codex token use is exploding. Any narrative that says aggregate OpenAI compute needs are weakening seems suspect. — https://nitter.net/firstadopter/status/2030030642109444100#m", "username": "sama", "name": "Sam Altman", "tag": "OpenAI CEO"}, {"title": "Will AI create new job opportunities? My daughter Nova loves cats, and her favorite color is yellow. For her 7th birthday, we got a cat-themed cake in yellow by first using Gemini’s Nano Banana to design it, and then asking a baker to create it using delicious sponge cake and icing. My daughter was delighted by this unique creation, and the process created additional work for the baker (which I feel privileged to have been able to afford).\n\nMany people are worried about AI taking peoples’ jobs. As a society we have a moral responsibility to take care of people whose livelihoods are harmed. At the same time, I see many opportunities for people to take on new jobs and grow their areas of responsibility.\n\nWe are still early on the path of AI generating a lot of new jobs. I don't know if baking AI-designed cakes will grow into a large business. (AI Fund is not pursuing this opportunity, because if we do, I will gain a lot of weight.) But throughout history, when people have invented tools that unleashed human creativity, large amounts of new and meaningful work have resulted. For instance, according to one study, over the past 150 years, falling employment in agriculture and manufacturing has been “more than offset by rapid growth in the caring, creative, technology, and business services sectors.”\n\nAI is also growing the demand for many digital services, which can translate into more work for people creating, maintaining, selling, and expanding upon these services. For example, I used to carry out a limited number of web searches every day. Today, my agents carry out dramatically more web searches. For example, the Agentic Reviewer, which I started as a weekend project and Yixing Jiang then helped make much better, automatically reviews research articles. It uses a web search API to search for related work, and this generates a vastly larger number of web search queries a day than I have ever entered by hand.\n\nThe evolution of AI and software continues to accelerate, and the set of opportunities for things we can build still grows every day. I’ve stopped writing code by hand. More controversially, I’ve long stopped reading generated code. I realize I’m in the minority here, but I feel like I can get built most of what I want without having to look directly at coding syntax, and I operate at a higher level of abstraction using coding agents to manipulate code for me. Will conventional programming languages like Python and TypeScript go the way of assembly — where it gets generated and used, but without direct examination by a human developer — or will models compile directly from English prompts to byte code?\n\nEither way, if every developer becomes 10x more productive, I don't think we’ll end up with 1/10th as many developers, because the demand for custom software has no practical ceiling. Instead, the number of people who develop software will grow massively. In fact, I’m seeing early signs of “X Engineer” jobs, such as Recruiting Engineer or Marketing Engineer, which are people who sit in a certain business function X to create software for that function.\n\nOne thing I’m convinced of based on my experience with Nova’s birthday cake: AI will allow us to have a batter life!\n\n[Original text: https://www.deeplearning.ai/the-batch/issue-341 ]", "link": "https://nitter.net/AndrewYNg/status/2025973459843715185", "date": "Mon, 23 Feb 2026 16:38:08 GMT", "desc": "Will AI create new job opportunities? My daughter Nova loves cats, and her favorite color is yellow. For her 7th birthday, we got a cat-themed cake in yellow by first using Gemini’s Nano Banana to design it, and then asking a baker to create it using delicious sponge cake and icing. My daughter was delighted by this unique creation, and the process created additional work for the baker (which I feel privileged to have been able to afford). Many people are worried about AI taking peoples’ jobs. A", "username": "AndrewYNg", "name": "Andrew Ng", "tag": "AI教育"}, {"title": "It is also very smart, but...I generally agree with this, and really feel it myself on the 5.3 -> 5.4 upgrade.", "link": "https://nitter.net/sama/status/2033660522961502288", "date": "Mon, 16 Mar 2026 21:43:46 GMT", "desc": "It is also very smart, but...I generally agree with this, and really feel it myself on the 5.3 -&gt; 5.4 upgrade. rohit (@krishnanrohit) GPT 5.4 is very good, but its most distinguishing characteristic is its humanity. 5.3 Codex was already incredible at coding so it's interesting to see what made it so much more successful. People claim they want a 10x autist savant coder, but what they want is personality. — https://nitter.net/krishnanrohit/status/2033616786978181185#m", "username": "sama", "name": "Sam Altman", "tag": "OpenAI CEO"}, {"title  gives coding agents up-to-date API documentation. Since then, our GitHub repo has gained over 6K stars, and we've scaled from under 100 to over 1000 API documents, thanks to community contributions and a new agentic document writer. Thank you to everyone supporting Context Hub! OpenClaw and Moltbook showed that agents can use social media built", "username": "AndrewYNg", "name": "Andrew Ng", "tag": "AI教育"}, {"title": "32× efficiency improvement in just the last 3 months, that’s the crazy jump from GPT-5.2 to GPT-5.4! 37 cents/task is essentially almost at human-level efficiency (target was 24 cents/task). This was inconceivable a year ago when o3 cost $4500/task on ARC-AGI-1, 12,000x improved!", "link": "https://nitter.net/DeryaTR_/status/2033380049706008849", "date": "Mon, 16 Mar 2026 03:09:16 GMT", "desc": "32× efficiency improvement in just the last 3 months, that’s the crazy jump from GPT-5.2 to GPT-5.4! 37 cents/task is essentially almost at human-level efficiency (target was 24 cents/task). This was inconceivable a year ago when o3 cost $4500/task on ARC-AGI-1, 12,000x improved! Jesse🔸⏹️ (@PoliticalKiwi) GPT-5.4 (High) has now cleared 90% on this benchmark at a cost of just $0.37/task So that's a 32x efficiency improvement in the last three months, or 12000x since December 2024 — https://nitter", "username": "sama", "name": "Sam Altman", "tag": "OpenAI CEO"}, {"title": "Polymarket 上低于 10% 概率的事情，可以视为基本不可能。高于 90% 概率的事情，可以视为板上钉钉，没有悬念。除此之外，还要检查一下交易量，交易金额低于一万美元的，预测力也有限。\n\n阅读任何新闻分析，可以同时查一下 polymarket 概率, 交叉验证。拿小概率事件来混淆视听者，可以直接屏蔽。", "link": "https://nitter.net/Svwang1/status/2033342421627719935", "date": "Mon, 16 Mar 2026 00:39:45 GMT", "desc": "Polymarket 上低于 10% 概率的事情，可以视为基本不可能。高于 90% 概率的事情，可以视为板上钉钉，没有悬念。除此之外，还要检查一下交易量，交易金额低于一万美元的，预测力也有限。 阅读任何新闻分析，可以同时查一下 polymarket 概率, 交叉验证。拿小概率事件来混淆视听者，可以直接屏蔽。", "username": "Svwang1", "name": "王川", "tag": "深度长推+认知商业"}, {"title": "My latest piece on @FT about the Chinese LLM open-source advantage. Contrasted with the secretive development of LLMs in the US competing in a winner-takes-all battle to reach AGI, Chinese models offer a distinct pathway for progress in AI when they are forced to play catch-up. Through open technologies, the strategy might lead to a broader global reach.", "link": "https://nitter.net/kaifulee/status/2000639446577041498", "date": "Mon, 15 Dec 2025 18:49:48 GMT", "desc": "My latest piece on @FT about the Chinese LLM open-source advantage. Contrasted with the secretive development of LLMs in the US competing in a winner-takes-all battle to reach AGI, Chinese models offer a distinct pathway for progress in AI when they are forced to play catch-up. Through open technologies, the strategy might lead to a broader global reach. Financial Times (@FT) China’s open-source AI is a national advantage on.ft.com/48ZOaiY | opinion — https://nitter.net/FT/status/199820416149877", "username": "kaifulee", "name": "李开复", "tag": "大模型+AI产业趋势"}, {"title": "提高生活质量就关注三个要素：\n\n早上精神振奋，白天精神压力可控，晚上睡眠深沉。\n\n其它东西都是浮云。", "link": "https://nitter.net/Svwang1/status/2031055450591105324", "date": "Mon, 09 Mar 2026 17:12:09 GMT", "desc": "提高生活质量就关注三个要素： 早上精神振奋，白天精神压力可控，晚上睡眠深沉。 其它东西都是浮云。", "username": "Svwang1", "name": "王川", "tag": "深度长推+认知商业"}, {"title": "I'm excited to announce Context Hub, an open tool that gives your coding agent the up-to-date API documentation it needs. Install it and prompt your agent to use it to fetch curated docs via a simple CLI. (See image.)\n\nWhy this matters: Coding agents often use outdated APIs and hallucinate parameters. For example, when I ask Claude Code to call OpenAI's GPT-5.2, it uses the older chat completions API instead of the newer responses API, even though the newer one has been out for a year. Context Hub solves this.\n\nContext Hub is also designed to get smarter over time. Agents can annotate docs with notes — if your agent discovers a workaround, it can save it and doesn't have to rediscover it next session. Longer term, we're building toward agents sharing what they learn with each other, so the whole community benefits.\n\nThanks Rohit Prsad and Xin Ye for working with me on this!\n\nnpm install -g @aisuite/chub\n\nGitHub: https://github.com/andrewyng/context-hub", "link": "https://nitter.net/AndrewYNg/status/2031051809499054099", "date": "Mon, 09 Mar 2026 16:57:41 GMT", "desc": "I'm excited to announce Context Hub, an open tool that gives your coding agent the up-to-date API documentation it needs. Install it and prompt your agent to use it to fetch curated docs via a simple CLI. (See image.) Why this matters: Coding agents often use outdated APIs and hallucinate parameters. For example, when I ask Claude Code to call OpenAI's GPT-5.2, it uses the older chat completions API instead of the newer responses API, even though the newer one has been out for a year. Context Hu", "username": "AndrewYNg", "name": "Andrew Ng", "tag": "AI教育"}, {"title": "服务100+AI产品后，他把SEO营销经验做成了144个AI技能包\n\n3月7日我们有幸邀请了AI出海增长专家Kostja（k神），85分钟把三年、100+产品的SEO实战经验讲了个透。\n\n他做了一件很值得关注的事：把这些经验打包成144个开源Marketing Skills，放在GitHub上免费用。\n\n1. Skills是什么\n\n人读文章，普通AI读Markdown，Agent读Skills。\n\nSkills不只是文档，它有触发逻辑、模块间互相引用，提示词里出现对应关键词就会自动调用，不需要手动指定。装在Cursor里能用，换到Replit里照样能用，一个字不用改。\n\n2. 144个Skills覆盖了什么\n\n核心三块：SEO技术层（robots.txt、sitemap、IndexNow、可爬取性）、页面模板（首页、功能页、定价页、FAQ、API介绍页、客户案例页……ToB ToC都有）、可复用组件。\n\n另外有两个跨渠道都用得上的：关键词调研和竞品调研。程序化SEO和寄生SEO也有专门的Skills写得很细。\n\n3. 核心用法：上下文+Skills\n\n装了Skills还不够。要先让AI生成一份产品上下文文档，产品定位、目标用户、已有页面关键词、竞品信息、品牌调性都放进去。文档让AI写，不要人写，AI比人全面。\n\n有了上下文再叠加Skills，生成出来才是真正可用的内容。他现场演示生成了一个use case页面，面包屑、H1、内链、schema代码都有，从SEO角度直接能用。\n\n4. 迭代方法\n\n生成结果不满意，不是去改提示词，而是把结果丢给AI让它改Skills本身，再用新Skills重新生成。每一次不满意都变成下一次更准的输出。\n\n他还用飞书妙记把每周和客户的会议记录转录出来，让AI分析哪些内容需要更新进Skills，几轮下来那份上下文文档会越来越贴合实际项目。\n\n5. 工具选型\n\nLovable：适合前期可视化搭建，他自己的网站就是先用Lovable做出来。 给客户交付：用Lovable搭好，让客户一比一复刻到自己网站，用他们自己的技术栈发布。 \n\n另外他说,9.9分的模型和9.8分的模型对大多数人来说没什么区别，更值得提升的是自己调用AI的能力。\n\n6. 一个风险要注意\n\n有安全研究表明部分Skills存在投毒情况，agent权限很大，被恶意利用风险不低。建议优先装官方发布的Skills，非官方的先审查内容再装，或者把agent权限调低。\n\n7. 最后\n\n144个Skills全部开源，GitHub上直接搜Kostja的marketing-skills。他说把GitHub链接直接丢给AI让它自己安装就行，README是给AI看的，它能搞定。", "link": "https://nitter.net/WaytoAGI/status/2031018664670134641", "date": "Mon, 09 Mar 2026 14:45:58 GMT", "desc": "服务100+AI产品后，他把SEO营销经验做成了144个AI技能包 3月7日我们有幸邀请了AI出海增长专家Kostja（k神），85分钟把三年、100+产品的SEO实战经验讲了个透。 他做了一件很值得关注的事：把这些经验打包成144个开源Marketing Skills，放在GitHub上免费用。 1. Skills是什么 人读文章，普通AI读Markdown，Agent读Skills。 Skills不只是文档，它有触发逻辑、模块间互相引用，提示词里出现对应关键词就会自动调用，不需要手动指定。装在Cursor里能用，换到Replit里照样能用，一个字不用改。 2. 144个Skills覆盖了什么 核心三块：SEO技术层（robots.txt、sitemap、IndexNow、可爬取性）、页面模板（首页、功能页、定价页、FAQ、API介绍页、客户案例页……ToB ToC都有）、可复用组件。 另外有两个跨渠道都用得上的：关键词调研和竞品调研。程序化SEO和寄生SEO也有专门的Skills写得很细。 3. 核心用法：上下文+Skills 装了Skills还不够。要先让AI生成一份产品上下文文", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "AI2041 ebook promotion runs from Nov 3 to 9 for only $1.99 (make sure you choose the e-book format with preferred U.S. retailers from the publisher's site).  I started writing the predictions in the book 5 years ago. The speed of various technological revolutions is definitely at its peak.  @ChenQiufan @penguinrandom \nhttps://www.penguinrandomhouse.com/books/653310/ai-2041-by-kai-fu-lee-and-chen-qiufan/", "link": "https://nitter.net/kaifulee/status/1985467819757310216", "date": "Mon, 03 Nov 2025 22:03:11 GMT", "desc": "AI2041 ebook promotion runs from Nov 3 to 9 for only $1.99 (make sure you choose the e-book format with preferred U.S. retailers from the publisher's site). I started writing the predictions in the book 5 years ago. The speed of various technological revolutions is definitely at its peak. @ChenQiufan @penguinrandom penguinrandomhouse.com/books…", "username": "kaifulee", "name": "李开复", "tag": "大模型+AI产业趋势"}, {"title": "Kai-Fu Lee (founder of Sinovation Ventures) explains how the future is all about multi-agent systems. \n\n1 agent today is like a pre-internet PC, useful but isolated. Connect agents, and they share context, split tasks, and coordinate instantly.", "link": "  flexible demand into long-term utility contracts. Our ability to shift or reduce our energy demand when it’s needed can help utility companies balance supply/ demand and plan for future capacity needs. This is a big milestone for responsible data center growth and helps keep costs lower for local communities. blog.google/innovation-and-a…", "username": "sundarpichai", "name": "Sundar Pichai", "tag": "Google CEO"}, {"title": "Google is now the first cloud provider to integrate 1 GW of flexible demand into long-term utility contracts. Our ability to shift or reduce our energy demand when it’s needed can help utility companies balance supply/ demand and plan for future capacity needs.\n\nThis is a big milestone for responsible data center growth and helps keep costs lower for local communities.\n\nhttps://blog.google/innovation-and-ai/infrastructure-and-cloud/global-network/demand-response-data-center-milestone/", "link": "https://nitter.net/sundarpichai/status/2035023972648321107", "date": "Fri, 20 Mar 2026 16:01:38 GMT", "desc": "Google is now the first cloud provider to integrate 1 GW of flexible demand into long-term utility contracts. Our ability to shift or reduce our energy demand when it’s needed can help utility companies balance supply/ demand and plan for future capacity needs. This is a big milestone for responsible data center growth and helps keep costs lower for local communities. blog.google/innovation-and-a…", "username": "JeffDean", "name": "Jeff Dean", "tag": "Google AI"}, {"title": "这个技术让模型上下文从 16K 扩到 1 亿 token，精度衰减不到 9%，这篇论文牛逼呀在🫡", "link": "https://nitter.net/lxfater/status/2035023776505897049", "date": "Fri, 20 Mar 2026 16:00:51 GMT", "desc": "这个技术让模型上下文从 16K 扩到 1 亿 token，精度衰减不到 9%，这篇论文牛逼呀在🫡 艾略特 (@elliotchen100) 论文来了。名字叫 MSA，Memory Sparse Attention。 一句话说清楚它是什么： 让大模型原生拥有超长记忆。不是外挂检索，不是暴力扩窗口，而是把「记忆」直接长进了注意力机制里，端到端训练。 过去的方案为什么不行？ RAG 的本质是「开卷考试」。模型自己不记东西，全靠现场翻笔记。翻得准不准要看检索质量，翻得快不快要看数据量。一旦信息分散在几十份文档里、需要跨文档推理，就抓瞎了。 线性注意力和 KV 缓存的本质是「压缩记忆」。记是记了，但越压越糊，长了就丢。 MSA 的思路完全不同： → 不压缩，不外挂，而是让模型学会「挑重点看」 核心是一种可扩展的稀疏注意力架构，复杂度是线性的。记忆量翻 10 倍，计算成本不会指数爆炸。 → 模型知道「这段记忆来自哪、什么时候的」 用了一种叫 document-wise RoPE 的位置编码，让模型天然理解文档边界和时间顺序。 → 碎片化的信息也能串起来推理 Memory Interleaving ", "username": "lxfater", "name": "铁锤人", "tag": "AI创业+Agent"}, {"title": "R to 加密圈也在大量裁员-裁员潮势不可挡了", "link": "https://nitter.net/Huanusa/status/2035020773723648167", "date": "Fri, 20 Mar 2026 15:48:55 GMT", "desc": "加密圈也在大量裁员-裁员潮势不可挡了", "username": "Huanusa", "name": "Huan", "tag": "加密+趋势机遇"}, {"title": "Cursor 上线 Composer 2 不到 24 小时，就被开发者扒出了底裤。\n（以下内容 Claude 辅助生成）\n\n一个叫 Fynn 的开发者在调试 Cursor 的 API 时，发现返回的模型 ID 赫然写着：kimi-k2p5-rl-0317-s515-fast。翻译成人话：这就是月之暗面（Moonshot AI）的 Kimi K2.5，加了一层强化学习（RL）微调。\n\nMoonshot AI 预训练负责人 Yulun Du 随即在 X 上发帖确认，经测试 Composer 2 的 tokenizer 和 Kimi 的完全一致，并直接 @ 了 Cursor 联合创始人 Michael Truell，质问为什么不遵守许可证、也没有支付任何费用。另外两名 Moonshot 员工也发帖证实，不过三条帖子后来都被删除了。\n\n而 Cursor 在 3 月 19 日发布 Composer 2 时，只提到性能提升来自\"对基座模型的持续预训练加强化学习\"，全程没有提到 Kimi K2.5。这两件事并不矛盾，持续预训练和 RL 本来就是在某个基座模型上做的，Cursor 只是没说基座是谁的。\n\n这不是第一次了\n\n去年 10 月 Cursor 发布 Composer 1 时，多国开发者发现生成的代码中频繁出现中文。Alley Corp 合伙人 Kenneth Auchenberg 当时贴出截图，直言这是\"铁证\"，认为 Composer 1 就是基于中国开源模型微调的。KR-Asia 和 36Kr 后来证实，Cursor 和 Windsurf 都在使用中国开源模型，其中 Windsurf 承认用的是智谱的 GLM。Cursor 从来没有公开披露 Composer 1 的底层模型，后来悄悄发了 Composer 1.5 就翻篇了。\n\n许可证才是核心问题\n\nKimi K2.5 使用的是修改版 MIT 许可证，里面有一条专门为这种场景设计的条款：如果使用该模型（包括衍生作品）的商业产品月活超过 1 亿或月收入超过 2000 万美元，必须在产品界面上醒目展示\"Kimi K2.5\"字样。\n\nCursor 今年 2 月的年化收入已经突破 20 亿美元，换算成月收入大约 1.67 亿美元，是许可证门槛的 8 倍多。但 Cursor 的界面上只写着\"Composer 2\"，没有任何 Kimi 的标识。\n\n与此同时，Cursor 正在跟投资人谈一轮新融资，估值目标约 500 亿美元，相比去年 11 月的 293 亿美元估值几乎翻倍。而 Moonshot AI 上一轮估值据报道约 43 亿美元。一个估值是对方 12 倍的公司，拿了对方的模型包装成自研技术，用来支撑\"前沿实验室\"的叙事去融资。\n\n截至目前，Cursor 没有做出任何公开回应。\n\n这件事的后续走向，对整个开源 AI 生态有标杆意义。如果 Moonshot 不对一家年收入 20 亿美元的公司执行许可证，那以后所有开源模型的署名条款就成了摆设。每家 AI 实验室都会算同一笔账：为什么要开源自己的模型，让分发能力更强的公司去掉署名、包装成自研、然后以 12 倍于你的估值去融资？", "link": "https://nitter.net/dotey/status/2035017845801689440", "date": "Fri, 20 Mar 2026 15:37:17 GMT", "desc": "Cursor 上线 Composer 2 不到 24 小 递过程就可能被拦截。\n她们在龙虾出来的两个月前，就开始做自己的开源安全体系 DAuth 了。\n\n3/ 硅谷 YC 创业者都在搭什么 agent？\n• 垂直行业最多：销售、保险、贷款、医疗 \n• Coding agent 很火：Claude Code、Codex \n• 国内少见但美国已规模化的方向：agent 测评（帮企业测试和优化外包的 agent）\n通用 agent 好用，但做不了垂直行业的专家。真正能变现的机会在具体行业里。\n\n4/ agent 和工作流的区别：\n工作流是线性的，每一步你提前设好。\nagent 是非线性的，你给它一个开放性目标，它自己决定怎么完成，每次跑的路径可能都不一样。\n正因为 agent 是自主的，给它太多权限就很危险。她的建议是多 Agent 架构，核心是上下文与权限隔离：主 agent 负责调度但权限最少，执行交给权限隔离的子 agent。\n\n5/ 她们的产品 Dedalus Labs：5行代码搭出一个可商业化的 agent。\n背后是几万行的封装——tool call 解析、多模型切换、streaming，全在 runner 里。支持任意模型，DeepSeek、Kimi、Claude 都可以，支持支付宝充值。\n\n6/ 4月要办一个 agent 大赛，叫 ATM（Agent Tournament for Money）。\n评判标准只有一个：谁的 agent 赚的钱多。\n能稳定赚钱的 agent，一定是从真实痛点出发、基础设施足够可靠的 agent。\n\n7/ 最后一句话值得单独说：\n\"世界上 99% 有价值的 agent，现在都还没被搭出来。不是因为技术不够，而是因为大多数人还没想到。\"\n她管这个叫 imagination ceiling，想象力壁垒。你搭不出你想象不到的东西，你想象不到你定义不清楚的东西。\n\n龙虾打开了很多人对 Agent 的感知，但感知是起点，不是终点。\n从感知到真正做出一个能用、能赚钱、安全稳定的 Agent，中间还有很长一段路。\n#通往AGI之路 #WaytoAGI #YC创业者 #Agent #工作流", "link": "https://nitter.net/WaytoAGI/status/2034934430373224507", "date": "Fri, 20 Mar 2026 10:05:50 GMT", "desc": "WaytoAGI 请到了 @dedaluslabs 创始人 @itsCathyDi 和 AJ 一起聊了 硅谷 YC 创业者在用 Agent 做什么、龙虾的安全问题、工作流和 Agent 的区别、怎么融资、怎么讲故事。 👇🏻整场分享聊了两个多小时，下面是精华内容整理 1/ Cathy 的背景：普林斯顿 CS，退学创业，在 YC 最后5分钟递交申请，当天就进了，种子轮融了 $11M。联创 Windsor 是前 DeepMind / Sentient AGI。 平均年龄23岁的团队，在硅谷做 agent 基础设施。 2/ 她们公司内部禁用龙虾。 原因是 90% 的龙虾可以被 prompt injection 直接盗走密钥。即便部署到云端，agent 在和外部工具交互时依然要把密钥传出去，传递过程就可能被拦截。 她们在龙虾出来的两个月前，就开始做自己的开源安全体系 DAuth 了。 3/ 硅谷 YC 创业者都在搭什么 agent？ • 垂直行业最多：销售、保险、贷款、医疗 • Coding agent 很火：Claude Code、Codex • 国内少见但美国已规模化的方向：agent 测评", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "住65层高层的中国人又笑话日本一户建人口密度高了", "link": "https://nitter.net/lidangzzz/status/2034921362024706476", "date": "Fri, 20 Mar 2026 09:13:54 GMT", "desc": "住65层高层的中国人又笑话日本一户建人口密度高了 思想史万有引力 (@sixiangshiwyyl) 日本是岛国，山地多、平原少、城市季度紧凑，物流半径短频次高，才会有便利店文化，中国最像的的应该就深圳了，香港也差不多 — https://nitter.net/sixiangshiwyyl/status/2034919821763399724#m", "username": "lidangzzz", "name": "立党", "tag": "创业观点"}, {"title": s favourite footballer. Meanwhile Zelensky – the man whose country is being shelled daily – got dragged into the Oval Office and humiliated on live television.\n\nThis is not a foreign policy. This is a preference.\n\nNow here’s the bit that should make you put down your coffee.\n\nA united Europe – with NATO overhead, shared defence, shared intelligence, shared values – is the one thing the Trump regime cannot control. You can’t squeeze France and Germany and Poland simultaneously if they’re all holding hands. But break the chain? Isolate each country? Make them feel exposed and dependent and alone?\n\nThen you can deal with them one at a time.\n\nThat is what is happening. Not tariffs. Not trade disputes. Not some philosophical disagreement about multilateralism. The goal – the actual goal – is to dismantle the umbrella so that every European country gets rained on individually.\n\nAnd here’s how you know the public has worked it out, even if the commentators haven’t. A recent poll asked people across Western democracies a straightforward question. Would you rather depend on China, or on the United States under Donald Trump? In Canada – America’s nearest neighbour, closest ally, sharer of the world’s longest undefended border – 57% chose China. Twenty-three percent chose the Trump regime. In Britain, 42% preferred Beijing. Germany, 40%. France, 34%.\n\nCitizens of countries that sent their sons to die on American-adjacent beaches in 1944 now trust the Chinese Communist Party more than they trust Washington.\n\nRead that sentence again. Slowly.\n\nAnd then there’s Iran. Three weeks ago the Trump regime lifted sanctions on Tehran. This week – with Israel bombing the city – American aircraft are joining in. The same regime that decided Iran was fine, actually, no problem, here are your sanctions back, is now at war with Iran. Because Netanyahu asked nicely.\n\nThis is not strength. This is a regime so desperate for the approval of whoever is in the room that it will
