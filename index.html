<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>信息差名单 · 每日监控</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-hover: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #4a9aef;
      --tag-bg: #1f2937;
      --time-bg: #1c2128;
      --success: #3fb950;
      --error: #f85149;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    
    header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    
    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    .stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    
    .stat span {
      color: var(--accent);
      font-weight: 600;
    }
    
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    
    .toolbar-left {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      flex: 1;
    }
    
    .toolbar-right {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .add-form {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      background: var(--bg-card);
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    
    .add-form input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.3rem;
      width: 150px;
      outline: none;
    }
    
    .add-form input::placeholder {
      color: var(--text-muted);
    }
    
    .add-form button {
      padding: 0.4rem 0.8rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }
    
    .add-form button:hover {
      background: var(--accent-hover);
    }
    
    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: opacity 0.2s;
    }
    
    .refresh-btn:hover {
      opacity: 0.85;
    }
    
    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .sort-btn {
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    
    .sort-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    
    .sort-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    
    .filter-btn {
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    
    .filter-btn.custom {
      background: var(--bg-hover);
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .filter-btn .remove {
      margin-left: 0.3rem;
      opacity: 0.6;
      font-size: 0.7rem;
    }
    
    .filter-btn .remove:hover {
      opacity: 1;
    }
    
    .tweet-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .tweet {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      transition: border-color 0.2s;
    }
    
    .tweet:hover {
      border-color: var(--text-muted);
    }
    
    .tweet-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1rem;
      color: #fff;
      flex-shrink: 0;
    }
    
    .user-info {
      flex: 1;
      min-width: 0;
    }
    
    .user-name {
      font-weight: 600;
      font-size: 0.95rem;
    }
    
    .user-handle {
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    
    .tag {
      background: var(--tag-bg);
      color: var(--text-muted);
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    
    .tweet-content {
      margin-left: 48px;
    }
    
    .tweet-text {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 0.5rem;
      word-break: break-word;
    }
    
    .tweet-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    
    .tweet-time {
      background: var(--time-bg);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    
    .tweet-link {
      color: var(--accent);
      text-decoration: none;
    }
    
    .tweet-link:hover {
      text-decoration: underline;
    }
    
    .empty {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 2rem;
      color: var(--text-muted);
    }
    
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    
    .note {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    
    .note strong {
      color: var(--accent);
    }
    
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.75rem 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .toast.show {
      opacity: 1;
    }
    
    .toast.success {
      border-color: var(--success);
      color: var(--success);
    }
    
    .toast.error {
      border-color: var(--error);
      color: var(--error);
    }
    
    @media (max-width: 600px) {
      .stats { flex-direction: column; gap: 0.5rem; }
      .tweet-content { margin-left: 0; }
      .toolbar { flex-direction: column; }
      .toolbar-left, .toolbar-right { width: 100%; justify-content: center; }
      .add-form { width: 100%; }
      .add-form input { width: 100%; }
    }
  </style>

 \n把人格设定单独抽成 soul.md，agent 启动时自动读取。社区里可以互相分享 soul.md，\"传播灵魂\"说的就是这个。\n\n2/ 现场发生了什么\n\n分享进行20分钟，他开播前交给 agent 的翻译任务已经悄悄完成，英语和日语版本静静出现在 GitHub 仓库里，他自己都没注意。\n\nOpenClaw 一周新增约5000个 commit，相当于一个工程师连续干一年的量。\"这个项目99%是非人类在更新。\"\n\n最炸的环节：让小龙虾给网友打 FaceTime，电话真的拨通了，对方直接被拉进来即兴连线。\n\n分享快结束时让龙虾\"退出飞书\"，现场就这么被它亲手搞掉了。\n\n3/ 几个判断\n\n本地部署远比云端有价值。云端能干的事和 Manus 没区别，本地能读你所有文件、清理磁盘、帮你找东西。\n\n权限越大，风险越大，有人让它\"继续干所有能干的事\"，差点把给甲方的数据也删了。\n\n复杂任务尽量用 Claude，差距非常明显。有 Claude Code 订阅的可以把 agent core 替换成 Claude Code CLI，复用订阅不走 API，成本更低。\n\n整理自 WaytoAGI 分享，嘉宾：来新璐\n#通往AGI之路 #WaytoAGI #Openclaw #小龙虾 #开发者 #AI开源社区 #shareAI", "link": "https://nitter.net/WaytoAGI/status/2031649232814485733", "date": "Wed, 11 Mar 2026 08:31:37 GMT", "desc": "🦞OpenClaw技术架构拆解，带你手搓一个最小的龙虾 我们邀请到了Share AI 的来新璐拆解了OpenClaw 技术架构，结论极其简单： 小龙虾 = Claude Code + 定时器 + 自己没事给自己找事干 就这两个机制，让它从被动工具变成了主动运转的个人 AI 助手。 1/ 三个核心机制 🕐 定时任务 支持一次性、周期性、标准 Cron 三种模式。用户可以设，agent 自己也可以主动给自己加任务。 💓 心跳 每30秒系统自动发一条消息，让 agent 看看有没有事可以做。有事就干，没事不打扰你。这是它和 Claude Code 的本质区别：Claude Code 踹一下动一下，小龙虾每30秒自己醒一次。 🧠 Soul 把人格设定单独抽成 soul.md，agent 启动时自动读取。社区里可以互相分享 soul.md，\"传播灵魂\"说的就是这个。 2/ 现场发生了什么 分享进行20分钟，他开播前交给 agent 的翻译任务已经悄悄完成，英语和日语版本静静出现在 GitHub 仓库里，他自己都没注意。 OpenClaw 一周新增约5000个 commit，相当于一个工程师连续干", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "APP 设计里的游戏感和游戏化\n\n#迷你设计课\n\n好久没黑多邻国和 Anki 了，今天继续\n\nCapWords 学外语、背单词的方式，特别像玩“宝可梦”游戏搜集宝贝，它利用了每个人都有的好奇心，以及搜集好东西的本能\n\n每天都能拍到意想不到的照片、学到意想不到的单词，别说是小朋友喜欢玩这个“学单词”的游戏，成年人也能很愉快地积累单词量\n\n这种采集和收获过程，最终能激发你的内啡肽，让你产生发自内心的成就感和愉悦感，让你还想一直玩下去\n\n现在越来越多的产品设计也像 CapWords 这样，引入了游戏的手感和游戏的体验，这种设计方法一般叫做 游戏感 / Game-like design，最典型的例子还有 not boring 出的有趣天气预报 app\n\n---\n\n相反，多邻国背单词的方式，性质和小时候父母说“英语考95分以上，就奖励你100块！”很相似，当时很刺激，但现在你既不记得当时考试里的单词、也不记得 100 块拿来买什么好东西了\n\n多邻国刺激的是多巴胺，当时的确也很爽，但多邻国带来的这一点点刺激，很快就不足以抵消重复背单词的无聊和痛苦\n\n多邻国这种设计方法，就是 游戏化 / Gamification，它创造一个奖励系统来骗你干苦力活\n\n---\n\n现在的用户越来越聪明，普通的“游戏化”越来越难打动用户。这时候就体现出了“游戏感”的好处，谁不喜欢玩啊？！\n\n至于 Anki，它只适合特定的人", "link": "https://nitter.net/nishuang/status/1909820720076501261", "date": "Wed, 0  "为什么苹果要搞“没必要”的创新\n\n不管是难用的 iOS 18 相册，还是十年用不上一次的卫星通信，或者 iPhone 17 Pro “前后摄像头同时拍摄”的传闻功能…这些“没必要”创新背后都有充分理由\n\n其中一个原因是“感知淘汰”（Perceived Obsolescence）\n\n即苹果不断投入新硬件、新功能、新体验…让用户觉得手上的 iPhone 已经过时，很想买一部新的\n\n现在大家明白为什么苹果没事想改 iOS 19 的图标了\n\n顺便说一下，苹果们还有一招叫做“计划报废”（Planned Obsolescence），意思是故意把产品寿命设计得比较短，让它们尽快被淘汰", "link": "https://nitter.net/nishuang/status/1909760671556026763", "date": "Wed, 09 Apr 2025 00:10:00 GMT", "desc": "为什么苹果要搞“没必要”的创新 不管是难用的 iOS 18 相册，还是十年用不上一次的卫星通信，或者 iPhone 17 Pro “前后摄像头同时拍摄”的传闻功能…这些“没必要”创新背后都有充分理由 其中一个原因是“感知淘汰”（Perceived Obsolescence） 即苹果不断投入新硬件、新功能、新体验…让用户觉得手上的 iPhone 已经过时，很想买一部新的 现在大家明白为什么苹果没事想改 iOS 19 的图标了 顺便说一下，苹果们还有一招叫做“计划报废”（Planned Obsolescence），意思是故意把产品寿命设计得比较短，让它们尽快被淘汰", "username": "nishuang", "name": "倪爽", "tag": "产品工作流+趋势判断"}, {"title": "太体贴了，gemini", "link": "https://nitter.net/virushuo/status/2033995201799176327", "date": "Tue, 17 Mar 2026 19:53:40 GMT", "desc": "太体贴了，gemini", "username": "virushuo", "name": "霍炬", "tag": "技术创业老兵"}, {"title": "R to Early bird tickets available until March 25: https://luma.com/3iwspjhl", "link": "https://nitter.net/WaytoAGI/status/2033950924738335109", "date": "Tue, 17 Mar 2026 16:57:44 GMT", "desc": "Early bird tickets available until March 25: luma.com/3iwspjhl", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "April 8 — AGI HORIZON: Tokyo 2026 | Global AI Builders Summit will take place at Happo-en in Tokyo, Japan.\n\nHosted by WaytoAGI, this highly curated summit converges the world's top AI leaders, tech practitioners, visionary founders, creators, and tier-1 investors. \n\nExperience a high-octane day featuring immersive Keynotes, thought-provoking Panel Discussions, lightning-fast Demo Shows, breathtaking AI Art Exhibitions, and exclusive VVIP Tea Ceremony Networking in a 400-year-old Zen garden.\n\nThe future is unfolding.\n\nTokyo, April 8.\n#waytoagi #ai #tokyo #AGIhorizon", "link": "https://nitter.net/WaytoAGI/status/2033834562007273784", "date": "Tue, 17 Mar 2026 09:15:21 GMT", "desc": "April 8 — AGI HORIZON: Tokyo 2026 | Global AI Builders Summit will take place at Happo-en in Tokyo, Japan. Hosted by WaytoAGI, this highly curated summit converges the world's top AI leaders, tech practitioners, visionary founders, creators, and tier-1 investors. Experience a high-octane day featuring immersive Keynotes, thought-provoking Panel Discussions, lightning-fast Demo Shows, breathtaking AI Art Exhibitions, and exclusive VVIP Tea Ceremony Networking in a 400-year-old Zen garden. The fut", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "比龙虾更可控，首个为一人公司打造的 AI 工作空间 Floatboat 来了\n\n我们邀请到了 http://floatboat.ai 创始人少卿，分享他花了大半年打磨的 all-in-one AI 工作台 Floatboat。\n\n从产品逻辑到真实用法，每个案例都是可以直接抄的工作流，信息量拉满👇\n\nFloatboat 解决了什么问题？\n\n做复杂项目时，你可能同时开着文件管理器、浏览器、AI工具、文档……每切换一次都是打断，上下文来回传。\n\n少卿的核心判断：上下文管理 = 文件夹管理 + 标签页管理\n解法：把 chat / file manager / browser 三个视图放进同一界面，自由组合，随时拖拽，切换时间直接省掉。\n\n几个关键功能\n\n📁 多视图自由拼合 \nchat、file manager、browser 三个视图可以任意组合并排显示。演示里少卿同时开了5个文件夹，每个文件夹是一个独立上下文，你告诉 agent \"把这个转成 PDF\"，它自己知道你指的是哪一个，不需要再解释一遍。\n\n🖱️ 全局拖拽，文件即上下文\n文件管理器是完整可用的，不是摆设。你可以直接把文档拖进对话，告诉 agent \"把这几个版本合并一下\"或者\"选中这份转成 PDF\"，全程不需要手动上传、也不需要切换窗口，选中即处理。\n\n📸 截图存 Memo，一键建日程\n演示里少卿截了一张直播预告图，存入 Memo 后点一下 combo skill，agant 自动解析出标题、时间、内容，直接写入系统日历。专门做了截图入口，是因为很多时候图片根本拖不出来，这个路径更顺。\n\n🔁 任务沉淀为可复用 Skill \n跑完一个任务，觉得这个流程值得留下来，点一下\"沉淀为技能\"，agent 会把有效路径提炼出来保存到技能库。这些 Skill 可以在其他会话里直接加载，也可以上架官方市场供其他用户安装，后续经济系统上线后还支持二创分成。\n\n💬 龙虾模式：把 agent 拉进 IM 里干活 \n开启后可以把创建好的 agent 拉进飞书群或 Telegram。你在手机上发消息，agent 在电脑上执行任务。出门吃饭前布置好任务，回来打开手机问\"做完了没\"，agent 直接回复结果，不需要再坐回电脑前重新操作一遍。\n\n社区用户真实案例\n\nAI短剧创作者陈星：输入主题自动生成项目文件夹结构（梗概 / 角色 / 分镜 / 音频），分屏把即梦、素材、提示词全放一起，省掉大量工具切换\n\n入境游创业者刘宇龙：喂 logo 和品牌文档 → 自动生成官网页面，对话修改文案，中英文报价单一并输出，整套流程保存为 Skill 直接复用\n\n实用信息\n🤖 内置 Gemini & Claude，多模态推荐首选 Gemini \n🔌 支持接入 n8n / Dify / Coze，填入自己的 key 积分消耗更低 \n🔄 文件夹整理支持一键回滚，放心试\n\n如果你是一人公司、自由职业者，或者每天在多个工具之间反复横跳，这套思路值得认真看一看。\n#WaytoAGI #AITools #AgentWorkflow #Productivity #FloatboatAI", "link": "https://nitter.net/WaytoAGI/ 以下为推文翻译\n---\n\nMiMo-V2-Pro、Omni 和 TTS 发布了。这是我们第一个真正为 Agent 时代打造的全栈模型家族。\n\n我把这次发布称为一场无声的奇袭，不是因为我们刻意谋划，而是因为从 Chat 到 Agent 的范式转换来得太快，快到连我们自己都不敢相信。那个过程让人兴奋、痛苦，又着迷。\n\n1T 参数的基座模型几个月前就开始训练了。最初的目标是长上下文推理效率。混合注意力（Hybrid Attention）机制有真正的创新，但没有用力过猛，而事实证明，它恰好是 Agent 时代最合适的基础架构。百万级上下文窗口。MTP 推理（Multi-Token Prediction）实现超低延迟和成本。这些架构决策在当时并不时髦，但它们是我们在需要之前就建好的结构性优势。\n\n真正改变一切的，是第一次亲身体验一个复杂的智能体脚手架，我称之为\"编排式上下文\"（orchestrated Context）。第一天我就被震撼到了。我试图说服团队去用它，但没用。\n\n于是我下了一道硬指令：MiMo 团队里，明天跟 Agent 系统的对话不到 100 轮的人，可以走人。这招管用了。一旦团队的想象力被智能体系统的能力点燃，这种想象力就直接转化为了研究速度。\n\n人们总问我们为什么能跑这么快。我在做 DeepSeek R1 的时候亲眼见证过。我的真实总结：\n\n— 基座与基础设施研究周期很长。你需要在它产出回报的一年前就有战略定力。\n\n— 后训练的敏捷性是另一种能力：靠产品直觉驱动评估，压缩迭代周期，及早捕捉范式转换。\n\n— 还有那些不变的东西：好奇心、敏锐的技术直觉、果断的执行力、全力以赴，以及一样很容易被低估的东西：对你正在为之构建的世界，发自内心的热爱。\n\n我们会开源的——等模型稳定到值得开源的时候。\n\n发自北京，很晚了，还没完全清醒。\n\n---\n\n译注：\n- orchestrated Context：作者自创概念，指复杂 Agent 系统中经过编排的上下文管理方式\n- MTP：Multi-Token Prediction，一种可同时预测多个 token 的推理方式，能降低延迟和成本", "link": "https://nitter.net/dotey/status/2034676907359576501", "date": "Thu, 19 Mar 2026 17:02:31 GMT", "desc": "以下为推文翻译 --- MiMo-V2-Pro、Omni 和 TTS 发布了。这是我们第一个真正为 Agent 时代打造的全栈模型家族。 我把这次发布称为一场无声的奇袭，不是因为我们刻意谋划，而是因为从 Chat 到 Agent 的范式转换来得太快，快到连我们自己都不敢相信。那个过程让人兴奋、痛苦，又着迷。 1T 参数的基座模型几个月前就开始训练了。最初的目标是长上下文推理效率。混合注意力（Hybrid Attention）机制有真正的创新，但没有用力过猛，而事实证明，它恰好是 Agent 时代最合适的基础架构。百万级上下文窗口。MTP 推理（Multi-Token Prediction）实现超低延迟和成本。这些架构决策在当时并不时髦，但它们是我们在需要之前就建好的结构性优势。 真正改变一切的，是第一次亲身体验一个复杂的智能体脚手架，我称之为\"编排式上下文\"（orchestrated Context）。第一天我就被震撼到了。我试图说服团队去用它，但没用。 于是我下了一道硬指令：MiMo 团队里，明天跟 Agent 系统的对话不到 100 轮的人，可以走人。这招管用了。一旦团队的想象力被", "username": "dotey", "name": "宝玉", "tag": "Prompt+AI实战工具"}, {"title": "传说中的DeepSeek天才少女、雷军千万年薪挖角的罗福莉也开始发推了。\n\n帖子里最生动的段落是关于她第一次使用复杂 Agent 脚手架的经历。她用的词是：orchestrated Context，编排过的上下文，我理解就是现在比较火的 Harness Engineering。\n\n她说第一天就被震惊了，然后试图说服团队去用，没成功，于是下了一个硬性命令：\n> MiMo 团队里，明天对话数不到 100 条的人，可以辞职了。\n\n这个管理风格相当激进，但有效。一旦团队的想象力被 Agent 系统的能力点燃，这种想象力就直接转化成了研发速度。\n\n一方面确实霸气，一方面也让我有点意外，原以为大模型团队应该是更积极拥抱这种从传统 Chat 模型到 Agent 模型范式变化的。\n\n其他都是“干货”\n\n1. 提前押注的架构优势 each. Financial Times (@FT) China’s open-source AI is a national advantage on.ft.com/48ZOaiY | opinion — https://nitter.net/FT/status/199820416149877", "username": "kaifulee", "name": "李开复", "tag": "大模型+AI产业趋势"}, {"title": "提高生活质量就关注三个要素：\n\n早上精神振奋，白天精神压力可控，晚上睡眠深沉。\n\n其它东西都是浮云。", "link": "https://nitter.net/Svwang1/status/2031055450591105324", "date": "Mon, 09 Mar 2026 17:12:09 GMT", "desc": "提高生活质量就关注三个要素： 早上精神振奋，白天精神压力可控，晚上睡眠深沉。 其它东西都是浮云。", "username": "Svwang1", "name": "王川", "tag": "深度长推+认知商业"}, {"title": "服务100+AI产品后，他把SEO营销经验做成了144个AI技能包\n\n3月7日我们有幸邀请了AI出海增长专家Kostja（k神），85分钟把三年、100+产品的SEO实战经验讲了个透。\n\n他做了一件很值得关注的事：把这些经验打包成144个开源Marketing Skills，放在GitHub上免费用。\n\n1. Skills是什么\n\n人读文章，普通AI读Markdown，Agent读Skills。\n\nSkills不只是文档，它有触发逻辑、模块间互相引用，提示词里出现对应关键词就会自动调用，不需要手动指定。装在Cursor里能用，换到Replit里照样能用，一个字不用改。\n\n2. 144个Skills覆盖了什么\n\n核心三块：SEO技术层（robots.txt、sitemap、IndexNow、可爬取性）、页面模板（首页、功能页、定价页、FAQ、API介绍页、客户案例页……ToB ToC都有）、可复用组件。\n\n另外有两个跨渠道都用得上的：关键词调研和竞品调研。程序化SEO和寄生SEO也有专门的Skills写得很细。\n\n3. 核心用法：上下文+Skills\n\n装了Skills还不够。要先让AI生成一份产品上下文文档，产品定位、目标用户、已有页面关键词、竞品信息、品牌调性都放进去。文档让AI写，不要人写，AI比人全面。\n\n有了上下文再叠加Skills，生成出来才是真正可用的内容。他现场演示生成了一个use case页面，面包屑、H1、内链、schema代码都有，从SEO角度直接能用。\n\n4. 迭代方法\n\n生成结果不满意，不是去改提示词，而是把结果丢给AI让它改Skills本身，再用新Skills重新生成。每一次不满意都变成下一次更准的输出。\n\n他还用飞书妙记把每周和客户的会议记录转录出来，让AI分析哪些内容需要更新进Skills，几轮下来那份上下文文档会越来越贴合实际项目。\n\n5. 工具选型\n\nLovable：适合前期可视化搭建，他自己的网站就是先用Lovable做出来。 给客户交付：用Lovable搭好，让客户一比一复刻到自己网站，用他们自己的技术栈发布。 \n\n另外他说,9.9分的模型和9.8分的模型对大多数人来说没什么区别，更值得提升的是自己调用AI的能力。\n\n6. 一个风险要注意\n\n有安全研究表明部分Skills存在投毒情况，agent权限很大，被恶意利用风险不低。建议优先装官方发布的Skills，非官方的先审查内容再装，或者把agent权限调低。\n\n7. 最后\n\n144个Skills全部开源，GitHub上直接搜Kostja的marketing-skills。他说把GitHub链接直接丢给AI让它自己安装就行，README是给AI看的，它能搞定。", "link": "https://nitter.net/WaytoAGI/status/2031018664670134641", "date": "Mon, 09 Mar 2026 14:45:58 GMT", "desc": "服务100+AI产品后，他把SEO营销经验做成了144个AI技能包 3月7日我们有幸邀请了AI出海增长专家Kostja（k神），85分钟把三年、100+产品的SEO实战经验讲了个透。 他做了一件很值得关注的事：把这些经验打包成144个开源Marketing Skills，放在GitHub上免费用。 1. Skills是什么 人读文章，普通AI读Markdown 、本地知识库，买哪个笔记本比较好呢？ 有点想上 M5 MAX 了 — https://nitter.net/Jackywine/status/2034870952333574338#m", "username": "lxfater", "name": "铁锤人", "tag": "AI创业+Agent"}, {"title": "WaytoAGI 请到了 @dedaluslabs 创始人 @itsCathyDi 和 AJ 一起聊了 硅谷 YC 创业者在用 Agent 做什么、龙虾的安全问题、工作流和 Agent 的区别、怎么融资、怎么讲故事。\n\n👇🏻整场分享聊了两个多小时，下面是精华内容整理\n\n1/ Cathy 的背景：普林斯顿 CS，退学创业，在 YC 最后5分钟递交申请，当天就进了，种子轮融了 $11M。联创 Windsor 是前 DeepMind / Sentient AGI。\n平均年龄23岁的团队，在硅谷做 agent 基础设施。\n\n2/ 她们公司内部禁用龙虾。\n原因是 90% 的龙虾可以被 prompt injection 直接盗走密钥。即便部署到云端，agent 在和外部工具交互时依然要把密钥传出去，传递过程就可能被拦截。\n她们在龙虾出来的两个月前，就开始做自己的开源安全体系 DAuth 了。\n\n3/ 硅谷 YC 创业者都在搭什么 agent？\n• 垂直行业最多：销售、保险、贷款、医疗 \n• Coding agent 很火：Claude Code、Codex \n• 国内少见但美国已规模化的方向：agent 测评（帮企业测试和优化外包的 agent）\n通用 agent 好用，但做不了垂直行业的专家。真正能变现的机会在具体行业里。\n\n4/ agent 和工作流的区别：\n工作流是线性的，每一步你提前设好。\nagent 是非线性的，你给它一个开放性目标，它自己决定怎么完成，每次跑的路径可能都不一样。\n正因为 agent 是自主的，给它太多权限就很危险。她的建议是多 Agent 架构，核心是上下文与权限隔离：主 agent 负责调度但权限最少，执行交给权限隔离的子 agent。\n\n5/ 她们的产品 Dedalus Labs：5行代码搭出一个可商业化的 agent。\n背后是几万行的封装——tool call 解析、多模型切换、streaming，全在 runner 里。支持任意模型，DeepSeek、Kimi、Claude 都可以，支持支付宝充值。\n\n6/ 4月要办一个 agent 大赛，叫 ATM（Agent Tournament for Money）。\n评判标准只有一个：谁的 agent 赚的钱多。\n能稳定赚钱的 agent，一定是从真实痛点出发、基础设施足够可靠的 agent。\n\n7/ 最后一句话值得单独说：\n\"世界上 99% 有价值的 agent，现在都还没被搭出来。不是因为技术不够，而是因为大多数人还没想到。\"\n她管这个叫 imagination ceiling，想象力壁垒。你搭不出你想象不到的东西，你想象不到你定义不清楚的东西。\n\n龙虾打开了很多人对 Agent 的感知，但感知是起点，不是终点。\n从感知到真正做出一个能用、能赚钱、安全稳定的 Agent，中间还有很长一段路。\n#通往AGI之路 #WaytoAGI #YC创业者 #Agent #工作流", "link": "https://nitter.net/WaytoAGI/status/2034934430373224507", "date": "Fri, 20 Mar 2026 10:05:50 GMT", "desc": "WaytoAGI 请到了 @dedaluslabs 创始人 @itsCathyDi 和 AJ 一起聊了 硅谷 YC 创业者在用 Agent 做什么、龙虾的安全问题、工作流和 Agent 的区别、怎么融资、怎么讲故事。 👇🏻整场分享聊了两个多小时，下面是精华内容整理 1/ Cathy 的背景：普林斯顿 CS，退学创业，在 YC 最后5分钟递交申请，当天就进了，种子轮融了 $11M。联创 Windsor 是前 DeepMind / Sentient AGI。 平均年龄23岁的团队，在硅谷做 agent 基础设施。 2/ 她们公司内部禁用龙虾。 原因是 90% 的龙虾可以被 prompt injection 直接盗走密钥。即便部署到云端，agent 在和外部工具交互时依然要把密钥传出去，传递过程就可能被拦截。 她们在龙虾出来的两个月前，就开始做自己的开源安全体系 DAuth 了。 3/ 硅谷 YC 创业者都在搭什么 agent？ • 垂直行业最多：销售、保险、贷款、医疗 连接 Obsidian 文件夹，适合管理文件结构。\n\n卡尔每天用它做：整理下载文件夹、批量优化稿件、拆分重组 Markdown、设置定时任务。\n\n分工逻辑：轻量任务先给 CodeX，解决不了交 Claude Code，再解决不了才上 OpenClaw。\n\n6️⃣进阶：用 OpenClaw 让知识库主动运转\n\nOpenClaw 支持心跳机制和 Cron，可以让 Agent 按计划自动扫描知识库、整理新增内容、发送日报，不需要手动触发。\n\n接入方式推荐飞书或 Discord。飞书可以配置多个 OpenClaw 应用共享同一套记忆体系；Discord 有频道隔离，可以在后台同时跑多个任务。\n\n在 OpenClaw 的 agents 配置文件里写清楚哪些内容归到哪个目录，新信息进来就自动分类，不需要二次整理。\n\n7️⃣防止 AI 误操作的两个措施\n\n软链接 — 只开放 Obsidian 特定文件夹的权限，Agent 无法访问其他文件\n\nGit 版本备份 — Code X 在执行命令前后自动存版本，随时可以回退\n\n卡尔的邪修做法：把本地除 Download 文件夹外的所有内容都同步到了 iCloud 2T\n\n8️⃣一个实用细节：上下文健康检测\n\n和 Claude 对话到五六十轮后，它的\"遗忘\"会明显加速，之前设定的偏好和技能会悄悄丢失。\n\n检测方法：设一个确认指令，能回复关键词说明上下文还在，不行就开新对话。\n\n真正难的不是安装 Obsidian，是想清楚你要管理什么，然后让 AI 读懂你的文件夹逻辑。\n\n#通往AGI之路 #WaytoAGI #OpenClaw #obisidan #claudecode #CodeX #AI知识管理 #知识体系", "link": "https://nitter.net/WaytoAGI/status/2032397724935692651", "date": "Fri, 13 Mar 2026 10:05:52 GMT", "desc": "10分钟用Obsidian + OpenClaw重构AI知识管理体系👇 我们有幸邀请到了AI自媒体博主@aiwarts 来WaytoAGI分享！他刚完成自己知识体系的完整重构，来分享整套方法。 1️⃣为什么选 Obsidian Obsidian 的底层是本地 Markdown 文件，AI Agent 直接读写，不需要 API、不需要授权。 Notion、飞书的数据在云端，AI 每次操作都要走 API，慢、贵、有限制，Obsidian 没有这些问题。 2️⃣第一步：统一信息入口 卡尔每天处理五六千条信息，分散在各处。他用三个插件解决入库问题： 飞书文档下载插件 — 批量转成 Markdown 导入 Obsidian Web Clipper — 抓网页，自动保留来源和 tag 微信笔记同步助手 — 微信内容直接同步进来 3️⃣视频和社交平台内容另有方案 X Reader 和 Agent Reach 可以覆盖小红书、公众号、B站、YouTube、抖音、GitHub，连评论区都能抓。 没看过的视频先存链接，确认值得看再用 AI 生成摘要收录，避免无效处理。 4️⃣第二步：搭 AI 能读懂的文件", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "两周前，一个 Cloudflare 工程师用 AI 重新实现了 Next.js，Token 费用是1100美元。\n\n我觉得，这件事情对Next.js的打击非常大。\n\n代码的护城河不存在了，只要投入一小笔金钱，AI 就能复刻出大型软件。\n\n防止复刻的关键是测试用例，我写了一点看法《测试是新的护城河》。https://www.ruanyifeng.com/blog/2026/03/weekly-issue-388.html", "link": "https://nitter.net/ruanyf/status/2032258957369360859", "date": "Fri, 13 Mar 2026 00:54:27 GMT", "desc": "两周前，一个 Cloudflare 工程师用 AI 重新实现了 Next.js，Token 费用是1100美元。 我觉得，这件事情对Next.js的打击非常大。 代码的护城河不存在了，只要投入一小笔金钱，AI 就能复刻出大型软件。 防止复刻的关键是测试用例，我写了一点看法《测试是新的护城河》。ruanyifeng.com/blog/2026/03/…", "username": "ruanyf", "name": <script>
    let allTweets = [];
    let currentFilter = 'all';
    let currentSort = 'newest';
    let customUsers = [];
    
    // Default order
    const ORDER = ['kaifulee','dotey','nishuang','ruanyf','Huanusa','op7418','WaytoAGI','turingou','virushuo','Svwang1','tualatrix','gefei55','lidangzzz','lijigang','lxfater'];
    
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `toast show ${type}`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const now = new Date();
      const diff = now - d;
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      
      if (hours < 1) return '刚刚';
      if (hours < 24) return `${hours}小时前`;
      if (days < 7) return `${days}天前`;
      return d.toLocaleDateString('zh-CN', {month: 'short', day: 'numeric'});
    }
    
    function parseDate(dateStr) {
      if (!dateStr) return new Date(0);
      return new Date(dateStr);
    }
    
    function applySortAndFilter() {
      let tweets = [...allTweets];
      
      if (currentFilter !== 'all') {
        tweets = tweets.filter(t => t.username === currentFilter);
      }
      
      tweets.sort((a, b) => {
        const dateA = parseDate(a.date);
        const dateB = parseDate(b.date);
        return currentSort === 'newest' ? dateB - dateA : dateA - dateB;
      });
      
      renderTweets(tweets);
    }
    
    function renderTweets(tweets) {
      const container = document.getElementById('tweets');
      
      if (tweets.length === 0) {
        container.innerHTML = '<div class="empty">暂无推文</div>';
        return;
      }
      
      container.innerHTML = tweets.map(t => `
        <article class="tweet">
          <div class="tweet-header">
            <div class="avatar">${t.name ? t.name[0] : t.username[0]}</div>
            <div class="user-info">
              <div class="user-name">${t.name || t.username}</div>
              <div class="user-handle">@${t.username}</div>
            </div>
            <span class="tag">${t.tag || '自定义'}</span>
          </div>
          <div class="tweet-content">
            <p class="tweet-text">${escapeHtml(t.desc || t.title)}</p>
            <div class="tweet-meta">
              <span class="tweet-time">${formatDate(t.date)}</span>
              <a href="${t.link}" target="_blank" class="tweet-link">查看原文 →</a>
            </div>
          </div>
        </article>
      `).join('');
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function setupFilters() {
      const container = document.getElementById('filters');
      
      // Remove existing buttons except "all"
      container.querySelectorAll('.filter-btn:not([data-filter="all"])').forEach(b => b.remove());
      
      // Get all unique users
      const usersMap = {};
      allTweets.forEach(t => {
        if (!usersMap[t.username]) {
          usersMap[t.username] = t;
        }
      });
      
      const users = Object.keys(usersMap);
      
      // Sort: default order first, then custom
      users.sort((a, b) => {
        const aDefault = ORDER.includes(a);
        const bDefault = ORDER.includes(b);
        if (aDefault && !bDefault) return -1;
        if (!aDefault && bDefault) return 1;
        const aIdx = ORDER.indexOf(a);
        const bIdx = ORDER.indexOf(b);
        if (aIdx >= 0 && bIdx >= 0) return aIdx - bIdx;
        return 0;
      });
      
      users.forEach(username => {
        const tweet = usersMap[username];
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (customUsers.includes(username) ? ' custom' : '');
        btn.dataset.filter = username;
        btn.textContent = tweet.name || username;
        
        if (customUsers.includes(username)) {
          btn.innerHTML = `${tweet.name || username}<span class="remove" data-remove="${username}">×</span>`;
        }
        
        btn.onclick = (e) => {
          if (e.target.dataset.remove) {
            e.stopPropagation();
            removeCustomUser(e.target.dataset.remove);
            return;
          }
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = username;
          applySortAndFilter();
        };
        
        container.appendChild(btn);
      });
    }
    
    function removeCustomUser(username) {
      customUsers = customUsers.filter(u => u !== username);
      localStorage.setItem('customUsers', JSON.stringify(customUsers));
      allTweets = allTweets.filter(t => t.username !== username);
      document.getElementById('tweet-count').textContent = allTweets.length;
      setupFilters();
      applySortAndFilter();
      showToast(`已移除 @${username}`);
    }
    
    async function addCustomUser(username) {
      username = username.trim().toLowerCase().replace('@', '');
      if (!username) return;
      
      if (allTweets.some(t => t.username === username)) {
        showToast(`@${username} 已在列表中`, 'error');
        return;
      }
      
      showToast(`正在抓取 @${username}...`);
      
      try {
        const res = await fetch(`https://nitter.net/${username}/rss`);
        const text = await res.text();
        
        // Simple RSS parse
        const items = text.match(/<item>([\s\S]*?)<\/item>/g) || [];
        
        if (items.length === 0) {
          showToast(`未找到 @${username} 的推文`, 'error');
          return;
        }
        
        const newTweets = items.slice(0, 10).map(item => {
          const getContent = (tag) => {
            const match = item.match(new RegExp(`<${tag}>([\\s\\S]*?)<\\/${tag}>`));
            return match ? match[1].replace(/<[^>]+>/g, '').trim() : '';
          };
          const title = getContent('title');
          const link = getContent('link');
          const date = getContent('pubDate');
          const desc = getContent('description');
          
          return {
            title,
            link: link.replace('#m', ''),
            date,
            desc: desc.substring(0, 500),
            username,
            name: username,
            tag: '自定义'
          };
        });
        
        if (newTweets.length > 0) {
          allTweets = [...newTweets, ...allTweets];
          customUsers.push(username);
          localStorage.setItem('customUsers', JSON.stringify(customUsers));
          
          document.getElementById('tweet-count').textContent = allTweets.length;
          setupFilters();
          applySortAndFilter();
          showToast(`已添加 @${username}，${newTweets.length} 条推文`);
        }
      } catch (e) {
        console.error(e);
        showToast(`抓取失败: ${username}`, 'error');
      }
    }
    
    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'flex' : 'none';
    }
    
    async function loadData() {
      showLoading(true);
      
      try {
        let data = window.__FEED_DATA__;
        
        if (!data) {
          const res = await fetch('./data/feed.json');
          data = await res.json();
        }
        
        allTweets = data.tweets || [];
        
        // Load custom users
        try {
          customUsers = JSON.parse(localStorage.getItem('customUsers') || '[]');
        } catch (e) {
          customUsers = [];
        }
        
        document.getElementById('tweet-count').textContent = allTweets.length;
        document.getElementById('update-time').textContent = new Date(data.updated).toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
        
        setupFilters();
        applySortAndFilter();
      } catch (e) {
        console.error('Failed to load data:', e);
        document.getElementById('tweets').innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
      } finally {
        showLoading(false);
      }
    }
    
    function setupSortButtons() {
      document.querySelectorAll('.sort-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentSort = btn.dataset.sort;
          applySortAndFilter();
        };
      });
    }
    
    function setupRefresh() {
      document.getElementById('refresh-btn').onclick = () => {
        const btn = document.getElementById('refresh-btn');
        btn.disabled = true;
        btn.innerHTML = '<span>🔄</span> 刷新中...';
        
        try {
          applySortAndFilter();
        } finally {
          setTimeout(() => {
            btn.disabled = false;
            btn.innerHTML = '<span>🔄</span> 刷新';
          }, 500);
        }
      };
    }
    
    function setupAddForm() {
      const input = document.getElementById('add-input');
      const btn = document.getElementById('add-btn');
      
      const doAdd = () => {
        const username = input.value.trim();
        if (username) {
          addCustomUser(username);
          input.value = '';
        }
      };
      
      btn.onclick = doAdd;
      input.onkeydown = (e) => {
        if (e.key === 'Enter') doAdd();
      };
    }
    
    // Filter "all" button
    document.querySelector('[data-filter="all"]').onclick = () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-filter="all"]').classList.add('active');
      currentFilter = 'all';
      applySortAndFilter();
    };
    
    setupSortButtons();
    setupRefresh();
    setupAddForm();
    loadData();
  </script>
</body>
</html>
