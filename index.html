", "date": "Fri, 20 Mar 2026 01:48:45 GMT", "desc": "我看到有人提问：“如果未来的代码都是 AI 写的，那么我们怎么招聘程序员呢？” 仔细想想，这个问题比预想的难多了。 考察一个人的代码能力不重要（代码不是他写的），更重要的是考察他会不会 AI。 但是，什么样的面试问题，能够考察出一个人是否掌握 AI？ruanyifeng.com/blog/2026/03/…", "username": "ruanyf", "name": "阮一峰", "tag": "科技知识长文"}, {"title": "Grok is the most important tool and resource I have on my iPhone.", "link": "https://nitter.net/teslaownersSV/status/2034806989545775495", "date": "Fri, 20 Mar 2026 01:39:25 GMT", "desc": "Grok is the most important tool and resource I have on my iPhone.", "username": "elonmusk", "name": "Elon Musk", "tag": "科技+商业+加密"}, {"title": "Image", "link": "https://nitter.net/Rothmus/status/2034798271932010953", "date": "Fri, 20 Mar 2026 01:04:47 GMT", "desc": "", "username": "elonmusk", "name": "Elon Musk", "tag": "科技+商业+加密"}, {"title": "A new paper from @ylecun and others – V-JEPA 2.1\n\nIt changes the recipe of V-JEPA so the model learns both:\n\n• Global semantics – what is happening in the scene\n• Dense spatio-temporal structure – where things are and how they move\n\nThe idea is to supervise not just masked tokens but the visible ones too\n\nThere are 4 key ingredients for V-JEPA 2.1:\n\n- Dense prediction loss on both masked and visible tokens\n- Deep self-supervision across intermediate layers\n- Modality-specific tokenizers (2D for images, 3D for videos) within a shared encoder\n- Model + data scaling\n\nThe workflow turns into: masked image/video → encode visible tokens → predict latent representations for both masked and visible tokens → supervise at multiple layers\n\nHere are the details:", "link": "https://nitter.net/TheTuringPost/status/2034795966931640533", "date": "Fri, 20 Mar 2026 00:55:37 GMT", "desc": "A new paper from @ylecun and others – V-JEPA 2.1 It changes the recipe of V-JEPA so the model learns both: • Global semantics – what is happening in the scene • Dense spatio-temporal structure – where things are and how they move The idea is to supervise not just masked tokens but the visible ones too There are 4 key ingredients for V-JEPA 2.1: - Dense prediction loss on both masked and visible tokens - Deep self-supervision across intermediate layers - Modality-specific tokenizers (2D for image", "username": "ylecun", "name": "Yann LeCun", "tag": "Meta AI"}, {"title": "R to Check out @ShenyuanGao's technical deep dive:\n\nhttps://x.com/ShenyuanGao/status/2024898256334114876?s=20", "link": "https://nitter.net/DrJimFan/status/2024899289080910046", "date": "Fri, 20 Feb 2026 17:29:45 GMT", "desc": "Check out @ShenyuanGao's technical deep dive: nitter.net/ShenyuanGao/status/202… Shenyuan Gao (@ShenyuanGao) 🤖 How can we enable zero-shot generalization to unseen scenarios for robot world models? Thrilled to share DreamDojo 🌎 — an interactive robot world model pretrained on 44K hours of human egocentric videos, the largest and most diverse dataset to date for robot world model learning. Our model not only excels in generalization, but also supports real-time interaction at 10 FPS after distill", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "R to - Project website: https://dreamdojo-world.github.io/\n- Paper: https://arxiv.org/abs/2602.06949\n- Code repo and model ckpts: https://github.com/NVIDIA/DreamDojo\n\nThis is a huge team work at NVIDIA. All credits go to the wonderful teams who poured their hearts into it!", "link": "https://nitter.net/DrJimFan/status/2024895360922255776", "date": "Fri, 20 Feb 2026 17:14:09 GMT", "desc": "- Project website: dreamdojo-world.github.io/ - Paper: arxiv.org/abs/2602.06949 - Code repo and model ckpts: github.com/NVIDIA/DreamDojo This is a huge team work at NVIDIA. All credits go to the wonderful teams who poured their hearts into it!", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "Announcing DreamDojo: our open-source, interactive world model that takes robot motor controls and generates the future in pixels. No engine, no meshes, no hand-authored dynamics. It's Simulation 2.0. Time for robotics to take the bitter lesson pill.\n\nReal-world robot learning is bottlenecked by time, wear, safety, and resets. If we want Physical AI to move at pretraining speed, we need a simulator that adapts to pretraining scale with as little human engineering as possible.\n\nOur key insights: (1) human egocentric videos are a scalable source of first-person physics; (2) latent actions make them \"robot-readable\" across different hardware; (3) real-time inference unlocks live teleop, policy eval, and test-time planning *inside* a dream.\n\nWe pre-train on 44K hours of human videos: cheap, abundant, and collected with zero robot-in-the-loop. Humans have already explored the combinatorics: we grasp, pour, fold, assemble, fail, retry—across cluttered scenes, shifting viewpoints, changing light, and hour-long task chains—at a scale no robot fleet could match. The missing piece: these videos have no action labels. So we introduce latent actions: a unified representation inferred directly from videos that captures \"what changed between world states\" without knowing the underlying hardware. This lets us train on any first-person video as if it came with motor commands attached.\n\nAs a result, DreamDojo generalizes zero-shot to objects and environments never seen in any robot training set, because humans saw them first.\n\nNext, we post-train onto each robot to fit its specific hardware. Think of it as separating \"how the world looks and behaves\" from \"how this particular robot actuates.\" The base model follows the general physical rules, then \"snaps onto\" the robot's unique mechanics. It's kind of like loading a new character and scene assets into Unreal Engine, but done through gradient descent and generalizes far beyond the post-training dataset.\n\nA world simulator is only useful if it runs fast enough to close the loop. We train a real-time version of DreamDojo that runs at 10 FPS, stable for over a minute of continuous rollout. This unlocks exciting possibilities:\n\n- Live teleoperation *inside* a dream. Connect a VR controller, stream actions into DreamDojo, and teleop a virtual robot in real time. We demo this on Unitree G1 with a PICO headset and one RTX 5090.\n- Policy evaluation. You can benchmark a policy checkpoint in DreamDojo instead of the real world. The simulated success rates strongly correlate with real-world results - accurate enough to rank checkpoints without burning a single motor.\n- Model-based planning. Sample multiple action proposals → simulate them all in parallel → pick the best future. Gains +17% real-world success out of the box on a fruit packing task. \n\nWe open-source everything!! Weights, code, post-training dataset, eval set, and whitepaper with tons of details to reproduce. DreamDojo is based on NVIDIA Cosmos, which is open-weight too. \n\n2026 is the year of World Models for physical AI. We want you to build with us. Happy scaling! \n\nLinks in thread:", "link": "https://nitter.net/DrJimFan/status/2024895359236051274", "date": "Fri, 20 Feb 2026 17:14:09 GMT", "desc": "Announcing DreamDojo: our open-source, interactive world model that takes robot motor controls and generates the future in pixels. No engine, no meshes, no hand-authored dynamics. It's Simulation 2.0. Time for robotics to take the bitter lesson pill. Real-world robot learning is bottlenecked by time, wear, safety, and resets. If we want Physical AI to move at pretraining speed, we need a simulator that adapts to pretraining scale with as little human engineering as possible. Our key insights: (1", "username": "DrJimFan", "name": "Jim Fan", "tag": "NVIDIA AI"}, {"title": "We’re the first cloud to bring up an NVIDIA Vera Rubin NVL72 system for validation, another big step in building the next generation of AI infrastructure with NVIDIA.", "link": "https://nitter.net/satyanadella/status/2032515189086761005", "date": "Fri, 13 Mar 2026 17:52:38 GMT", "desc": "We’re the first cloud to bring up an NVIDIA Vera Rubin NVL72 system for validation, another big step in building the next generation of AI infrastructure with NVIDIA.", "username": "satyanadella", "name": "Satya Nadella", "tag": "Microsoft CEO"}, {"title": "We open sourced WAXAL!\n\n- Multilingual speech dataset for African languages\n- 17 languages for TTS\n- 19 languages for ASR\n\nOver 100 million speakers across 40 Sub-Saharan African countries\n\nhttps://huggingface.co/datasets/google/WaxalNLP", "link": "https://nitter.net/osanseviero/status/2032452729059045881", "date": "Fri, 13 Mar 2026 13:44:26 GMT", "desc": "We open sourced WAXAL! - Multilingual speech dataset for African languages - 17 languages for TTS - 19 languages for ASR Over 100 million speakers across 40 Sub-Saharan African countries huggingface.co/datasets/goog…", "username": "JeffDean", "name": "Jeff Dean", "tag": "Google AI"}, {"title": "10分钟用Obsidian + OpenClaw重构AI知识管理体系👇\n\n我们有幸邀请到了AI自媒体博主@aiwarts 来WaytoAGI分享！他刚完成自己知识体系的完整重构，来分享整套方法。\n\n1️⃣为什么选 Obsidian\n\nObsidian 的底层是本地 Markdown 文件，AI Agent 直接读写，不需要 API、不需要授权。\n\nNotion、飞书的数据在云端，AI 每次操作都要走 API，慢、贵、有限制，Obsidian 没有这些问题。\n\n2️⃣第一步：统一信息入口\n\n卡尔每天处理五六千条信息，分散在各处。他用三个插件解决入库问题：\n\n飞书文档下载插件 — 批量转成 Markdown 导入 \nObsidian Web Clipper — 抓网页，自动保留来源和 tag \n微信笔记同步助手 — 微信内容直接同步进来\n\n3️⃣视频和社交平台内容另有方案\n\nX Reader 和 Agent Reach 可以覆盖小红书、公众号、B站、YouTube、抖音、GitHub，连评论区都能抓。\n\n没看过的视频先存链接，确认值得看再用 AI 生成摘要收录，避免无效处理。\n\n4️⃣第二步：搭 AI 能读懂的文件结构\n\n常见误区：把文件夹做得\"对人友好\"，但 AI 不在乎好不好看，只要路径清晰就够。\n\n推荐起点：GitHub 上有中文版 Obsidian 初始结构项目，包含收件箱、日记、项目研究、知识库、资源管理。卡尔在此基础上加了\"工作流存储\"目录，放提示词模板和各平台发布 SOP。\n\n看到更好的结构不需要重构，把链接发给 AI，让它把缺少的部分追加进去就行。\n\n5️⃣第三步：用 CodeX 自动维护文件\n\nCodeX 默认绑定目录，直接连接 Obsidian 文件夹，适合管理文件结构。\n\n卡尔每天用它做：整理下载文件夹、批量优化稿件、拆分重组 Markdown、设置定时任务。\n\n分工逻辑：轻量任务先给 CodeX，解决不了交 Claude Code，再解决不了才上 OpenClaw。\n\n6️⃣进阶：用 OpenClaw 让知识库主动运转\n\nOpenClaw 支持心跳机制和 Cron，可以让 Agent 按计划自动扫描知识库、整理新增内容、发送日报，不需要手动触发。\n\n接入方式推荐飞书或 Discord。飞书可以配置多个 OpenClaw 应用共享同一套记忆体系；Discord 有频道隔离，可以在后台同时跑多个任务。\n\n在 OpenClaw 的 agents 配置文件里写清楚哪些内容归到哪个目录，新信息进来就自动分类，不需要二次整理。\n\n7️⃣防止 AI 误操作的两个措施\n\n软链接 — 只开放 Obsidian 特定文件夹的权限，Agent 无法访问其他文件\n\nGit 版本备份 — Code X 在执行命令前后自动存版本，随时可以回退\n\n卡尔的邪修做法：把本地除 Download 文件夹外的所有内容都同步到了 iCloud 2T\n\n8️⃣一个实用细节：上下文健康检测\n\n和 Claude 对话到五六十轮后，它的\"遗忘\"会明显加速，之前设定的偏好和技能会悄悄丢失。\n\n检测方法：设一个确认指令，能回复关键词说明上下文还在，不行就开新对话。\n\n真正难的不是安装 Obsidian，是想清楚你要管理什么，然后让 AI 读懂你的文件夹逻辑。\n\n#通往AGI之路 #WaytoAGI #OpenClaw #obisidan #claudecode #CodeX #AI知识管理 #知识体系", "link": "https://nitter.net/WaytoAGI/status/2032397724935692651", "date": "Fri, 13 Mar 2026 10:05:52 GMT", "desc": "10分钟用Obsidian + OpenClaw重构AI知识管理体系👇 我们有幸邀请到了AI自媒体博主@aiwarts 来WaytoAGI分享！他刚完成自己知识体系的完整重构，来分享整套方法。 1️⃣为什么选 Obsidian Obsidian 的底层是本地 Markdown 文件，AI Agent 直接读写，不需要 API、不需要授权。 Notion、飞书的数据在云端，AI 每次操作都要走 API，慢、贵、有限制，Obsidian 没有这些问题。 2️⃣第一步：统一信息入口 卡尔每天处理五六千条信息，分散在各处。他用三个插件解决入库问题： 飞书文档下载插件 — 批量转成 Markdown 导入 Obsidian Web Clipper — 抓网页，自动保留来源和 tag 微信笔记同步助手 — 微信内容直接同步进来 3️⃣视频和社交平台内容另有方案 X Reader 和 Agent Reach 可以覆盖小红书、公众号、B站、YouTube、抖音、GitHub，连评论区都能抓。 没看过的视频先存链接，确认值得看再用 AI 生成摘要收录，避免无效处理。 4️⃣第二步：搭 AI 能读懂的文件", "username": "WaytoAGI", "name": "WaytoAGI", "tag": "AI知识体系化"}, {"title": "😎", "link": "https://nitter.net/sundarpichai/status/2032309203369656521", "date": "Fri, 13 Mar 2026 04:14:07 GMT", "desc": "😎 Dieter Bohn (@backlon) Here's the video of the Android XR demo we showed last week at MWC :) Couple things that stand out to me: how well Gemini can handle vague and complex queries and how the glasses work with apps on the phone. 😎 More details here! teddit.net/r/AndroidXR/comme… Video — https://nitter.net/backlon/status/2032197021185270197#m", "username": "sundarpichai", "name": "Sundar Pichai", "tag": "Google CEO"}, {"title": "两周前，一个 Cloudflare 工程师用 AI 重新实现了 Next.js，Token 费用是1100美元。\n\n我觉得，这件事情对Next.js的打击非常大。\n\n代码的护城河不存在了，只要投入一小笔金钱，AI 就能复刻出大型软件。\n\n防止复刻的关键是测试用例，我写了一点看法《测试是新的护城河》。https://www.ruanyifeng.com/blog/2026/03/weekly-issue-388.html", "link": "https://nitter.net/ruanyf/status/2032258957369360859", "date": "Fri, 13 Mar 2026 00:54:27 GMT", "desc": "两周前，一个 Cloudflare 工程师用 AI 重新实现了 Next.js，Token 费用是1100美元。 我觉得，这件事情对Next.js的打击非常大。 代码的护城河不存在了，只要投入一小笔金钱，AI 就能复刻出大型软件。 防止复刻的关键是测试用例，我写了一点看法《测试是新的护城河》。ruanyifeng.com/blog/2026/03/…", "username": "ruanyf", "name": "阮一峰", "tag": "科技知识长文"}, {"title": "I recently spoke at the Sundance Film Festival on a panel about AI. Sundance is an annual gathering of filmmakers and movie buffs that serves as the premier showcase for independent films in the United States. Knowing that many people in Hollywood are extremely uncomfortable about AI, I decided to immerse myself for a day in this community to learn about their anxieties and build bridges.\n\nI’m grateful to Daniel Dae Kim @danieldaekim, an actor/producer/director I’ve come to respect deeply for his artistic and social work, for organizing the panel, which also included Daniel, Dan Kwan, Jonathan Wang, and Janet Yang. I found myself surrounded by award-winning filmmakers and definitely felt like the odd person out!\n\nFirst, Hollywood has many reasons to be uncomfortable with AI. People from the entertainment industry come from a very different culture than many who work in tech, and this drives deep differences in what we focus on and what we value. A significant subset of Hollywood is concerned that:\n- AI companies are taking their work to learn from it without consent and compensation. Whereas the software industry is used to open source and the open internet, Hollywood focuses much more on intellectual property, which underlies the core economic engines of the entertainment industry.\n- Powerful unions like SAG-AFTRA (Screen Actors Guild-American Federation of Television and Radio Artists) are deeply concerned about protecting the jobs of their members. When AI technology (or any other force) threatens the livelihoods of their members — like voice actors — they will fight mightily against potential job losses.\n- This wave of technological change feels forced on them more than previous waves, where they felt more free to adopt or reject the technology. For example, celebrities felt like it was up to them whether to use social media. In contrast, negative messaging from some AI leaders who present the technology as unstoppable, perhaps even a dangerous force that will wipe out many jobs, has not encouraged enthusiastic adoption.\n\nHaving said that, Hollywood is under no illusions that AI will change entertainment, and that if Hollywood does not adapt, perhaps some other place will become the new center for entertainment. The entertainment industry is no stranger to technology change. Radio, TV, computer graphics special effects, video streaming, and social media transformed the industry. But the path to navigating AI’s transformation is still unclear, and organizations like the new Creators Coalition on AI are trying to stake out positions. Unfortunately, Hollywood’s negative sentiment toward AI also means it will produce a lot more Terminator-like movies that portray AI as more dangerous than helpful, and this hurts beneficial AI adoption as well.\n\nThe interests of AI and Hollywood are not always aligned. (Every time I speak in a group like this as the “AI representative,” I can count on being asked very hard questions.) Most of us in tech would prefer a more open internet and more permissive use of creative works. But there is also much common ground, for example in wanting guardrails against deepfakes and a smooth transition for those whose jobs are displaced, perhaps via upskilling.\n\nStorytelling is hard. I’m optimistic that AI tools like Veo, Sora, Runway, Kling, Ray, Hailuo, and many others can make video creation easier for millions of people. I hope Hollywood and AI developers will find more opportunities to collaborate, find more common ground, and also steer our projects toward outcomes that are win-win for as many parties as possible.\n\n[Original text: https://www.deeplearning.ai/the-batch/issue-340/ ]", "link": "https://nitter.net/AndrewYNg/status/2022345770398347407", "date": "Fri, 13 Feb 2026 16:22:59 GMT", "desc": "I recently spoke at the Sundance Film Festival on a panel about AI. Sundance is an annual gathering of filmmakers and movie buffs that serves as the premier showcase for independent films in the United States. Knowing that many people in Hollywood are extremely uncomfortable about AI, I decided to immerse myself for a day in this community to learn about their anxieties and build bridges. I’m grateful to Daniel Dae Kim @danieldaekim, an actor/producer/director I’ve come to respect deeply for his", "username": "AndrewYNg", "name": "Andrew Ng", "tag": "AI教育"}, {"title": "We just launched Codex Security! \n\nProbably a no-brainer for most teams to turn on. Some things I'm excited about it:\n- Agentic security review leveraging our SOTA models\n- Always on codebase scanning \n- Detailed reports with code paths on vulnerabilities\n- Auto-fix any report with a PR\n\nTeams and enterprises can try it out through Codex web.", "link": "https://nitter.net/rohanvarma/status/2030002820515291215", "date": "Fri, 06 Mar 2026 19:29:22 GMT", "desc": "We just launched Codex Security! Probably a no-brainer for most teams to turn on. Some things I'm excited about it: - Agentic security review leveraging our SOTA models - Always on codebase scanning - Detailed reports with code paths on vulnerabilities - Auto-fix any report with a PR Teams and enterprises can try it out through Codex web. Video", "username": "sama", "name": "Sam Altman", "tag": "OpenAI CEO"}, {"title": "最近两三年，美国股市大涨。但是，我本周才知道有一类股票，不仅没涨，还下跌了。\n\n你真想不到，这种倒霉的股票就是软件股。\n\n不仅美国如此，我查了中国股市，软件股也没涨。\n\n为什么AI股一路高歌，不断上涨，软件股却阴跌不已？难道AI不属于软件吗？\n\n我写了一点自己的看法。https://www.ruanyifeng.com/blog/2026/02/weekly-issue-384.html", "link": "https://nitter.net/ruanyf/status/2019580372741480789", "date": "Fri, 06 Feb 2026 01:14:17 GMT", "desc": "最近两三年，美国股市大涨。但是，我本周才知道有一类股票，不仅没涨，还下跌了。 你真想不到，这种倒霉的股票就是软件股。 不仅美国如此，我查了中国股市，软件股也没涨。 为什么AI股一路高歌，不断上涨，软件股却阴跌不已？难道AI不属于软件吗？ 我写了一点自己的看法。ruanyifeng.com/blog/2026/02/…", "username": "ruanyf", "name": "阮一峰", "tag": "科技知识长文"}]};</script>
<script>
    let allTweets = [];
    let currentFilter = 'all';
    let currentSort = 'newest';
    let customUsers = [];
    
    // Default order
    const ORDER = ['kaifulee','dotey','nishuang','ruanyf','Huanusa','op7418','WaytoAGI','turingou','virushuo','Svwang1','tualatrix','gefei55','lidangzzz','lijigang','lxfater'];
    
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `toast show ${type}`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const now = new Date();
      const diff = now - d;
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      
      if (hours < 1) return '刚刚';
      if (hours < 24) return `${hours}小时前`;
      if (days < 7) return `${days}天前`;
      return d.toLocaleDateString('zh-CN', {month: 'short', day: 'numeric'});
    }
    
    function parseDate(dateStr) {
      if (!dateStr) return new Date(0);
      return new Date(dateStr);
    }
    
    function applySortAndFilter() {
      let tweets = [...allTweets];
      
      if (currentFilter !== 'all') {
        tweets = tweets.filter(t => t.username === currentFilter);
      }
      
      tweets.sort((a, b) => {
        const dateA = parseDate(a.date);
        const dateB = parseDate(b.date);
        return currentSort === 'newest' ? dateB - dateA : dateA - dateB;
      });
      
      renderTweets(tweets);
    }
    
    function renderTweets(tweets) {
      const container = document.getElementById('tweets');
      
      if (tweets.length === 0) {
        container.innerHTML = '<div class="empty">暂无推文</div>';
        return;
      }
      
      container.innerHTML = tweets.map(t => `
        <article class="tweet">
          <div class="tweet-header">
            <div class="avatar">${t.name ? t.name[0] : t.username[0]}</div>
            <div class="user-info">
              <div class="user-name">${t.name || t.username}</div>
              <div class="user-handle">@${t.username}</div>
            </div>
            <span class="tag">${t.tag || '自定义'}</span>
          </div>
          <div class="tweet-content">
            <p class="tweet-text">${escapeHtml(t.desc || t.title)}</p>
            <div class="tweet-meta">
              <span class="tweet-time">${formatDate(t.date)}</span>
              <a href="${t.link}" target="_blank" class="tweet-link">查看原文 →</a>
            </div>
          </div>
        </article>
      `).join('');
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function setupFilters() {
      const container = document.getElementById('filters');
      
      // Remove existing buttons except "all"
      container.querySelectorAll('.filter-btn:not([data-filter="all"])').forEach(b => b.remove());
      
      // Get all unique users
      const usersMap = {};
      allTweets.forEach(t => {
        if (!usersMap[t.username]) {
          usersMap[t.username] = t;
        }
      });
      
      const users = Object.keys(usersMap);
      
      // Sort: default order first, then custom
      users.sort((a, b) => {
        const aDefault = ORDER.includes(a);
        const bDefault = ORDER.includes(b);
        if (aDefault && !bDefault) return -1;
        if (!aDefault && bDefault) return 1;
        const aIdx = ORDER.indexOf(a);
        const bIdx = ORDER.indexOf(b);
        if (aIdx >= 0 && bIdx >= 0) return aIdx - bIdx;
        return 0;
      });
      
      users.forEach(username => {
        const tweet = usersMap[username];
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (customUsers.includes(username) ? ' custom' : '');
        btn.dataset.filter = username;
        btn.textContent = tweet.name || username;
        
        if (customUsers.includes(username)) {
          btn.innerHTML = `${tweet.name || username}<span class="remove" data-remove="${username}">×</span>`;
        }
        
        btn.onclick = (e) => {
          if (e.target.dataset.remove) {
            e.stopPropagation();
            removeCustomUser(e.target.dataset.remove);
            return;
          }
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = username;
          applySortAndFilter();
        };
        
        container.appendChild(btn);
      });
    }
    
    function removeCustomUser(username) {
      customUsers = customUsers.filter(u => u !== username);
      localStorage.setItem('customUsers', JSON.stringify(customUsers));
      allTweets = allTweets.filter(t => t.username !== username);
      document.getElementById('tweet-count').textContent = allTweets.length;
      setupFilters();
      applySortAndFilter();
      showToast(`已移除 @${username}`);
    }
    
    async function addCustomUser(username) {
      username = username.trim().toLowerCase().replace('@', '');
      if (!username) return;
      
      if (allTweets.some(t => t.username === username)) {
        showToast(`@${username} 已在列表中`, 'error');
        return;
      }
      
      showToast(`正在抓取 @${username}...`);
      
      try {
        const res = await fetch(`https://nitter.net/${username}/rss`);
        const text = await res.text();
        
        // Simple RSS parse
        const items = text.match(/<item>([\s\S]*?)<\/item>/g) || [];
        
        if (items.length === 0) {
          showToast(`未找到 @${username} 的推文`, 'error');
          return;
        }
        
        const newTweets = items.slice(0, 10).map(item => {
          const getContent = (tag) => {
            const match = item.match(new RegExp(`<${tag}>([\\s\\S]*?)<\\/${tag}>`));
            return match ? match[1].replace(/<[^>]+>/g, '').trim() : '';
          };
          const title = getContent('title');
          const link = getContent('link');
          const date = getContent('pubDate');
          const desc = getContent('description');
          
          return {
            title,
            link: link.replace('#m', ''),
            date,
            desc: desc.substring(0, 500),
            username,
            name: username,
            tag: '自定义'
          };
        });
        
        if (newTweets.length > 0) {
          allTweets = [...newTweets, ...allTweets];
          customUsers.push(username);
          localStorage.setItem('customUsers', JSON.stringify(customUsers));
          
          document.getElementById('tweet-count').textContent = allTweets.length;
          setupFilters();
          applySortAndFilter();
          showToast(`已添加 @${username}，${newTweets.length} 条推文`);
        }
      } catch (e) {
        console.error(e);
        showToast(`抓取失败: ${username}`, 'error');
      }
    }
    
    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'flex' : 'none';
    }
    
    async function loadData() {
      showLoading(true);
      
      try {
        let data = window.__FEED_DATA__;
        
        if (!data) {
          const res = await fetch('./data/feed.json');
          data = await res.json();
        }
        
        allTweets = data.tweets || [];
        
        // Load custom users
        try {
          customUsers = JSON.parse(localStorage.getItem('customUsers') || '[]');
        } catch (e) {
          customUsers = [];
        }
        
        document.getElementById('tweet-count').textContent = allTweets.length;
        document.getElementById('update-time').textContent = new Date(data.updated).toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
        
        setupFilters();
        applySortAndFilter();
      } catch (e) {
        console.error('Failed to load data:', e);
        document.getElementById('tweets').innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
      } finally {
        showLoading(false);
      }
    }
    
    function setupSortButtons() {
      document.querySelectorAll('.sort-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentSort = btn.dataset.sort;
          applySortAndFilter();
        };
      });
    }
    
    function setupRefresh() {
      document.getElementById('refresh-btn').onclick = () => {
        const btn = document.getElementById('refresh-btn');
        btn.disabled = true;
        btn.innerHTML = '<span>🔄</span> 刷新中...';
        
        try {
          applySortAndFilter();
        } finally {
          setTimeout(() => {
            btn.disabled = false;
            btn.innerHTML = '<span>🔄</span> 刷新';
          }, 500);
        }
      };
    }
    
    function setupAddForm() {
      const input = document.getElementById('add-input');
      const btn = document.getElementById('add-btn');
      
      const doAdd = () => {
        const username = input.value.trim();
        if (username) {
          addCustomUser(username);
          input.value = '';
        }
      };
      
      btn.onclick = doAdd;
      input.onkeydown = (e) => {
        if (e.key === 'Enter') doAdd();
      };
    }
    
    // Filter "all" button
    document.querySelector('[data-filter="all"]').onclick = () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-filter="all"]').classList.add('active');
      currentFilter = 'all';
      applySortAndFilter();
    };
    
    setupSortButtons();
    setupRefresh();
    setupAddForm();
    loadData();
  </script>
</body>
</html>
